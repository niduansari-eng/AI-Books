function gSumHTML(){
  var t = GE.type, T = gTotals();
  if(!isOwner) return '<div class="kpi"><span>Total quantity</span><b>'+fmt(T.qty)+'</b></div>';
  var h = '<div class="kpi"><span class="muted">Sub total</span><b>'+money2(T.amt)+'</b></div>';
  if(t==="INV" || (t==="PO" && GE.gstOn!==false)) h += '<div class="kpi"><span class="muted">GST @ '+(GST_RATE*100)+'%</span><b>'+money2(T.gst)+'</b></div>';
  if(t==="PO") h += '<div class="muted" style="font-size:12px;padding:2px 0 8px">Goes to inventory at '+money2(T.amt)+(GE.gstOn!==false ? ' (ex-GST cost; GST is input tax)' : ' (non-GST bill — full amount is cost)')+'</div>';
  else h += '<div class="muted" style="font-size:12px;padding:4px 0 8px">GST is added on the '+(t==="SO"?"invoice":"sale invoice")+'.</div>';
  h += '<div class="kpi" style="font-size:16px"><span style="font-weight:700">Total</span><b style="font-size:18px">'+money2(T.total)+'</b></div>';
  if((t==="INV"||t==="PO") && !GE.edit){
    var P = GE.pay; if(!P.mode) P.mode = "cash"; if(!P.chqDate) P.chqDate = todayDay();
    var kind = P.mode==="cash" ? "Cash" : "Bank";
    var list = accounts().filter(function(a){ return (a.kind||"Bank")===kind; });
    if(!list.some(function(a){ return a.name===P.acc; })) P.acc = list.length ? list[0].name : "";
    h += '<label style="display:flex;gap:8px;align-items:center;margin:10px 0 6px"><input type="checkbox" id="g_payon" style="width:auto"'+(P.on?" checked":"")+'> '+(t==="INV"?"Received now":"Paid now")+'</label>';
    if(P.on){
      h += '<div class="row c2"><div><label for="g_paymode">Payment type</label><select id="g_paymode">'
        +  [["cash","Cash"],["bank","Bank transfer"],["chq","Cheque"]].map(function(o){ return '<option value="'+o[0]+'"'+(P.mode===o[0]?" selected":"")+'>'+o[1]+'</option>'; }).join("")+'</select></div>'
        +  '<div><label for="g_payacc">'+(P.mode==="cash" ? "Cash account" : (P.mode==="chq" ? (t==="INV"?"Deposit to bank":"Drawn on bank") : "Bank"))+'</label>'
        +  (list.length ? '<select id="g_payacc">'+list.map(function(a){ return '<option'+(P.acc===a.name?" selected":"")+'>'+esc(a.name)+'</option>'; }).join("")+'</select>'
                        : '<div class="muted" style="font-size:12px;padding-top:10px">No bank account yet — add one in Bank Accounts.</div>')+'</div></div>';
      if(P.mode==="chq") h += '<div class="row c2"><div><label for="g_chqno">Cheque no.</label><input id="g_chqno" value="'+esc(P.chqNo)+'" placeholder="e.g. 004521"></div>'
        +  '<div><label for="g_chqdate">Cheque date (maturity)</label><input id="g_chqdate" type="date" value="'+esc(P.chqDate)+'"></div></div>';
      h += '<div class="row"><div><label for="g_payamt">Amount</label><input id="g_payamt" inputmode="decimal" value="'+esc(P.amt!==""?P.amt:Math.round(T.total))+'"></div></div>';
    }
    var paid = GE.pay.on ? Math.min(T.total, num(GE.pay.amt!==""?GE.pay.amt:T.total)) : 0;
    h += '<div class="kpi"><span style="font-weight:700;color:#2E9E5B">Balance</span><b style="color:#2E9E5B">'+money2(Math.max(0,T.total-paid))+'</b></div>';
  }
  return h;
}
function gLive(){
  GE.lines.forEach(function(L, i){ var a = $("g_amt_"+i); if(a && isOwner) a.textContent = fmt(num(L.qty)*num(L.rate),2); });
  var T = gTotals();
  if($("g_tkg")) $("g_tkg").textContent = fmt(T.kg,2);
  if($("g_tqty")) $("g_tqty").textContent = fmt(T.qty, T.qty%1?2:0);
  if($("g_tamt") && isOwner) $("g_tamt").textContent = fmt(T.amt,2);
  var sum = $("g_sum"); if(sum){ sum.innerHTML = gSumHTML(); wireGSum(); }
}
function wireGSum(){
  var po = $("g_payon"); if(po) po.onchange = function(){ GE.pay.on = po.checked; GE.pay.amt = ""; gLive(); };
  var pa = $("g_payamt"); if(pa) pa.onchange = function(){ GE.pay.amt = pa.value; gLive(); };
  var pc = $("g_payacc"); if(pc){ if(!GE.pay.acc) GE.pay.acc = pc.value; pc.onchange = function(){ GE.pay.acc = pc.value; saveUi(); }; }
  var pm = $("g_paymode"); if(pm) pm.onchange = function(){ GE.pay.mode = pm.value; GE.pay.acc = ""; gLive(); saveUi(); };
  var cn = $("g_chqno"); if(cn) cn.oninput = function(){ GE.pay.chqNo = cn.value; saveUi(); };
  var cd = $("g_chqdate"); if(cd) cd.onchange = function(){ GE.pay.chqDate = cd.value; saveUi(); };
}
function wireGrid(){
  if(view!=="entry" || !GE || !$("g_save")) return;
  var gp = $("g_party");
  gp.onchange = function(){
    if(gp.value==="__new__"){ gp.value = GE.party; openParty(); return; }
    GE.party = gp.value; GE.so = ""; GE.dcs = [];
    if(GE.type==="INV") GE.lines = [];
    render();
  };
  ["pono","podate","supref","note"].forEach(function(k){
    var el = $("g_"+k); if(!el) return;
    el.oninput = function(){ GE[{pono:"poNo",podate:"poDate",supref:"supRef",note:"note"}[k]] = el.value; saveUi();
      if(k==="pono" && GE.type==="SO" && $("g_no")) $("g_no").textContent = el.value.trim() || "Type the customer PO"; };
  });
  var gd = $("g_date"); if(gd) gd.onchange = function(){ GE.date = gd.value || todayDay(); render(); };
  var gt = $("g_terms"); if(gt) gt.onchange = function(){
    if(gt.value==="__new__"){ gt.value = GE.terms; openTermForm(function(d){ if(d){ GE.terms = d; } render(); }); return; }
    GE.terms = gt.value; $("g_due").textContent = dmy(gDue()); saveUi(); };
  var ai = $("g_alsoinv"); if(ai) ai.onchange = function(){ GE.alsoInv = ai.checked; };
  var gg = $("g_gst"); if(gg) gg.onchange = function(){ GE.gstOn = gg.value==="1"; GE.pay.amt = ""; gLive(); saveUi(); };
  var gs = $("g_so");
  if(gs) gs.onchange = function(){
    GE.so = gs.value;
    if(GE.so){
      var p = soPending(GE.party).filter(function(x){ return x.so===GE.so; })[0];
      if(p){ GE.lines = p.lines.map(function(l){ return {item:l.item, desc:l.desc, kg:"", qty:String(Math.min(l.qty, Math.max(0, invQty(l.item)))), rate:String(l.rate), so:GE.so}; });
             if(!GE.poNo) GE.poNo = p.custPo; }
    } else { GE.lines = [blankLine()]; }
    render();
  };
  Array.prototype.forEach.call(document.querySelectorAll("[data-gdc]"), function(b){
    b.onclick = function(){
      var no = b.dataset.gdc, k = GE.dcs.indexOf(no);
      if(k>=0) GE.dcs.splice(k,1); else GE.dcs.push(no);
      GE.lines = invLinesFor(GE.dcs);
      if(!GE.poNo){ var c = GE.lines[0] && GE.lines[0].src && GE.lines[0].src.custPo; if(c) GE.poNo = c; }
      render();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-gi]"), function(el){
    var i = parseInt(el.dataset.gi,10), f = el.dataset.f;
    if(f==="item") el.onchange = function(){
      var L = GE.lines[i]; L.item = el.value;
      if(!num(L.rate)) L.rate = GE.type==="PO" ? (invAvg(L.item) ? String(Math.round(invAvg(L.item)*100)/100) : "") : (lastRate(L.item) ? String(lastRate(L.item)) : "");
      if(i===GE.lines.length-1) GE.lines.push(blankLine());
      render();
    };
    else el.oninput = function(){ GE.lines[i][f] = el.value; gLive(); saveUi(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-grm]"), function(b){
    b.onclick = function(){ GE.lines.splice(parseInt(b.dataset.grm,10),1); if(!GE.lines.length) GE.lines.push(blankLine()); render(); };
  });
  var ga = $("g_add"); if(ga) ga.onclick = function(){ GE.lines.push(blankLine()); render(); };
  $("g_cancel").onclick = function(){ var t = GE.type; GE = null; view = t==="PO" ? "purchase" : "sale"; render(); };
  $("g_save").onclick = saveGrid;
  wireGSum();
}
function saveGrid(){
  var t = GE.type;
  if(!GE.party){ toast("Pick the "+(t==="PO"?"supplier":"customer")); return; }
  var ls = GE.lines.filter(function(L){ return L.item && num(L.qty) > 0; });
  if(!ls.length){ toast(t==="INV" ? "Tick at least one delivery challan" : "Add at least one item with a quantity"); return; }
  if(t==="PO" && ls.some(function(L){ return num(L.rate) <= 0; })){ toast("Enter the rate for every line"); return; }
  if(t==="DC"){
    var need = {};
    ls.forEach(function(L){ need[L.item] = (need[L.item]||0) + num(L.qty); });
    var back = {}; if(GE.edit) GE.edit.rows.forEach(function(r){ back[r.description] = (back[r.description]||0) + num(r.qty); });
    var avail = function(n){ return invQty(n) + (back[n]||0); };
    var short = Object.keys(need).filter(function(n){ return need[n] > avail(n) + 0.0001; })[0];
    if(short){ toast("Only "+fmt(Math.max(0,avail(short)),2)+" "+itemUnit(short)+" of "+short+" in stock"); return; }
    if(ls.some(function(L){ return num(L.rate) <= 0; })){ toast("Enter the price for every line"); return; }
  }
  var n = GE.edit ? GE.edit.created : Date.now(), day = GE.date || todayDay(), no = gNo(), rows = [];
  if(t==="SO"){
    if(!no){ toast("Enter the customer PO number — it becomes the Sale Order number"); return; }
    if(!GE.edit && soNumbers().some(function(x){ return String(x).toLowerCase()===no.toLowerCase(); })){ toast("Sale order "+no+" already exists"); return; }
  }
  var base = {costingQty:0, matName:"", matQty:0, forSo:"", payKind:"", material:0, dyeing:0, labour:0, printing:0, overhead:0};
  if(t==="SO") ls.forEach(function(L){ rows.push(Object.assign({type:"SO", created:n, date:day+"T00:00:00.000Z", customer:GE.party, poNo:no, docNo:"",
    description:L.item, category:itemCat(L.item)||CATS[0], qty:num(L.qty), rate:num(L.rate), spec:L.desc||"", poStatus:"Actual", deduction:0,
    custPo:GE.poNo||"", custPoDate:GE.poDate||"", note:GE.note||""}, base)); });
  if(t==="PO") ls.forEach(function(L){ rows.push(Object.assign({type:"PO", created:n, date:day+"T00:00:00.000Z", customer:GE.party, poNo:"", docNo:no,
    refNo:GE.supRef||"", description:L.item, category:itemCat(L.item)||"", qty:num(L.qty), rate:num(L.rate), spec:L.desc||"", poStatus:"", deduction:0,
    dueDate:gDue(), note:GE.note||"", taxRate: GE.gstOn===false ? 0 : GST_RATE}, base)); });
  if(t==="DC") ls.forEach(function(L){ rows.push(Object.assign({type:"DC", created:n, date:day+"T00:00:00.000Z", customer:GE.party, poNo:L.so||"", docNo:no,
    description:L.item, category:itemCat(L.item)||"", qty:num(L.qty), rate:num(L.rate), spec:L.desc||"", kgQty:num(L.kg), poStatus:"", deduction:0,
    custPo:GE.poNo||"", custPoDate:GE.poDate||"", note:GE.note||""}, base)); });
  var invNo = "", invRowsNew = [];
  function invRow(src, dcNo, rate, invDay, spec){
    return Object.assign({type:"INV", created:n, date:invDay+"T00:00:00.000Z", customer:GE.party, poNo:src.poNo||"", docNo:invNo, dcRef:dcNo,
      description:src.description, category:src.category||"", qty:num(src.qty), rate:num(rate), deduction:num(src.deduction), spec:(spec!==undefined ? spec : src.spec)||"", kgQty:num(src.kgQty),
      dueDate:gDue(), note:GE.note||"", custPo:GE.poNo||"", custPoDate:GE.poDate||"", poStatus:""}, base);
  }
  if(t==="INV"){
    invNo = no;
    ls.forEach(function(L){ invRowsNew.push(invRow(L.src, L.dc, L.rate, day, L.desc)); });
  }
  if(t==="DC" && GE.alsoInv && !GE.edit){
    invNo = nextInvNo();
    rows.forEach(function(r){ invRowsNew.push(invRow(r, no, r.rate, day)); });
  }
  rows = rows.concat(invRowsNew);
  /* money received / paid now */
  if((t==="INV"||t==="PO") && GE.pay.on && !GE.edit){
    var T = gTotals(), amt = Math.min(T.total, num(GE.pay.amt!==""?GE.pay.amt:T.total)), P = GE.pay;
    if(P.mode!=="cash" && !P.acc){ toast("Add a bank account first (Cash, Bank & Assets → Bank Accounts)"); return; }
    if(P.mode==="chq" && !String(P.chqNo||"").trim()){ toast("Enter the cheque number"); return; }
    if(P.mode==="chq" && !P.chqDate){ toast("Enter the cheque date"); return; }
    var how = P.mode==="chq" ? " by cheque "+String(P.chqNo).trim() : (P.mode==="bank" ? " by bank transfer" : " in cash");
    if(amt > 0.5) rows.push(Object.assign({type:"PAY", created:n, date:new Date(n).toISOString(), txnDate:day, payKind: t==="INV"?"AR":"AP",
      customer:GE.party, docNo:no, qty:Math.round(amt*100)/100, wht:0, rate:0, account:P.acc||DEFAULT_ACCOUNT, toAccount:"",
      chqNo: P.mode==="chq" ? String(P.chqNo).trim() : "", chqDate: P.mode==="chq" ? P.chqDate : "", payMode:P.mode,
      description:(t==="INV"?"Received with invoice ":"Paid with bill ")+no+how, poNo:"", category:"", poStatus:"", deduction:0}, base));
  }
  var btn = $("g_save"); btn.disabled = true; btn.textContent = "Saving…";
  var ed = GE.edit, docOnly = rows.filter(function(r){ return r.type===t; });
  saveRows(rows).then(function(){
    if(ed) return Promise.all(ed.ids.map(function(id){ return deleteRow(id); }));
  }).then(function(){
    if(ed) logHist(t, no, "Edited", docDiff(ed.rows, docOnly));
    else {
      logHist(t, no, "Created", docSummary(docOnly));
      if(invNo){ var invL = rows.filter(function(r){ return r.type==="INV"; });
        if(t==="DC") logHist("INV", invNo, "Created", docSummary(invL)+" · from "+no);
        uniq(invL.map(function(r){ return r.dcRef; })).forEach(function(d){ logHist("DC", d, "Invoiced", "Converted to invoice "+invNo); }); }
    }
    toast(GRID_T[t]+" "+no+(ed ? " updated" : " saved")+(invNo && t==="DC" ? " · invoice "+invNo : ""));
    GE = null;
    if(t==="PO"){ view = "purchase"; purTab = "bill"; } else { view = "sale"; saleTab = t==="SO" ? "so" : (t==="DC" ? "dc" : "inv"); }
    render();
  }).catch(function(){ btn.disabled = false; btn.textContent = "Save "+GRID_T[t]; toast("Could not save — try again"); });
}

/* ================= document actions: ⋮ menu, edit, delete, cancel, duplicate, history ================= */
var histRows = [], myUserId = null, userCap = null, dcSel = {};
var DOC_TYPES = {SO:1, DC:1, INV:1, PO:1};
function logHist(docType, docNo, action, summary){
  var n = Date.now();
  return saveRows([{type:"HIST", created:n, date:new Date(n).toISOString(), docType:docType, docNo:docNo, action:action,
    summary:summary||"", by:curUser ? curUser.uid : (myUserId||""), byName:curUser ? curUser.name : "", role:isOwner?"Owner":"Staff"}]).catch(function(){});
}
function docRowsOf(type, no){
  if(type==="SO") return entries.filter(function(e){ return e.type==="SO" && e.poNo===no; });
  return entries.filter(function(e){ return (e.type===type || (type==="INV" && e.type==="INVX")) && e.docNo===no; });
}
function dcInvMap(){
  var m = {};
  invRows().forEach(function(e){ if(e.dcRef && !m[e.dcRef]) m[e.dcRef] = {no:e.docNo, day:entryDay(e)}; });
  return m;
}
function uniq(a){ var s = {}, o = []; a.forEach(function(x){ if(x && !s[x]){ s[x] = 1; o.push(x); } }); return o; }
function docSummary(rows){
  var q = 0, v = 0; rows.forEach(function(r){ q += num(r.qty); v += num(r.qty)*num(r.rate); });
  return rows.length+" line"+(rows.length>1?"s":"")+" · qty "+fmt(q)+(isOwner ? " · Rs "+fmt(v,2) : "");
}
function docDiff(a, b){
  var out = [], a0 = a[0]||{}, b0 = b[0]||{};
  if(a0.customer!==b0.customer) out.push("Party: "+a0.customer+" → "+b0.customer);
  if(entryDay(a0)!==entryDay(b0)) out.push("Date: "+dmy(entryDay(a0))+" → "+dmy(entryDay(b0)));
  if((a0.dueDate||"")!==(b0.dueDate||"")) out.push("Due date: "+(dmy(a0.dueDate)||"—")+" → "+(dmy(b0.dueDate)||"—"));
  if(a0.type!=="SO" && (a0.custPo||"")!==(b0.custPo||"")) out.push("PO No.: "+(a0.custPo||"—")+" → "+(b0.custPo||"—"));
  if((a0.refNo||"")!==(b0.refNo||"")) out.push("Supplier bill no.: "+(a0.refNo||"—")+" → "+(b0.refNo||"—"));
  if((a0.note||"")!==(b0.note||"")) out.push("Description text changed");
  function key(r){ return r.description+"|"+(r.dcRef||""); }
  var A = {}, B = {};
  a.forEach(function(r){ A[key(r)] = r; }); b.forEach(function(r){ B[key(r)] = r; });
  Object.keys(A).forEach(function(k){
    var x = A[k], y = B[k];
    if(!y){ out.push("Removed "+x.description+" ("+fmt(num(x.qty))+")"); return; }
    if(num(x.qty)!==num(y.qty)) out.push(x.description+" qty "+fmt(num(x.qty))+" → "+fmt(num(y.qty)));
    if(num(x.rate)!==num(y.rate)) out.push(x.description+" price "+fmt(num(x.rate),2)+" → "+fmt(num(y.rate),2));
    if((x.spec||"")!==(y.spec||"")) out.push(x.description+" description \""+(x.spec||"")+"\" → \""+(y.spec||"")+"\"");
  });
  Object.keys(B).forEach(function(k){ if(!A[k]) out.push("Added "+B[k].description+" ("+fmt(num(B[k].qty))+")"); });
  return out.length ? out.join("\n") : "Saved with no changes";
}

/* ---- the actions for one document ---- */
function printModelOf(t){
  if(t.type==="INV") return invPrintModel(t.key);
  if(t.type==="PO") return poPrintModel(t.key);
  if(t.type==="DC") return dcPrintModel(t.key);
  return null;
}
function docActions(t){
  var A = [], ty = t.type, own = isOwner;
  function add(label, go, danger){ A.push({label:label, go:go, danger:!!danger}); }
  add(t.cancelled ? "View" : "View/Edit", function(){ if(t.cancelled) openPrint(printModelOf(t)); else editDoc(t); });
  if(ty==="INV" && own && !t.cancelled && t.bal > 0.5) add("Receive Payment", function(){ openPay(t.key, "AR"); });
  if(ty==="PO" && own && t.bal > 0.5) add("Make Payment", function(){ openPay(t.key, "AP"); });
  if(ty==="INV" && own && !t.cancelled) add("Convert To Return", function(){ openDocForm("CN", {party:t.party, ref:t.key}); });
  if(ty==="INV") add("Preview Delivery Challan", function(){ previewDcOf(t); });
  if(ty==="DC" && !dcInvMap()[t.key]) add("Convert To Sale", function(){ convertDcs([t.key]); });
  if(ty==="INV" && own && !t.cancelled) add("Cancel Invoice", function(){ cancelInvoice(t); }, true);
  if(own) add("Delete", function(){ deleteDoc(t); }, true);
  add("Duplicate", function(){ duplicateDoc(t); });
  if(printModelOf(t) && (own || ty==="DC")){
    add("Open PDF", function(){ savePdf(printModelOf(t)); });
    add("Preview", function(){ openPrint(printModelOf(t)); });
    add("Print", function(){ printNow(printModelOf(t)); });
  }
  add("View History", function(){ openHistory(t); });
  return A;
}
function closeRowMenu(){ var m = document.querySelector(".rowmenu"); if(m) m.parentNode.removeChild(m); }
function openRowMenu(btn, t){
  closeRowMenu();
  var acts = docActions(t), r = btn.getBoundingClientRect();
  var m = document.createElement("div"); m.className = "rowmenu"; m.setAttribute("role","menu");
  m.innerHTML = acts.map(function(a, i){ return '<button role="menuitem" data-ra="'+i+'"'+(a.danger?' class="dz"':'')+'>'+esc(a.label)+'</button>'; }).join("");
  document.body.appendChild(m);
  var h = m.offsetHeight, w = m.offsetWidth;
  var top = r.bottom + 4; if(top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 4);
  m.style.top = top+"px"; m.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.right - w))+"px";
  Array.prototype.forEach.call(m.querySelectorAll("[data-ra]"), function(b){
    b.onclick = function(ev){ ev.stopPropagation(); closeRowMenu(); acts[parseInt(b.dataset.ra,10)].go(); };
  });
}
document.addEventListener("click", function(ev){ if(!(ev.target.closest && ev.target.closest(".rowmenu,[data-otxn]"))) closeRowMenu(); });
window.addEventListener("scroll", closeRowMenu, true);
window.addEventListener("resize", closeRowMenu);
function openActionSheet(t){
  var acts = docActions(t);
  openChooser(esc(GRID_T[t.type]||"")+" "+esc(t.key)+(t.cancelled?" · cancelled":""),

}

/* ---- confirm box (no browser dialogs) ---- */
function confirmBox(title, msg, okLabel, fn){
  $("modalHost").innerHTML = '<div class="modal" id="mOverlay"><div class="sheet" style="max-width:440px"><h2>'+esc(title)+'</h2>'
    + '<p class="muted" style="font-size:14px;margin:8px 0 16px;white-space:pre-line">'+esc(msg)+'</p>'
    + (okLabel ? '<div style="display:flex;gap:10px"><button class="btn sec" id="cb_no" style="flex:1">Keep it</button><button class="btn danger" id="cb_ok" style="flex:1">'+esc(okLabel)+'</button></div>'
               : '<button class="btn sec" id="cb_no">OK</button>')+'</div></div>';
  $("cb_no").onclick = closeEdit;
  $("mOverlay").addEventListener("click", function(ev){ if(ev.target.id==="mOverlay") closeEdit(); });
  if($("cb_ok")) $("cb_ok").onclick = function(){ $("cb_ok").disabled = true; fn(); };
}

/* ---- edit ---- */
function editDoc(t){
  var type = t.type;
  if(t.cancelled){ openPrint(printModelOf(t)); return; }
  var rows = docRowsOf(type, t.key); if(!rows.length) return;
  if(type==="DC"){ var b = dcInvMap()[t.key];
    if(b){ confirmBox("Already invoiced", t.key+" is billed in invoice "+b.no+".\nTo change it, cancel or delete that invoice first.", "", null); return; } }
  var r0 = rows[0];
  var lines = rows.map(function(r){ return {item:r.description, desc:r.spec||"", kg:"", qty:String(num(r.qty)), rate:String(num(r.rate)),
    so: type==="DC" ? (r.poNo||"") : "", dc:r.dcRef||"", src:r}; });
  if(type!=="INV") lines.push(blankLine());
  var pre = {party:r0.customer, date:entryDay(r0), poNo: type==="SO" ? r0.poNo : (r0.custPo||""), poDate:r0.custPoDate||"",
    supRef:r0.refNo||"", note:r0.note||"", lines:lines, terms: r0.dueDate ? "keep" : "default", dueFixed:r0.dueDate||"",
    gstOn: rowTax(r0) > 0,
    edit:{no:t.key, ids:rows.map(function(r){ return r.id; }), created:r0.created||Date.now(), rows:rows, dcs:uniq(rows.map(function(r){ return r.dcRef; }))}};
  if(type==="INV") pre.dcs = pre.edit.dcs.slice();
  if(type==="DC") pre.so = r0.poNo||"";
  startGrid(type, pre);
}

/* ---- delete ---- */
function deleteDoc(t){
  var type = t.type, no = t.key, rows = docRowsOf(type, no), why = "";
  if(type==="DC"){ var b = dcInvMap()[no]; if(b) why = "It is billed in invoice "+b.no+". Cancel or delete that invoice first."; }
  if(type==="SO" && entries.some(function(e){ return e.type==="DC" && e.poNo===no; })) why = "Delivery challans are posted against this order.";
  if(type==="SO" && entries.some(function(e){ return e.type==="WO" && e.poNo===no; })) why = why || "Manufacturing is posted against this order.";
  if((type==="INV"||type==="PO") && payRows().some(function(e){ return e.docNo===no && e.payKind===(type==="INV"?"AR":"AP"); }))
    why = "A payment is recorded against it. Delete that payment first (Cash & Bank).";
  if(type==="INV" && entries.some(function(e){ return e.type==="CN" && e.refDoc===no; })) why = why || "A credit note refers to it.";
  if(why){ confirmBox("Can't delete "+no, why, "", null); return; }
  confirmBox("Delete "+(GRID_T[type]||"")+" "+no+"?", "All its lines are removed"+(type==="INV"?" and its delivery challans go back to unbilled":"")+". The edit history is kept.", "Delete", function(){
    Promise.all(rows.map(function(r){ return deleteRow(r.id); })).then(function(){
      logHist(type, no, "Deleted", docSummary(rows)); closeEdit(); toast(no+" deleted");
    }).catch(function(){ closeEdit(); toast("Could not delete — try again"); });
  });
}

/* ---- cancel invoice: keeps the number, removes it from balances, frees its DCs ---- */
function cancelInvoice(t){
  var no = t.key, rows = docRowsOf("INV", no).filter(function(e){ return e.type==="INV"; });
  if(payRows().some(function(e){ return e.docNo===no && e.payKind==="AR"; })){ confirmBox("Can't cancel "+no, "A payment is recorded against it. Delete that payment first.", "", null); return; }
  confirmBox("Cancel invoice "+no+"?", "The invoice stays in the list as Cancelled and its number is not reused.\nIt comes off the customer's balance and its delivery challans go back to unbilled.", "Cancel invoice", function(){
    Promise.all(rows.map(function(r){ return updateRow(r.id, {type:"INVX"}); })).then(function(){
      logHist("INV", no, "Cancelled", docSummary(rows)); closeEdit(); toast(no+" cancelled");
    }).catch(function(){ closeEdit(); toast("Could not cancel — try again"); });
  });
}

/* ---- duplicate ---- */
function duplicateDoc(t){
  var rows = docRowsOf(t.type, t.key); if(!rows.length) return;
  var r0 = rows[0];
  var lines = rows.map(function(r){ return {item:r.description, desc:r.spec||"", kg:"", qty:String(num(r.qty)), rate:String(num(r.rate)), so:""}; });
  lines.push(blankLine());
  if(t.type==="INV"){
    startGrid("DC", {party:r0.customer, lines:lines, alsoInv:true, poNo:r0.custPo||"", note:r0.note||""});
    toast("Invoices come from a delivery challan — this copy makes the DC and the invoice together");
    return;
  }
  startGrid(t.type, {party:r0.customer, lines:lines, note:r0.note||"", poNo: t.type==="SO" ? "" : (r0.custPo||""), gstOn: rowTax(r0) > 0});
}

/* ---- DC → invoice ---- */
function invLinesFor(dcNos){
  var out = [];
  dcDocs().forEach(function(d){
    if(dcNos.indexOf(d.docNo) < 0) return;
    d.lines.forEach(function(e){ out.push({item:e.description, desc:e.spec||"", kg:"", qty:num(e.qty), rate:num(e.rate), dc:d.docNo, src:e}); });
  });
  return out;
}
function convertDcs(dcNos){
  var docs = dcDocs().filter(function(d){ return dcNos.indexOf(d.docNo) >= 0 && !d.billed; });
  if(!docs.length){ toast("Pick open delivery challans"); return; }
  var party = docs[0].customer;
  if(docs.some(function(d){ return d.customer!==party; })){ toast("Pick challans of one customer only"); return; }
  var nos = docs.map(function(d){ return d.docNo; }), c = (docs[0].lines[0]||{}).custPo || "";
  dcSel = {};
  startGrid("INV", {party:party, dcs:nos, lines:invLinesFor(nos), poNo:c});
}
function previewDcOf(t){
  var dcs = uniq(docRowsOf("INV", t.key).map(function(e){ return e.dcRef; }));
  if(!dcs.length){ toast("No delivery challan on this invoice"); return; }
  if(dcs.length===1){ openPrint(dcPrintModel(dcs[0])); return; }
  openChooser("Which delivery challan?", dcs.map(function(d){ return {t:esc(d), s:"", go:function(){ openPrint(dcPrintModel(d)); }}; }));
}

/* ---- PDF / print without the preview ---- */
function savePdf(m){
  if(!m){ toast("Nothing to print"); return; }
  toast("Making PDF…");
  var fname = String(m.file||"Document").replace(/[\\\/:*?"<>|]+/g," ").trim()+".pdf";
  makePdfBlob(m).then(function(blob){
    return (window.claude && claude.use ? claude.use("downloads") : Promise.resolve(null)).then(function(dl){
      if(dl) return dl.save({filename:fname, data:blob}).then(function(){ toast("PDF ready"); }, function(err){ if(err && err.code==="declined") return; toast("Could not save the PDF"); });
      var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fname;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    });
  }).catch(function(){ toast("Could not make the PDF — check the internet and try again"); });
}
function printNow(m){
  if(!m){ toast("Nothing to print"); return; }
  $("printHost").innerHTML = docHTML(m);
  setTimeout(function(){ try { window.print(); } catch(err){ toast("Printing is not available here — use Open PDF"); } }, 50);
}

/* ---- history ---- */
function openHistory(t){
  var type = t.type, no = t.key, rows = docRowsOf(type, no);
  var list = histRows.filter(function(h){ return h.docType===type && h.docNo===no; }).slice()
    .sort(function(a,b){ return (b.created||0) - (a.created||0); });
  if(!list.some(function(h){ return h.action==="Created"; }) && rows.length){
    var first = rows.reduce(function(m, r){ return Math.min(m, r.created||m); }, Infinity);
    list.push({created:first, action:"Created", summary:docSummary(rows.filter(function(r){ return r.type!=="INVX" || true; })), by:"", role:"", synthetic:true});
  }
  function when(ms){ try{ return new Date(ms).toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } }
  var COL = {Created:"var(--c-dc)", Edited:"#C77700", Cancelled:"var(--bad)", Deleted:"var(--bad)", Invoiced:"var(--primary)"};
  function draw(names){
    var h = '<div class="modal" id="mOverlay"><div class="sheet" style="max-width:620px"><h2>History &middot; '+esc(no)+'</h2>'
      + '<p class="muted" style="font-size:13px;margin:4px 0 14px">'+esc(GRID_T[type]||"")+(t.party?' &middot; '+esc(t.party):'')+'</p>';
    if(!list.length) h += '<div class="empty">No history yet.</div>';
    h += '<div class="hist">';
    list.forEach(function(x){
      var who = x.byName || (x.by && names[x.by]) || x.role || "";
      h += '<div class="hrow"><span class="hdot" style="background:'+(COL[x.action]||"var(--muted)")+'"></span><div>'
        +  '<div><b>'+esc(x.action)+'</b> <span class="muted" style="font-size:12px">'+esc(when(x.created))+(who?' &middot; '+esc(who):'')+(x.synthetic?' &middot; before history was kept':'')+'</span></div>'
        +  (x.summary ? '<div class="muted" style="font-size:13px;white-space:pre-line;margin-top:2px">'+esc(x.summary)+'</div>' : '')+'</div></div>';
    });
    h += '</div><button class="btn sec" id="hs_close" style="margin-top:14px">Close</button></div></div>';
    $("modalHost").innerHTML = h;
    $("hs_close").onclick = closeEdit;
    $("mOverlay").addEventListener("click", function(ev){ if(ev.target.id==="mOverlay") closeEdit(); });
  }
  draw({});
  var ids = uniq(list.map(function(x){ return x.by; }));
  if(userCap && ids.length && userCap.profiles){
    try{ userCap.profiles(ids).then(function(ps){
      var names = {}; ids.forEach(function(id){ var p = ps && ps[id]; if(p && p.name) names[id] = p.name; });
      if($("hs_close")) draw(names);
    }).catch(function(){}); }catch(e){}
  }
}

/* ================= Tax report: GST (sales tax) + WHT by month ================= */
var taxMonth = "";
function taxMonths(){
  var seen = {}, out = [];
  entries.forEach(function(e){ if(e.type==="INV"||e.type==="PO"||e.type==="CN"||e.type==="DN"||e.type==="PAY"){ var m = (e.type==="PAY"?txnDay(e):entryDay(e)).slice(0,7); if(m && !seen[m]){ seen[m]=1; out.push(m); } } });
  var cur = todayDay().slice(0,7); if(!seen[cur]) out.push(cur);
  return out.sort().reverse();
}
function monLabel(m){ return m==="all" ? "All months" : MON[parseInt(m.slice(5,7),10)-1]+" "+m.slice(0,4); }
function taxData(m){
  var inM = function(d){ return m==="all" || String(d||"").slice(0,7)===m; };
  var out = invDocs().filter(function(r){ return inM(r.day); }).map(function(r){ var p = partyRec(r.customer)||{};
    return {day:r.day, no:r.docNo, party:r.customer, reg:p.gst||p.ntn||"", net:r.net, gst:r.gst, gross:r.gross}; });
  var cn = noteDocs("CN").filter(function(r){ return inM(r.day); }).map(function(r){ var p = partyRec(r.party)||{};
    return {day:r.day, no:r.docNo, party:r.party, reg:p.gst||p.ntn||"", net:-r.net, gst:-r.gst, gross:-r.gross, note:"Credit note"+(r.ref?" vs "+r.ref:"")}; });
  var inp = [], nonGst = {n:0, amt:0};
  poDocs().filter(function(r){ return inM(r.day); }).forEach(function(r){
    var row0 = buyRows().filter(function(e){ return e.docNo===r.docNo; })[0] || {}, p = partyRec(r.supplier)||{};
    if(r.gst < 0.005){ nonGst.n++; nonGst.amt += r.net; return; }
    inp.push({day:r.day, no:r.docNo, ref:row0.refNo||"", party:r.supplier, reg:p.gst||p.ntn||"", net:r.net, gst:r.gst, gross:r.gross});
  });
  var dn = noteDocs("DN").filter(function(r){ return inM(r.day); }).map(function(r){ var p = partyRec(r.party)||{};
    return {day:r.day, no:r.docNo, ref:"", party:r.party, reg:p.gst||p.ntn||"", net:-r.net, gst:-r.gst, gross:-r.gross, note:"Debit note"+(r.ref?" vs "+r.ref:"")}; });
  var whtR = 0, whtP = 0, whtD = 0, gstD = 0;
  payRows().forEach(function(e){ if(e.payKind==="GSTP"){ if(inM(e.taxPeriod || txnDay(e))) gstD += num(e.qty); return; }
    if(!inM(txnDay(e))) return;
    if(e.payKind==="AR") whtR += num(e.wht); if(e.payKind==="AP") whtP += num(e.wht); if(e.payKind==="WHTP") whtD += num(e.qty); });

  return {out:outRows, inp:inRows, outGst:sum(outRows,"gst"), outNet:sum(outRows,"net"), inGst:sum(inRows,"gst"), inNet:sum(inRows,"net"), nonGst:nonGst, whtR:whtR, whtP:whtP, whtD:whtD, gstD:gstD};
}

var users = [], usersReady = false, usersSub = null, curUser = null, claudeAdmin = false;
var authStep = "", authUid = "", authErr = "", authTries = 0, authLockUntil = 0;
var SESS_KEY = "hs_sess1", LAST_KEY = "hs_last1", IDLE_MS = 30*60*1000, lastActive = Date.now();
function ucoll(){ return db.collection("users"); }
function loadUsers(){
  if(usersSub || !db) return;
  usersSub = ucoll().onSnapshot(function(snap){
    var out = [];
    snap.docs.forEach(function(d){ var v = d.data(); if(!v) return; var o = {}; Object.keys(v).forEach(function(k){ o[k] = v[k]; }); o.id = d.id; out.push(o); });
    users = out.sort(function(a,b){ return (a.created||0) - (b.created||0); });
    usersReady = true;
    if(curUser){ var me = users.filter(function(u){ return u.id===curUser.id; })[0];
      if(!me || me.active===false || !me.passHash){ logout(true); } else { curUser = me; applyAccess(); } }
    else restoreSession();
    render();
  }, function(){ usersReady = true; render(); });
}
function findUser(uidStr){ uidStr = String(uidStr||"").trim().toLowerCase(); return users.filter(function(u){ return String(u.uid).toLowerCase()===uidStr; })[0] || null; }
function hashPin(u, pin){
  var msg = "hisaab|" + (u.salt||"") + "|" + String(u.uid).toLowerCase() + "|" + pin;
  try{
    if(window.crypto && crypto.subtle && window.TextEncoder){
      return crypto.subtle.digest("SHA-256", new TextEncoder().encode(msg)).then(function(buf){
        return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ("0"+b.toString(16)).slice(-2); }).join("");
      });
    }
  }catch(e){}
  var h = 2166136261; for(var i=0;i<msg.length;i++){ h ^= msg.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return Promise.resolve("f" + h.toString(16));
}
function applyAccess(){ isOwner = !!curUser && curUser.access!=="staff"; ownerNote = ""; }
function startSession(u){
  curUser = u; applyAccess(); lastActive = Date.now(); authStep = ""; authErr = ""; authTries = 0;
  try{ localStorage.setItem(SESS_KEY, JSON.stringify({id:u.id, at:Date.now()})); localStorage.setItem(LAST_KEY, u.uid); }catch(e){}
}
function restoreSession(){
  if(curUser) return;
  try{
    var s = JSON.parse(localStorage.getItem(SESS_KEY)||"null"); if(!s) return;
    if(Date.now() - (s.at||0) > IDLE_MS){ localStorage.removeItem(SESS_KEY); return; }
    var u = users.filter(function(x){ return x.id===s.id; })[0];
    if(u && u.active!==false && u.passHash){ curUser = u; applyAccess(); lastActive = Date.now(); }
  }catch(e){}
}
function logout(silent){
  saveUiNow();
  curUser = null; isOwner = false; authStep = ""; authErr = "";
  try{ localStorage.removeItem(SESS_KEY); }catch(e){}
  closeEdit(); render(); if(!silent) toast("Logged out");
}
function touchActive(){
  lastActive = Date.now();
  if(curUser){ try{ localStorage.setItem(SESS_KEY, JSON.stringify({id:curUser.id, at:lastActive})); }catch(e){} }
}
var _touchT = 0;
["click","keydown","touchstart"].forEach(function(ev){ document.addEventListener(ev, function(){ var n = Date.now(); if(n - _touchT > 20000){ _touchT = n; touchActive(); } }, true); });
setInterval(function(){ if(curUser && Date.now() - lastActive > IDLE_MS){ logout(true); toast("Locked after 30 minutes without use"); } }, 60000);

function pinOk(p){ return /^\d{4}$/.test(p); }
function wireAuth(){
  var ids = ["au_uid","au_pin","au_p1","au_p2","au_name"];
  ids.forEach(function(id){ var el = $(id); if(el && el.classList.contains("pinbox")) el.oninput = function(){ el.value = el.value.replace(/\D/g,"").slice(0,4); }; });
  function enter(id, fn){ var el = $(id); if(el) el.onkeydown = function(ev){ if(ev.key==="Enter") fn(); }; }
  var setup = $("au_setup");
  if(setup){
    var doSetup = function(){
      var name = String($("au_name").value||"").trim(), id = String($("au_uid").value||"").trim().toLowerCase(), p1 = $("au_p1").value, p2 = $("au_p2").value;
      if(!name){ authErr = "Enter your name"; render(); return; }
      if(!/^[a-z0-9._-]{3,20}$/.test(id)){ authErr = "User ID: 3–20 letters or numbers, no spaces"; render(); return; }
      if(!pinOk(p1)){ authErr = "Passcode must be 4 digits"; render(); return; }
      if(p1!==p2){ authErr = "The two passcodes do not match"; render(); return; }
      var u = {uid:id, name:name, access:"full", admin:true, active:true, salt:uid(), created:Date.now()};
      setup.disabled = true;
      hashPin(u, p1).then(function(hx){ u.passHash = hx; u.setAt = Date.now(); var docId = uid();
        return ucoll().doc(docId).set(u).then(function(){ u.id = docId; startSession(u); render(); toast("Welcome, "+name); }); })
        .catch(function(){ setup.disabled = false; authErr = "Could not save — try again"; render(); });
    };
    setup.onclick = doSetup; enter("au_p2", doSetup);
  }
  var go = $("au_go");
  if(go){
    var doLogin = function(){
      if(Date.now() < authLockUntil) return;
      var id = String($("au_uid").value||"").trim(), pin = $("au_pin").value, u = findUser(id);
      authUid = id;
      if(!u || u.active===false){ authErr = u ? "This user is switched off. Ask the admin." : "No user with this ID"; render(); return; }
      if(!u.passHash){ authStep = "set"; authErr = ""; render(); return; }
      if(!pinOk(pin)){ authErr = "Enter your 4-digit passcode"; render(); return; }
      hashPin(u, pin).then(function(hx){
        if(hx===u.passHash){ startSession(u); render(); toast("Welcome, "+u.name); return; }
        authTries++; authErr = "Wrong passcode";
        if(authTries >= 5){ authTries = 0; authLockUntil = Date.now() + 60000; setTimeout(render, 61000); }
        render(); var p = $("au_pin"); if(p) p.focus();
      });
    };
    go.onclick = doLogin; enter("au_pin", doLogin); enter("au_uid", function(){ var p = $("au_pin"); if(p) p.focus(); });
    setTimeout(function(){ var a = $("au_uid"), p = $("au_pin"); if(a && a.value && p) p.focus(); else if(a) a.focus(); }, 50);
  }
  var sp = $("au_setpin");
  if(sp){
    var doSet = function(){
      var u = findUser(authUid), p1 = $("au_p1").value, p2 = $("au_p2").value;
      if(!u){ authStep = ""; render(); return; }
      if(!pinOk(p1)){ authErr = "Passcode must be 4 digits"; render(); return; }
      if(p1!==p2){ authErr = "The two passcodes do not match"; render(); return; }
      var salt = uid(), tmp = {uid:u.uid, salt:salt};
      sp.disabled = true;
      hashPin(tmp, p1).then(function(hx){ return ucoll().doc(u.id).update({salt:salt, passHash:hx, setAt:Date.now()}).then(function(){
        u.salt = salt; u.passHash = hx; startSession(u); render(); toast("Passcode saved. Welcome, "+u.name); }); })
        .catch(function(){ sp.disabled = false; authErr = "Could not save — try again"; render(); });
    };
    sp.onclick = doSet; enter("au_p2", doSet);
    $("au_back").onclick = function(){ authStep = ""; authErr = ""; render(); };
    setTimeout(function(){ var a = $("au_p1"); if(a) a.focus(); }, 50);
  }
}

/* ---- user activity: who did what ---- */
var ACT_DOC = {SO:"Sale Order", DC:"Delivery Challan", INV:"Sale Invoice", PO:"Purchase Bill"};
var ACT_PAY = {AR:"Payment-In", AP:"Payment-Out", EXP:"Expense", IN:"Deposit", OUT:"Withdrawal", TRF:"Transfer", WHTP:"WHT deposit", GSTP:"GST deposit", FAB:"Fixed asset bought", FAS:"Fixed asset sold"};
function activityOf(u){
  var out = [];
  histRows.forEach(function(x){ if(x.by===u.uid || (!x.by && x.byName===u.name)) out.push({at:x.created||0, what:x.action+" "+(ACT_DOC[x.docType]||x.docType)+" "+x.docNo, detail:x.summary||""}); });
  payRows().forEach(function(e){ if(e.by===u.uid) out.push({at:e.created||0, what:(ACT_PAY[e.payKind]||"Payment")+(e.customer?" · "+e.customer:""), detail:(isOwner?"Rs "+fmt(num(e.qty),2):"")+(e.docNo?" against "+e.docNo:"")}); });
  entries.forEach(function(e){ if(e.by!==u.uid) return;
    if(e.type==="WO") out.push({at:e.created||0, what:"Manufactured "+(e.docNo||"")+" · "+e.description, detail:fmt(num(e.qty))+" "+itemUnit(e.description)});
    if(e.type==="ADJ") out.push({at:e.created||0, what:"Stock adjustment · "+e.description, detail:fmt(num(e.qty))+" "+(e.note||"")});
    if(e.type==="QT"||e.type==="CN"||e.type==="DN") out.push({at:e.created||0, what:({QT:"Quotation",CN:"Credit note",DN:"Debit note"})[e.type]+" "+(e.docNo||"")+" · "+(e.customer||""), detail:""});
  });
  var seen = {};
  return out.filter(function(a){ var k = a.at+"|"+a.what; if(seen[k]) return false; seen[k] = 1; return true; })
    .sort(function(a,b){ return b.at - a.at; }).slice(0, 200);
}
function openActivity(u){
  var list = activityOf(u);
  function when(ms){ try{ return new Date(ms).toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } }
  var h = '<div class="modal" id="mOverlay"><div class="sheet" style="max-width:640px"><h2>Activity &middot; '+esc(u.name)+'</h2>'
    + '<p class="muted" style="font-size:13px;margin:4px 0 12px">User ID '+esc(u.uid)+' &middot; latest '+list.length+' action'+(list.length===1?'':'s')+(testMode?' in practice data':'')+'</p>';
  if(!list.length) h += '<div class="empty">Nothing recorded yet. Actions are tagged from the day logins started.</div>';
  else { h += '<div class="hist" style="max-height:60vh;overflow-y:auto">';
    list.forEach(function(a){ h += '<div class="hrow"><span class="hdot" style="background:var(--primary)"></span><div><b>'+esc(a.what)+'</b> <span class="muted" style="font-size:12px">'+esc(when(a.at))+'</span>'
      + (a.detail ? '<div class="muted" style="font-size:12px;white-space:pre-line">'+esc(a.detail)+'</div>' : '')+'</div></div>'; });
    h += '</div>'; }
  h += '<button class="btn sec" id="av_close" style="margin-top:14px">Close</button></div></div>';
  $("modalHost").innerHTML = h;
  $("av_close").onclick = closeEdit;
  $("mOverlay").addEventListener("click", function(ev){ if(ev.target.id==="mOverlay") closeEdit(); });
}

/* ---------- transactions ---------- */
var TK = {WHTP:["WHT DEPOSIT","var(--bad)"], GSTP:["GST DEPOSIT","var(--bad)"], INV:["SALE","var(--c-dc)"], PO:["PURCHASE","var(--c-wo)"], SO:["SALE ORDER","var(--c-po)"],
  DC:["DELIVERY","var(--cat-print)"], WO:["WORK ORDER","var(--cat-thread)"],
  AR:["PAYMENT-IN","var(--c-dc)"], AP:["PAYMENT-OUT","var(--c-wo)"], EXP:["EXPENSE","var(--bad)"],
  IN:["MONEY IN","var(--c-dc)"], ADJ:["STOCK ADJUSTMENT","var(--muted)"], QT:["QUOTATION","var(--muted)"], CN:["CREDIT NOTE","var(--bad)"], DN:["DEBIT NOTE","var(--c-wo)"], FAB:["ASSET BOUGHT","var(--c-wo)"], FAS:["ASSET SOLD","var(--c-dc)"], OUT:["MONEY OUT","var(--bad)"], TRF:["TRANSFER","var(--muted)"]};

function txnList(){
  var inv = {}, po = {};
  invDocs().forEach(function(r){ inv[r.docNo] = r; });
  poDocs().forEach(function(r){ po[r.docNo] = r; });
  var g = {}, out = [];
  entries.forEach(function(e){
    if(e.type==="CFG" || e.type==="FAV") return;
    if(e.type==="PAY"){
      out.push({type:"PAY", kind:e.payKind, key:e.id, e:e, party:e.customer, day:txnDay(e), created:e.created||0,
        no:e.chqNo ? "Chq "+e.chqNo : "", total:num(e.qty), qty:0});
      return;
    }
    var key = e.type==="SO" ? (e.poNo||"(no number)") : (e.docNo||"(no number)");
    var ty = e.type==="INVX" ? "INV" : e.type;
    var k = ty+"|"+key;
    if(!g[k]){ g[k] = {type:ty, kind:ty, cancelled:e.type==="INVX", key:key, no:key, party:e.customer, day:entryDay(e),
      created:e.created||0, qty:0, val:0, cost:0, rows:[]}; out.push(g[k]); }
    var t = g[k];
    t.qty += num(e.qty); t.val += num(e.qty)*num(e.rate) - num(e.deduction); t.cost += lineTotalCost(e);
    t.rows.push(e);
  });
  out.forEach(function(t){
    if(t.type==="INV" && inv[t.key]){ t.total = inv[t.key].gross; t.bal = inv[t.key].due; t.dueDay = inv[t.key].dueDay; }
    else if(t.type==="INV" && t.cancelled){ t.total = t.val*(1+GST_RATE); t.bal = 0; t.dueDay = ""; }
    else if(t.type==="PO" && po[t.key]){ t.total = po[t.key].gross; t.bal = po[t.key].due; t.dueDay = po[t.key].dueDay; }
    else if(t.type==="WO") t.total = t.cost;
    else if(t.type==="QT" || t.type==="CN" || t.type==="DN") t.total = t.val*(1+GST_RATE);
    else if(t.type!=="PAY") t.total = t.val;
    if(t.type==="WO" && !t.party) t.party = "For stock";
    if(t.type==="ADJ"){ t.party = (t.rows[0]||{}).description || ""; if(!t.no || t.no==="(no number)") t.no = ((t.rows[0]||{}).note||""); }
    if(t.type==="PAY" && !t.party) t.party = t.e.description || (t.kind==="TRF" ? "Transfer" : "");
  });
  out.sort(function(a,b){ return a.day===b.day ? (b.created - a.created) : (a.day < b.day ? 1 : -1); });
  return out;
}

function payStatusPill(t){
  var st, col;
  if(t.cancelled){ st = "Cancelled"; col = "var(--muted)"; }
  else if(t.bal <= 0.5){ st = "Paid"; col = "var(--c-dc)"; }
  else if(t.dueDay && t.dueDay < todayDay()){ st = "Overdue"; col = "var(--bad)"; }
  else if(t.bal < t.total - 0.5){ st = "Partial"; col = "#C77700"; }
  else { st = "Unpaid"; col = "var(--bad)"; }
  var due = (t.bal > 0.5 && t.dueDay) ? ' <span class="muted" style="font-size:11px;font-weight:500">due '+esc(new Date(t.dueDay+"T00:00:00Z").toLocaleDateString("en-GB",{day:"2-digit",month:"short",timeZone:"UTC"}))+'</span>' : '';
  return ' <span class="tpill" style="background:color-mix(in srgb,'+col+' 14%,transparent);color:'+col+'">'+st+'</span>'+due;
}

/* ---------- items ---------- */
function itemCat(desc){
  var r = entries.filter(function(e){ return e.description===desc && e.category && e.type!=="PAY" && e.type!=="ADJ"; })[0];
  return r ? r.category : "";
}
function lastRate(desc){
  var r = entries.filter(function(e){ return (e.type==="SO"||e.type==="DC") && e.description===desc && num(e.rate)>0; })[0];
  if(r) return num(r.rate);
  var m = itemMaster(desc); return m ? num(m.rate) : 0;
}
var _typ = null;
/* every item the system knows, with its type: FG = finished good, RM = raw material */
function itemTypes(){
  if(_typ) return _typ;
  var t = {};
  entries.forEach(function(e){
    if(!e.description) return;
    if(e.type==="WO"||e.type==="SO"||e.type==="DC"||e.type==="QT"||e.type==="CN") t[e.description] = "FG";
    else if((e.type==="PO"||e.type==="DN"||e.type==="ADJ") && !t[e.description]) t[e.description] = "RM";
  });
  entries.forEach(function(e){ if(e.type==="WO") woMats(e).forEach(function(m){ if(!t[m.name]) t[m.name] = "RM"; }); });
  itemMasters().forEach(function(m){ if(m.itype) t[m.customer] = m.itype; else if(!t[m.customer]) t[m.customer] = "FG"; });
  _typ = t; return t;
}
function itemType(n){ return itemTypes()[n] || "RM"; }
function finishedNames(){
  var t = itemTypes();
  return Object.keys(t).filter(function(n){ return t[n]==="FG"; }).sort();
}
function stockItems(){
  var seen = {}, out = [];
  entries.forEach(function(e){
    var ok = (e.type==="WO" && !e.poNo) || e.type==="PO" || e.type==="ADJ";
    if((ok || (e.type==="CN" && e.restock)) && e.description && !seen[e.description]){ seen[e.description]=1; out.push(e.description); }
  });
  return out.filter(function(n){ return availableForDC("", n) > 0; }).sort();
}
/* ================= items: history, value, adjustment ================= */
function adjQty(desc){
  var q = 0;
  entries.forEach(function(e){
    if(e.description!==desc) return;
    if(e.type==="ADJ") q += num(e.qty);
    if(e.type==="CN" && e.restock) q += num(e.qty);
    if(e.type==="DN") q -= num(e.qty);
  });
  return q;
}
function finishedStock(n){ return invQty(n); }
function finishedCost(n){ return invAvg(n) || avgMatRate(n); }
function itemList(){
  var out = allItemNames().map(function(n){
    var fg = itemType(n)==="FG";
    return {name:n, unit:itemUnit(n), fin:fg, stock:invQty(n), cost: fg ? finishedCost(n) : invAvg(n), sale: fg ? lastRate(n) : 0};
  });
  out.forEach(function(it){
    var m = itemMaster(it.name);
    if(m){ it.unit = m.unit || it.unit; if(!it.sale) it.sale = num(m.rate); if(!it.cost) it.cost = num(m.purRate); }
    it.value = it.stock > 0 ? invVal(it.name) : 0;
  });
  return out;
}

/* ---------- dashboard ---------- */
function saleChart(months, vals){
  var W=340, H=170, pl=14, pr=14, top=22, pb=26, n=vals.length;
  var max = niceMax(Math.max.apply(null, vals.concat([1])));
  var x = function(i){ return pl + (n<=1?0:i*(W-pl-pr)/(n-1)); };
  var y = function(v){ return top + (H-top-pb) - (v/max)*(H-top-pb); };
  var pts = vals.map(function(v,i){ return [x(i), y(v)]; });
  var line = pts.map(function(p,i){ return (i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1); }).join(" ");
  var area = line + " L"+x(n-1).toFixed(1)+" "+y(0).toFixed(1)+" L"+x(0).toFixed(1)+" "+y(0).toFixed(1)+" Z";
  var h = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Sales by month">'
    + '<defs><linearGradient id="sgFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--primary)" stop-opacity=".22"/><stop offset="1" stop-color="var(--primary)" stop-opacity="0"/></linearGradient></defs>'
    + '<line x1="'+pl+'" y1="'+y(0)+'" x2="'+(W-pr)+'" y2="'+y(0)+'" stroke="var(--border)" stroke-dasharray="4 4"/>'
    + '<path d="'+area+'" fill="url(#sgFill)"/>'
    + '<path d="'+line+'" fill="none" stroke="var(--primary)" stroke-width="2.6" stroke-linejoin="round"/>';
  pts.forEach(function(p,i){
    h += '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4" fill="var(--primary)"/>';
    h += '<text x="'+p[0].toFixed(1)+'" y="'+(H-6)+'" font-size="11" fill="var(--muted)" text-anchor="'+(i===0?"start":(i===n-1?"end":"middle"))+'">'+months[i].label+'</text>';
  });
  return h + '</svg>';
}

function plHTML(){
  var h = dateBarHTML();
  var sales = 0, cogs = 0, ded = 0;
  entries.forEach(function(e){
    if(e.type!=="DC" || !dayInRange(entryDay(e))) return;
    sales += num(e.qty)*num(e.rate); ded += num(e.deduction);
    cogs  += dcCostOf(e);
  });
  var ret = 0;
  rowsOf("CN").forEach(function(e){
    if(!dayInRange(entryDay(e))) return;
    ret += num(e.qty)*num(e.rate);
  });
  var stockAdj = 0;
  invEngine().all.forEach(function(m){
    if(!dayInRange(m.d)) return;
    if(m.kind==="Sale return") cogs -= m.val;
    if(m.kind==="Adjustment") stockAdj += m.q > 0 ? m.val : -m.val;
  });
  var net = sales - ded - ret, gp = net - cogs;
  var heads = {}, exp = 0;
  payRows().forEach(function(e){
    if(e.payKind!=="EXP" || !dayInRange(txnDay(e))) return;
    heads[e.customer] = (heads[e.customer]||0) + num(e.qty); exp += num(e.qty);
  });
  var dep = 0, gain = 0;
  assetRows().forEach(function(a){
    dep += depBetween(a, dFrom, dTo);
    assetAdjRows(a).forEach(function(e){ if(num(e.qty) < 0 && dayInRange(entryDay(e))) dep += -num(e.qty); });
    var sl = assetSale(a); if(sl && dayInRange(txnDay(sl))) gain += assetGain(a);
  });
  var np = gp - exp - dep + gain + stockAdj;
  h += '<div class="mcard">';
  h += '<div class="kpi"><span>Sales dispatched</span><b>'+rs(sales)+'</b></div>';
  if(ded) h += '<div class="kpi"><span class="muted">Less customer deductions</span><b class="neg">&minus; '+rs(ded)+'</b></div>';
  if(ret) h += '<div class="kpi"><span class="muted">Less sale returns (credit notes)</span><b class="neg">&minus; '+rs(ret)+'</b></div>';
  h += '<div class="kpi"><span class="muted">Less cost of goods sold</span><b class="neg">&minus; '+rs(cogs)+'</b></div>';
  h += '<div class="kpi" style="font-size:15px"><span style="font-weight:700">Gross profit</span><b class="'+(gp>=0?"pos":"neg")+'">'+rs(gp)+'</b></div>';
  Object.keys(heads).sort(function(a,b){ return heads[b]-heads[a]; }).forEach(function(k){
    h += '<div class="kpi"><span class="muted">'+esc(k)+'</span><b class="neg">&minus; '+rs(heads[k])+'</b></div>';
  });
  if(Math.abs(stockAdj) > 0.5) h += '<div class="kpi"><span class="muted">Stock adjustments ('+(stockAdj>=0?"gain":"loss")+')</span><b class="'+(stockAdj>=0?"pos":"neg")+'">'+(stockAdj>=0?"+ ":"&minus; ")+rs(Math.abs(stockAdj))+'</b></div>';
  if(dep > 0.5) h += '<div class="kpi"><span class="muted">Depreciation on fixed assets</span><b class="neg">&minus; '+rs(dep)+'</b></div>';
  if(Math.abs(gain) > 0.5) h += '<div class="kpi"><span class="muted">'+(gain>=0?"Gain":"Loss")+' on sale of fixed assets</span><b class="'+(gain>=0?"pos":"neg")+'">'+(gain>=0?"+ ":"&minus; ")+rs(Math.abs(gain))+'</b></div>';
  h += '<div class="kpi" style="font-size:16px;border-top:2px solid var(--border)"><span style="font-weight:700">Net profit</span><b style="font-size:20px" class="'+(np>=0?"pos":"neg")+'">'+rs(np)+'</b></div>';
  h += '</div>';
  h += '<div class="banner info">Sales and costs are ex-GST and counted on dispatch. Cost of goods is the weighted-average cost of what was dispatched (material issued plus work-order costs). Work orders already carry an overhead estimate &mdash; '
    +  'if the same bills are also posted as expenses, that overhead is counted twice.</div>';
  return h;
}

/* -------- Balance Sheet -------- */
function bsHTML(){
  var rows = entries;
  function sumNet(fn){ var t=0; rows.forEach(function(r){ if(fn(r)) t+=num(r.net||0); }); return t; }
  function sumAmt(fn){ var t=0; rows.forEach(function(r){ if(fn(r)) t+=num(r.amount||0); }); return t; }
  var invTotal = sumNet(function(r){ return r.type==="INV"; });
  var poTotal  = sumNet(function(r){ return r.type==="PO"; });
  var expTotal = sumAmt(function(r){ return r.type==="PAY" && r.payKind==="EXP"; });
  var cashBal  = sumAmt(function(r){ return r.type==="PAY" && r.payKind==="CASH"; });
  var bankBal  = sumAmt(function(r){ return r.type==="PAY" && r.payKind==="BANK"; });
  var payin    = sumAmt(function(r){ return r.type==="PAY" && r.kind==="in"; });
  var payout   = sumAmt(function(r){ return r.type==="PAY" && r.kind==="out" && r.payKind!=="EXP"; });
  var ar = Math.max(0, invTotal - payin);
  var ap = Math.max(0, poTotal  - payout);
  var netProfit = Math.max(0, invTotal - poTotal - expTotal);
  var totalAssets = cashBal + bankBal + ar;
  var totalLiab   = ap;
  var totalEquity = totalAssets - totalLiab;
  function bsSection(title, color, items){
    var h = '<div style="margin-bottom:16px">';
    h += '<div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:'+color+';margin-bottom:6px">'+title+'</div>';
    var tot = 0;
    items.forEach(function(it){
      tot += it.val;
      h += '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)">';
      h += '<span style="font-size:13px">'+it.name+'</span>';
      h += '<span class="num" style="font-size:13px;font-weight:600">'+rs(it.val)+'</span></div>';
    });
    h += '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-weight:700">';
    h += '<span style="font-size:13px;color:'+color+'">Total '+title+'</span>';
    h += '<span class="num" style="font-size:14px;color:'+color+'">'+rs(tot)+'</span></div>';
    return h + '</div>';
  }
  var balOk = Math.abs(totalAssets - (totalLiab+totalEquity)) < 0.01;
  var h = '<div class="cards3" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px">';
  function bsKpi(lbl, val, col){ return '<div class="mcard" style="text-align:center;padding:12px 8px"><div style="font-size:11px;color:var(--muted);margin-bottom:4px">'+lbl+'</div><div style="font-size:17px;font-weight:700;color:'+col+'">'+rs(val)+'</div></div>'; }
  h += bsKpi("Total Assets",  totalAssets, "var(--accent)");
  h += bsKpi("Total Liab.",   totalLiab,   "var(--warn)");
  h += bsKpi("Equity",        totalEquity, "var(--po)");
  h += '</div>';
  h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">';
  h += '<div class="mcard">';
  h += bsSection("Assets", "var(--accent)", [
    {name:"Cash in Hand",       val: cashBal},
    {name:"Bank Account – HBL", val: bankBal},
    {name:"Accounts Receivable",val: ar}
  ]);
  h += '</div><div class="mcard">';
  h += bsSection("Liabilities", "var(--warn)", [
    {name:"Accounts Payable",   val: ap}
  ]);
  h += bsSection("Equity", "var(--po)", [
    {name:"Retained Earnings",  val: Math.max(0, netProfit - (netProfit*0.15))},
    {name:"Current Year Profit",val: Math.max(0, netProfit * 0.15)}
  ]);
  h += '<div style="margin-top:8px;padding:8px;border-radius:8px;background:'+(balOk?'rgba(18,184,134,.1)':'rgba(229,72,77,.1)')+';display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:700;color:'+(balOk?'var(--accent)':'var(--bad)')+'">'+(balOk?'✓ Balance Sheet Balances':'✗ Check entries')+'</div>';
  h += '</div></div>';
  if(!rows.length) h = '<div class="mcard" style="text-align:center;color:var(--muted);padding:28px">No transactions yet — add sales, purchases or expenses to see your balance sheet.</div>';
  return h;
}

/* re-draw the form without losing what was typed */
function keepInputs(fn){
  var saved = {};
  Array.prototype.forEach.call(document.querySelectorAll("#main input[id]"), function(i){ if(!i.readOnly && i.value) saved[i.id] = i.value; });
  fn();
  Object.keys(saved).forEach(function(id){ var el = $(id); if(el && !el.readOnly && !el.value) el.value = saved[id]; });
}

/* ====== PAKISTAN GST / SALES TAX REPORT ====== */
function gstHTML(){
  var rows = entries.filter(function(r){ return r.type==="INV"||r.type==="PO"; });
  var filt = gstFilter||"all";
  // date filter
  var now=new Date(), y=now.getFullYear(), m=now.getMonth();
  var ms=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var months=[]; for(var i=0;i<12;i++){ var d=new Date(y,m-i,1); months.push({lbl:ms[d.getMonth()]+" "+d.getFullYear(),val:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}); }
  var GST_RATE=0.18;
  function amtOf(r){ return (r.qty||0)*(r.rate||0) - (r.deduction||0); }
  function filterRows(rs){
    if(filt==="all") return rs;
    return rs.filter(function(r){ return (r.date||"").startsWith(filt); });
  }
  var inv = filterRows(rows.filter(function(r){return r.type==="INV";}));
  var po  = filterRows(rows.filter(function(r){return r.type==="PO";}));
  var outAmt=0, inAmt=0;
  inv.forEach(function(r){outAmt+=amtOf(r);}); 
  po.forEach(function(r){inAmt+=amtOf(r);});
  var outTax=outAmt*GST_RATE, inTax=inAmt*GST_RATE, netTax=outTax-inTax;
  var h='<div class="mcard">';
  h+='<div style="font-weight:700;font-size:15px;margin-bottom:12px">Pakistan Sales Tax Summary (FBR)</div>';
  h+='<div style="margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap">';
  h+='<button onclick="gstFilter=\'all\';render()" style="padding:6px 14px;border-radius:20px;border:none;cursor:pointer;background:'+(filt==="all"?"var(--accent)":"var(--panel)")+';color:'+(filt==="all"?"#fff":"var(--text)")+'">All</button>';
  months.forEach(function(mo){ h+='<button onclick="gstFilter=\''+mo.val+'\';render()" style="padding:6px 14px;border-radius:20px;border:none;cursor:pointer;background:'+(filt===mo.val?"var(--accent)":"var(--panel)")+';color:'+(filt===mo.val?"#fff":"var(--text)")+'">'+mo.lbl+'</button>'; });
  h+='</div>';
  h+='<table style="width:100%;border-collapse:collapse;font-size:13px">';
  h+='<tr style="background:var(--panel)"><th style="padding:8px;text-align:left">Description</th><th style="padding:8px;text-align:right">Taxable Value</th><th style="padding:8px;text-align:right">Tax @ 18%</th></tr>';
  h+='<tr><td style="padding:8px;border-bottom:1px solid var(--border)">Output Tax (Sales — Annex C)</td><td style="padding:8px;text-align:right;border-bottom:1px solid var(--border)">PKR '+fmt(outAmt)+'</td><td style="padding:8px;text-align:right;border-bottom:1px solid var(--border);color:var(--bad)">PKR '+fmt(outTax)+'</td></tr>';
  h+='<tr><td style="padding:8px;border-bottom:1px solid var(--border)">Input Tax (Purchases — Annex A)</td><td style="padding:8px;text-align:right;border-bottom:1px solid var(--border)">PKR '+fmt(inAmt)+'</td><td style="padding:8px;text-align:right;border-bottom:1px solid var(--border);color:var(--accent)">PKR '+fmt(inTax)+'</td></tr>';
  h+='<tr style="font-weight:700"><td style="padding:8px">Net Tax Payable</td><td style="padding:8px;text-align:right"></td><td style="padding:8px;text-align:right;color:'+(netTax>0?"var(--bad)":"var(--accent)")+'">PKR '+fmt(Math.abs(netTax))+(netTax<0?" (Refund)":"")+'</td></tr>';
  h+='</table>';
  // Breakdown by month
  h+='<div style="margin-top:14px;font-weight:600;font-size:13px;margin-bottom:6px">Monthly Breakdown</div>';
  h+='<table style="width:100%;border-collapse:collapse;font-size:12px">';
  h+='<tr style="background:var(--panel)"><th style="padding:6px;text-align:left">Month</th><th style="padding:6px;text-align:right">Sales</th><th style="padding:6px;text-align:right">Output Tax</th><th style="padding:6px;text-align:right">Purchases</th><th style="padding:6px;text-align:right">Input Tax</th><th style="padding:6px;text-align:right">Net</th></tr>';
  var monMap={};
  rows.forEach(function(r){
    var mo=(r.date||"").substring(0,7); if(!mo) return;
    if(!monMap[mo]) monMap[mo]={s:0,p:0};
    var a=amtOf(r);
    if(r.type==="INV") monMap[mo].s+=a; else monMap[mo].p+=a;
  });
  Object.keys(monMap).sort().reverse().slice(0,12).forEach(function(mo){
    var d=monMap[mo], ot=d.s*GST_RATE, it=d.p*GST_RATE, net=ot-it;
    var parts=mo.split("-"); var lbl=ms[parseInt(parts[1])-1]+" "+parts[0];
    h+='<tr><td style="padding:6px;border-bottom:1px solid var(--border)">'+lbl+'</td><td style="padding:6px;text-align:right;border-bottom:1px solid var(--border)">'+fmt(d.s)+'</td><td style="padding:6px;text-align:right;border-bottom:1px solid var(--border);color:var(--bad)">'+fmt(ot)+'</td><td style="padding:6px;text-align:right;border-bottom:1px solid var(--border)">'+fmt(d.p)+'</td><td style="padding:6px;text-align:right;border-bottom:1px solid var(--border);color:var(--accent)">'+fmt(it)+'</td><td style="padding:6px;text-align:right;border-bottom:1px solid var(--border);font-weight:600;color:'+(net>0?"var(--bad)":"var(--accent)")+'">'+fmt(Math.abs(net))+(net<0?" R":"")+'</td></tr>';
  });
  h+='</table></div>';
  return h;
}

/* ====== PARTY LEDGER ====== */
var ledgerParty="";
function partyLedgerHTML(){
  var parties=[]; var seen={};
  entries.forEach(function(r){ var n=r.customer||""; if(n&&!seen[n]){ seen[n]=1; parties.push(n); } });

  parties.forEach(function(p){ h+='<option value="'+p+'"'+(p===ledgerParty?" selected":"")+'>'+p+'</option>'; });

  if(!ledgerParty){ h+='<div style="color:var(--muted);padding:20px;text-align:center">No transactions yet.</div></div>'; return h; }
  var pRows=entries.filter(function(r){ return r.customer===ledgerParty; }).sort(function(a,b){ return (a.date||"").localeCompare(b.date||""); });
  h+='<table style="width:100%;border-collapse:collapse;font-size:12px">';
  h+='<tr style="background:var(--panel)"><th style="padding:6px;text-align:left">Date</th><th style="padding:6px;text-align:left">Type</th><th style="padding:6px;text-align:left">Ref</th><th style="padding:6px;text-align:right">Debit</th><th style="padding:6px;text-align:right">Credit</th><th style="padding:6px;text-align:right">Balance</th></tr>';
  var bal=0;
  pRows.forEach(function(r){
    var amt=(r.qty||0)*(r.rate||0)-(r.deduction||0);
    if(r.type==="PAY") amt=r.qty||0;
    var dr=0,cr=0;
    if(r.type==="INV"){ dr=amt; }
    else if(r.type==="PO"){ cr=amt; }
    else if(r.type==="PAY"){ if(r.payKind==="AR") cr=amt; else dr=amt; }
    else if(r.type==="JE"){ dr=r.jeDr||0; cr=r.jeCr||0; }
    bal+=dr-cr;
    var dt=(r.date||"").substring(0,10);
    var ref=r.docNo||r.poNo||"";
    h+='<tr><td style="padding:6px;border-bottom:1px solid var(--border)">'+dt+'</td>';
    h+='<td style="padding:6px;border-bottom:1px solid var(--border)"><span style="font-size:10px;padding:2px 6px;border-radius:10px;background:var(--panel);font-weight:600">'+r.type+'</span></td>';
    h+='<td style="padding:6px;border-bottom:1px solid var(--border);color:var(--muted)">'+ref+'</td>';
    h+='<td style="padding:6px;text-align:right;border-bottom:1px solid var(--border)">'+(dr?fmt(dr):"")+'</td>';
    h+='<td style="padding:6px;text-align:right;border-bottom:1px solid var(--border)">'+(cr?fmt(cr):"")+'</td>';
    h+='<td style="padding:6px;text-align:right;border-bottom:1px solid var(--border);font-weight:600;color:'+(bal>0?"var(--bad)":"var(--accent)")+'">'+fmt(Math.abs(bal))+(bal>0?" Dr":" Cr")+'</td></tr>';
  });
  if(!pRows.length) h+='<tr><td colspan="6" style="padding:12px;text-align:center;color:var(--muted)">No transactions for this party</td></tr>';
  h+='<tr style="font-weight:700;background:var(--panel)"><td colspan="3" style="padding:8px">Closing Balance</td><td colspan="2"></td><td style="padding:8px;text-align:right;color:'+(bal>0?"var(--bad)":"var(--accent)")+'">PKR '+fmt(Math.abs(bal))+(bal>0?" Dr":" Cr")+'</td></tr>';
  h+='</table></div>';
  return h;
}

/* ====== ITEM-WISE PROFITABILITY ====== */
function iprofHTML(){
  var cats=["Thread","Printing","Scrubber","Tapes","Others"];
  var data={};
  cats.forEach(function(c){ data[c]={sales:0,purch:0,rows:0}; });
  entries.forEach(function(r){
    if(r.type!=="INV"&&r.type!=="PO") return;
    var c=r.category||"Others";
    if(c==="Cord & Lace"||c==="Narrow Fabric") c="Tapes";
    if(c==="Labels") c="Printing";
    if(c==="Raw Material"||c==="Finish Goods"||c==="Packing Material") c="Thread";
    if(!cats.includes(c)) c="Others";
    var amt=(r.qty||0)*(r.rate||0)-(r.deduction||0);
    if(r.type==="INV") data[c].sales+=amt; else data[c].purch+=amt;
    data[c].rows++;
  });
  var totS=0,totP=0;
  cats.forEach(function(c){totS+=data[c].sales;totP+=data[c].purch;});
  var h='<div class="mcard">';
  h+='<div style="font-weight:700;font-size:15px;margin-bottom:12px">Item-wise Profitability</div>';
  h+='<table style="width:100%;border-collapse:collapse;font-size:13px">';
  h+='<tr style="background:var(--panel)"><th style="padding:8px;text-align:left">Category</th><th style="padding:8px;text-align:right">Sales</th><th style="padding:8px;text-align:right">Purchases</th><th style="padding:8px;text-align:right">Gross Profit</th><th style="padding:8px;text-align:right">Margin%</th></tr>';
  cats.forEach(function(c){
    var d=data[c], gp=d.sales-d.purch, pct=d.sales?((gp/d.sales)*100):0;
    var colors={"Thread":"#3b82f6","Printing":"#8b5cf6","Scrubber":"#f59e0b","Tapes":"#10b981","Others":"#6b7280"};
    h+='<tr>';
    h+='<td style="padding:8px;border-bottom:1px solid var(--border)"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+colors[c]+';margin-right:6px"></span><b>'+c+'</b></td>';
    h+='<td style="padding:8px;text-align:right;border-bottom:1px solid var(--border)">'+fmt(d.sales)+'</td>';
    h+='<td style="padding:8px;text-align:right;border-bottom:1px solid var(--border)">'+fmt(d.purch)+'</td>';
    h+='<td style="padding:8px;text-align:right;border-bottom:1px solid var(--border);color:'+(gp>=0?"var(--accent)":"var(--bad)")+'">'+fmt(gp)+'</td>';
    h+='<td style="padding:8px;text-align:right;border-bottom:1px solid var(--border);font-weight:600;color:'+(pct>=0?"var(--accent)":"var(--bad)")+'">'+pct.toFixed(1)+'%</td>';
    h+='</tr>';
  });
  var totGP=totS-totP, totPct=totS?((totGP/totS)*100):0;
  h+='<tr style="font-weight:700;background:var(--panel)"><td style="padding:8px">TOTAL</td><td style="padding:8px;text-align:right">'+fmt(totS)+'</td><td style="padding:8px;text-align:right">'+fmt(totP)+'</td><td style="padding:8px;text-align:right;color:'+(totGP>=0?"var(--accent)":"var(--bad)")+'">'+fmt(totGP)+'</td><td style="padding:8px;text-align:right;color:'+(totPct>=0?"var(--accent)":"var(--bad)")+'">'+totPct.toFixed(1)+'%</td></tr>';
  h+='</table>';
  // Visual bars
  h+='<div style="margin-top:16px">';
  cats.forEach(function(c){
    var d=data[c]; if(!d.sales&&!d.purch) return;
    var pct=totS?((d.sales/totS)*100):0;
    var colors={"Thread":"#3b82f6","Printing":"#8b5cf6","Scrubber":"#f59e0b","Tapes":"#10b981","Others":"#6b7280"};
    h+='<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px"><span>'+c+'</span><span>'+pct.toFixed(0)+'% of sales</span></div>';
    h+='<div style="height:8px;border-radius:4px;background:var(--panel);overflow:hidden"><div style="height:100%;border-radius:4px;background:'+colors[c]+';width:'+pct+'%"></div></div></div>';
  });
  h+='</div></div>';
  return h;
}

function jeFormHTML(){

    h+='<tr>';
    h+='<td style="padding:4px"><select onchange="jeLines['+i+'].acc=this.value" style="width:100%;padding:6px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:12px"><option value="">-- Select Account --</option>';
    COA_LIST.forEach(function(a){ h+='<option value="'+a+'"'+(line.acc===a?" selected":"")+'>'+a+'</option>'; });
    h+='</select></td>';
    h+='<td style="padding:4px"><input type="number" min="0" value="'+(line.dr||"")+'" onchange="jeLines['+i+'].dr=parseFloat(this.value)||0;jeLines['+i+'].cr=0" style="width:100%;padding:6px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--text);text-align:right"></td>';
    h+='<td style="padding:4px"><input type="number" min="0" value="'+(line.cr||"")+'" onchange="jeLines['+i+'].cr=parseFloat(this.value)||0;jeLines['+i+'].dr=0" style="width:100%;padding:6px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--text);text-align:right"></td>';
    h+='<td style="padding:4px;text-align:center"><button onclick="jeLines.splice('+i+',1);if(!jeLines.length)jeLines=[{acc:\"\",dr:0,cr:0}];render()" style="background:none;border:none;color:var(--bad);cursor:pointer;font-size:16px">✕</button></td>';
    h+='</tr>';
  });
  var totDr=jeLines.reduce(function(s,l){return s+(l.dr||0);},0);
  var totCr=jeLines.reduce(function(s,l){return s+(l.cr||0);},0);
  h+='<tr style="background:var(--panel);font-weight:700"><td style="padding:6px">Total</td><td style="padding:6px;text-align:right">'+fmt(totDr)+'</td><td style="padding:6px;text-align:right">'+fmt(totCr)+'</td><td></td></tr>';
  h+='</table>';
  var balanced=Math.abs(totDr-totCr)<0.01&&totDr>0;
  h+='<button onclick="jeLines.push({acc:\"\",dr:0,cr:0});render()" style="padding:8px 16px;border-radius:8px;border:none;background:var(--panel);color:var(--text);cursor:pointer;margin-bottom:12px">+ Add Line</button>';
  h+='<div style="margin-bottom:10px"><label style="font-size:12px;color:var(--muted)">Narration</label>';
  h+='<input id="jeNarr" type="text" value="'+jeNarrative+'" onchange="jeNarrative=this.value" placeholder="Description / reason for entry" style="width:100%;margin-top:4px;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:13px;box-sizing:border-box"></div>';
  if(!balanced&&totDr>0) h+='<div style="color:var(--bad);font-size:12px;margin-bottom:8px">⚠ Debits ('+fmt(totDr)+') must equal Credits ('+fmt(totCr)+')</div>';
  h+='<button onclick="saveJournalEntry()" style="padding:12px 24px;border-radius:10px;border:none;background:'+(balanced?"var(--accent)":"var(--panel)")+';color:'+(balanced?"#fff":"var(--muted)")+';cursor:'+(balanced?"pointer":"default")+';font-weight:700;font-size:14px" '+(balanced?"":'disabled')+'>Post Journal Entry</button>';
  h+='</div>';
  return h;
}
function saveJournalEntry(){
  var totDr=jeLines.reduce(function(s,l){return s+(l.dr||0);},0);
  var totCr=jeLines.reduce(function(s,l){return s+(l.cr||0);},0);
  if(Math.abs(totDr-totCr)>0.01||totDr===0){toast("Debits must equal Credits");return;}
  var narr=document.getElementById("jeNarr");
  var narrative=narr?narr.value:jeNarrative;
  var now=Date.now();
  var rows=jeLines.filter(function(l){return l.acc&&(l.dr||l.cr);}).map(function(l){
    return {type:"JE",created:now,date:new Date(now).toISOString(),txnDate:todayDay(),
      customer:l.acc,description:narrative||"Journal Entry",
      jeDr:l.dr||0,jeCr:l.cr||0,qty:l.dr||l.cr||0,rate:1,
      payKind:"JE",poNo:"",docNo:"JE-"+String(now).slice(-6),category:"Journal",
      poStatus:"",costingQty:0,deduction:0,matName:"",matQty:0,forSo:"",
      material:0,dyeing:0,labour:0,printing:0,overhead:0};
  });
  saveRows(rows).then(function(){
    toast("Journal Entry posted ("+rows.length+" lines)");
    jeLines=[{acc:"",dr:0,cr:0}]; jeNarrative="";
    loadData();
  });
}

function importVyapar(){
  if(!testMode){ toast("Switch to TEST mode first"); return; }
  confirmBox(
    "Wipe & Import",
    "This will DELETE all existing TEST data, then load Vyapar sample data (206 parties, 100 items, 200 transactions). This cannot be undone.",
    "Wipe & Import",
    function(){
      toast("Wiping TEST data…");
      var toDelete = (entries||[]).concat(histRows||[]).filter(function(r){ return r.id; });
      var delPromise = Promise.resolve();
      toDelete.forEach(function(r){
        delPromise = delPromise.then(function(){ return deleteRow(r.id); });
      });
      delPromise.then(function(){
        doImportVyapar();
      }).catch(function(e){ toast("Wipe error: "+e.message); });
    }
  );
}
function doImportVyapar(){
  if(!testMode){ return; }
  toast("Importing Vyapar data...");
  var rows=[], now=Date.now();
  // Parties
  VYP.p.forEach(function(p,i){
    rows.push({type:"CFG",created:now-i,date:new Date(now-i).toISOString(),
      customer:p[0],payKind:"PARTY",qty:0,rate:0,poNo:"",docNo:"",description:"Party",
      category:p[1]==="S"?"Supplier":"Customer",poStatus:"",
      address:"",phone:p[2]||"",ntn:"",gst:"",
      costingQty:0,deduction:0,matName:"",matQty:0,forSo:"",
      material:0,dyeing:0,labour:0,printing:0,overhead:0});
  });
  // Items
  VYP.it.forEach(function(it,i){
    rows.push({type:"CFG",created:now-1000-i,date:new Date(now-1000-i).toISOString(),
      customer:it[0],payKind:"ITEM",qty:it[4]||0,rate:it[2]||0,poNo:"",docNo:"",
      description:"Item",category:it[1]||"Others",poStatus:"",
      address:"",phone:"",ntn:"",gst:"",
      costingQty:0,deduction:0,matName:"",matQty:0,forSo:"",
      material:0,dyeing:0,labour:0,printing:0,overhead:0});
  });
  // Transactions
  var baseMs=Date.now()-180*24*3600*1000;
  VYP.t.forEach(function(t,i){
    var dStr=t[0]; var dMs=dStr?new Date(dStr).getTime():(baseMs+i*3600000);
    var ty=t[1], paykind=t[3], amt=t[4]||0, ref=t[5]||"", party=t[6]||"", cat=t[7]||"Others";
    var row={created:dMs,date:new Date(dMs).toISOString(),txnDate:dStr?dStr.substring(0,10):todayDay(),
      customer:party,poNo:"",docNo:ref,description:ref,category:cat,
      poStatus:"",costingQty:0,deduction:0,matName:"",matQty:0,forSo:"",
      material:0,dyeing:0,labour:0,printing:0,overhead:0,
      qty:1,rate:amt,wht:0,jeDr:0,jeCr:0,payKind:paykind||ty};
    if(ty==="INV"){row.type="INV";}
    else if(ty==="PO"){row.type="PO";}
    else if(ty==="PAY"){row.type="PAY"; row.payKind=paykind||"AR"; row.qty=amt; row.rate=1; row.account="Cash in Hand"; row.toAccount=""; row.chqNo=""; row.chqDate="";}
    else return;
    rows.push(row);
  });
  // Save in batches
  var BATCH=50, chunks=[];
  for(var i=0;i<rows.length;i+=BATCH) chunks.push(rows.slice(i,i+BATCH));
  var p=Promise.resolve();
  chunks.forEach(function(chunk){ p=p.then(function(){return saveRows(chunk);}); });
  p.then(function(){
    toast("Imported "+rows.length+" records ("+VYP.p.length+" parties, "+VYP.it.length+" items, "+VYP.t.length+" txns)");
    loadData();
  }).catch(function(e){ toast("Import error: "+e.message); });
}
