<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PeerBooks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Lato:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E141B; --panel:#141C25; --surface:#1A242F; --field:#111922;
  --border:#2A3846; --text:#EAF0F6; --muted:#8FA2B5;
  --accent:#12B886; --warn:#F59E0B; --bad:#E5484D; --po:#3B82F6;
  --c-po:#3B82F6; --c-wo:#F59E0B; --c-dc:#12B886;
  --cat-thread:#A855F7; --cat-print:#38BDF8; --cat-scrub:#FB7185; --cat-tapes:#4ADE80;
  --glow:rgba(18,184,134,.26);
  --primary:#3B82F6; --on-primary:#FFFFFF; --thead:#141C25;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#F4F2EE; --panel:#FFFFFF; --surface:#FFFFFF; --field:#FFFFFF;
  --border:#E4DFD6; --text:#1C1B19; --muted:#5E5A54;
  --accent:#1F7A45; --warn:#B45309; --bad:#B42318; --po:#1E4F8F;
  --c-po:#1E4F8F; --c-wo:#B45309; --c-dc:#1F7A45;
  --primary:#1E4F8F; --on-primary:#FFFFFF; --thead:#F8F6F2;
  --cat-thread:#9333EA; --cat-print:#0284C7; --cat-scrub:#E11D48; --cat-tapes:#16A34A;
  --glow:rgba(31,122,69,.14);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;font-size:15px;
  -webkit-text-size-adjust:100%}
h1,h2,h3{font-family:'IBM Plex Sans',system-ui,sans-serif;margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:16px;color:var(--text);background:var(--field);
  border:1px solid var(--border);border-radius:10px;padding:0 12px;height:46px;width:100%;
  outline:none}
input:focus,select:focus{border-color:var(--primary)}
input[readonly]{background:var(--surface);color:var(--muted)}
label{font-size:12px;font-weight:500;color:var(--muted);display:block;margin-bottom:5px}
.wrap{max-width:1400px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px)) 16px}
.shell{display:flex;gap:20px;align-items:flex-start}
.colmain{flex:1 1 auto;min-width:0}
.colside{display:none}
@media(min-width:1060px){
  .colside{display:block;flex:0 0 330px;width:330px;position:sticky;top:130px}
}
/* stat cards with a coloured edge bar, TrakSYS style */
.stat{position:relative;overflow:hidden;padding-left:14px;text-align:left}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
  border-radius:11px 0 0 11px;background:var(--border)}
.stat.b-blue::before{background:var(--c-po)}
.stat.b-amber::before{background:var(--c-wo)}
.stat.b-green::before{background:var(--c-dc)}
.stat.b-red::before{background:var(--bad)}
.stat.hi::before{background:var(--accent)}
.sidecard{background:var(--panel);border:1px solid var(--border);border-radius:14px;
  padding:14px;margin-bottom:12px}
.sidecard h3{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  font-weight:600;margin-bottom:10px}
.mini{display:flex;gap:10px;align-items:flex-start;padding:10px 11px;border-radius:10px;
  background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--border);
  margin-bottom:8px}
.mini.SO{border-left-color:var(--c-po)}
.mini.PO{border-left-color:var(--cat-scrub)}
.mini.WO{border-left-color:var(--c-wo)}
.mini.DC{border-left-color:var(--c-dc)}
.mini .g{flex:1;min-width:0}
.mini .t{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .s{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;
  border-bottom:1px solid var(--border);font-size:13px}
.kpi:last-child{border-bottom:none}
.kpi b{font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:16px}
.drop{border:2px dashed var(--border);border-radius:14px;padding:26px 18px;text-align:center;
  background:var(--panel);transition:border-color .2s ease,background .2s ease;cursor:pointer}
.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel))}
.drop h4{font-size:15px;font-weight:700;margin:10px 0 4px 0}
.drop p{font-size:13px;color:var(--muted);margin:0}
.thumb{max-width:100%;max-height:190px;border-radius:10px;border:1px solid var(--border);margin-top:12px}
.scanrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
  padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--border);margin-bottom:8px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px;margin-bottom:6px}
.chartcard{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px}
.chartcard h3{font-size:14px;font-weight:700;margin-bottom:2px}
.chartcard .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
.chartcard svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:11px;height:3px;border-radius:2px;display:block}
.delta{font-family:'IBM Plex Sans',system-ui,sans-serif;font-weight:700;font-size:13px}
.tickers{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:6px}
.ticker{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--border);
  border-radius:12px;padding:12px 14px}
.ticker h3{font-size:14px;font-weight:700;margin-bottom:3px}
.ticker .v{font-size:13px;font-weight:600}
.ticker .s{font-size:11px;color:var(--muted);margin-top:3px}

/* header — mobile first: top bar + bottom tab bar */
header{position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top,0px)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;
  max-width:1400px;margin:0 auto;padding:12px 16px}
.brand{font-weight:700;font-size:18px;letter-spacing:.01em}
.brand small{display:none}
.iconbtn{width:42px;height:42px;flex:0 0 auto;border-radius:10px;border:1px solid var(--border);
  background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:var(--panel);border-top:1px solid var(--border);
  padding:4px 4px calc(6px + env(safe-area-inset-bottom,0px)) 4px;box-shadow:0 -4px 16px rgba(28,42,58,.06)}
.nav button{flex:1 1 0;min-width:0;height:60px;border:none;border-radius:10px;background:transparent;
  color:var(--muted);font-size:11px;font-weight:500;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;white-space:nowrap;padding:0 2px}
.nav button svg{width:22px;height:22px;flex:0 0 auto}
.nav button .full{display:none}
.nav button.on{color:var(--primary);font-weight:700}
.nav button.on svg{stroke-width:2.4}
.toast{bottom:calc(92px + env(safe-area-inset-bottom,0px)) !important}

/* laptop / desktop: navy side menu */
@media(min-width:900px){
  header{position:fixed;left:0;top:0;bottom:0;width:236px;z-index:25;display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#3A5068 transparent;
    background:#1C2A3A;color:#FFFFFF;border-bottom:none;border-right:1px solid #1C2A3A;
    padding:24px 14px calc(18px + env(safe-area-inset-bottom,0px)) 14px;
    --muted:#A9B6C4;--border:#34495F;--surface:#25374B;--text:#FFFFFF;--primary:#3E7BD1;--accent:#5CC98A;--warn:#F2A541}
  .hd{display:contents}
  .brand{order:0;padding:0 10px 14px 10px;font-size:18px;color:#FFFFFF}
  .brand small{display:block;font-size:12px;font-weight:400;color:#A9B6C4;margin-top:3px}
  .nav{order:1;position:static;flex-direction:column;gap:4px;background:transparent;border:none;
    box-shadow:none;padding:0}
  .nav button{flex:0 0 auto;height:36px;flex-direction:row;justify-content:flex-start;gap:11px;
    padding:0 12px;font-size:14px;color:#D5DDE6;border-radius:8px}
  .nav button svg{width:19px;height:19px}
  .nav button .short{display:none}
  .nav button .full{display:inline}
  .nav button:hover{background:#25374B}
  .nav button.on{background:#2E4460;color:#FFFFFF;font-weight:600}
  .tools{order:2;margin-top:auto;flex-wrap:wrap;padding:12px 6px 0 6px;border-top:1px solid #34495F}
  .wrap{margin-left:236px;max-width:none;padding:24px 32px 40px 32px}
  .colside{top:24px !important}
  .toast{bottom:26px !important;left:calc(50% + 118px) !important}
}
/* generic */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:grid;gap:12px;margin-bottom:12px}
@media(min-width:760px){.row.c2{grid-template-columns:1fr 1fr}.row.c3{grid-template-columns:1fr 1fr 1fr}.row.c4{grid-template-columns:repeat(4,1fr)}}
.seg{display:flex;gap:6px;margin:14px 0}
.seg button{flex:1;height:46px;border-radius:11px;border:1px solid var(--border);
  background:transparent;color:var(--muted);font-weight:600;letter-spacing:.02em;
  transition:transform .12s ease,background .18s ease,color .18s ease,box-shadow .18s ease}
.seg button:active{transform:scale(.96)}
.seg button.on{color:#FFFFFF;font-weight:700}
.seg button.on[data-etype="SO"]{background:var(--c-po);border-color:var(--c-po);
  box-shadow:0 4px 14px color-mix(in srgb,var(--c-po) 35%,transparent)}
.seg button.on[data-etype="PO"]{background:var(--cat-scrub);border-color:var(--cat-scrub);
  box-shadow:0 4px 14px color-mix(in srgb,var(--cat-scrub) 35%,transparent)}
.seg button.on[data-etype="WO"]{background:var(--c-wo);border-color:var(--c-wo);
  box-shadow:0 4px 14px color-mix(in srgb,var(--c-wo) 35%,transparent)}
.seg button.on[data-etype="DC"]{background:var(--c-dc);border-color:var(--c-dc);
  box-shadow:0 4px 14px color-mix(in srgb,var(--c-dc) 35%,transparent)}
.seg button.on[data-etype="INV"]{background:var(--cat-thread);border-color:var(--cat-thread);
  box-shadow:0 4px 14px color-mix(in srgb,var(--cat-thread) 35%,transparent)}
.seg button.on[data-ivmode="credit"]{background:#2E9E5B;border-color:#2E9E5B}
.seg button.on[data-ivmode="cash"]{background:#2E9E5B;border-color:#2E9E5B}
.seg button.on[data-ctab]{background:var(--primary);border-color:var(--primary);color:var(--on-primary);
  box-shadow:0 4px 14px var(--glow)}
.btn{height:50px;width:100%;border-radius:11px;border:none;background:var(--primary);
  color:var(--on-primary);font-weight:600;font-size:16px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sec{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn.sm{height:40px;font-size:14px;width:auto;padding:0 16px}
.btn.danger{background:var(--bad);color:#fff}
.hint{font-size:12px;color:var(--accent);margin-top:5px}
.hint.warn{color:var(--warn)}
.muted{color:var(--muted)}
.sec-title{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  margin:18px 0 10px 0}
.pill{display:inline-block;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:600}
.pill.SO{background:color-mix(in srgb,var(--po) 20%,transparent);color:var(--po)}
.pill.PO{background:color-mix(in srgb,var(--cat-scrub) 20%,transparent);color:var(--cat-scrub)}
.pill.WO{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.DC{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}
.pill.INV{background:color-mix(in srgb,var(--cat-thread) 20%,transparent);color:var(--cat-thread)}
.pill.PAY{background:color-mix(in srgb,var(--cat-narrow,var(--c-dc)) 20%,transparent);color:var(--c-dc)}
.pill.CFG{background:var(--panel);color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:10px 8px;text-align:center}
.stat .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-family:'IBM Plex Sans',system-ui,sans-serif;font-weight:700;font-size:18px;margin-top:3px}
.stat{transition:transform .18s ease,border-color .18s ease}
.stat.hi{border-color:color-mix(in srgb,var(--accent) 55%,transparent);
  background:color-mix(in srgb,var(--accent) 9%,var(--panel))}
.stat.hi .v{color:var(--accent)}
.bar{height:7px;border-radius:99px;background:var(--border);overflow:hidden;
  display:flex;min-width:92px}
.bar i{display:block;height:100%;transition:width .5s cubic-bezier(.2,.8,.3,1)}
.bar i.made{background:var(--c-wo)}
.bar i.ship{background:var(--c-dc)}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600;
  border:1px solid transparent}
.chip.Thread{background:color-mix(in srgb,var(--cat-thread) 16%,transparent);color:var(--cat-thread);
  border-color:color-mix(in srgb,var(--cat-thread) 35%,transparent)}
.chip.Printing{background:color-mix(in srgb,var(--cat-print) 16%,transparent);color:var(--cat-print);
  border-color:color-mix(in srgb,var(--cat-print) 35%,transparent)}
.chip.Scrubber{background:color-mix(in srgb,var(--cat-scrub) 16%,transparent);color:var(--cat-scrub);
  border-color:color-mix(in srgb,var(--cat-scrub) 35%,transparent)}
.chip.Tapes{background:color-mix(in srgb,var(--cat-tapes) 16%,transparent);color:var(--cat-tapes);
  border-color:color-mix(in srgb,var(--cat-tapes) 35%,transparent)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card,.linerow,.totals,.banner,.tbl-scroll,.stats{animation:rise .28s ease both}
tbody tr{transition:background .15s ease}
tbody tr:hover{background:var(--panel)}
.totals{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding:12px 14px;background:var(--panel);border:1px solid var(--border);border-radius:12px;margin-bottom:12px}
.totals .big{font-family:'IBM Plex Sans',system-ui,sans-serif;font-weight:700;font-size:21px}
.pos{color:var(--accent)} .neg{color:var(--bad)}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th{text-align:left;background:var(--thead) !important;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  font-weight:600;padding:9px 10px;background:var(--panel);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td.wrapcell{white-space:normal;min-width:160px}
table.cb{min-width:0}table.cb td.wrapcell{min-width:0}table.cb td,table.cb th{padding-left:6px;padding-right:6px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--muted);padding:34px 14px;font-size:14px}
.linerow{display:flex;align-items:center;gap:10px;padding:11px 12px 11px 14px;background:var(--panel);
  border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:11px;margin-bottom:8px;
  transition:transform .14s ease}
.linerow:active{transform:scale(.99)}
.linerow.SO{border-left-color:var(--c-po)}
.linerow.PO{border-left-color:var(--cat-scrub)}
.linerow.WO{border-left-color:var(--c-wo)}
.linerow.DC{border-left-color:var(--c-dc)}
.btn{transition:transform .12s ease,filter .18s ease}
.btn:active:not(:disabled){transform:scale(.975);filter:brightness(1.08)}
.iconbtn{transition:transform .2s ease,color .2s ease}
.iconbtn:active{transform:rotate(-18deg) scale(.94)}
.nav button{transition:background .18s ease,color .18s ease}
.totals{transition:border-color .3s ease}
.linerow .g{flex:1;min-width:0}
.linerow .t{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linerow .s{font-size:12px;color:var(--muted);margin-top:2px}
.x{width:34px;height:34px;flex:0 0 auto;border-radius:8px;border:1px solid var(--border);
  background:transparent;color:var(--muted);font-size:17px;line-height:1}
.banner{padding:12px 14px;border-radius:11px;font-size:13px;margin-bottom:12px;line-height:1.45}
.banner.warn{background:color-mix(in srgb,var(--warn) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);color:var(--warn)}
.banner.info{background:var(--panel);border:1px solid var(--border);color:var(--muted)}
.toast{position:fixed;left:50%;bottom:26px;z-index:60;
  background:#1C2A3A;color:#FFFFFF;padding:12px 20px;border-radius:11px;font-weight:600;
  box-shadow:0 8px 28px rgba(0,0,0,.35);font-size:14px;
  animation:pop .3s cubic-bezier(.2,1.3,.4,1) both}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(14px) scale(.94)}
  to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
.totals{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 8%,var(--panel)),var(--panel))}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;
  align-items:flex-end;justify-content:center;padding:0}
@media(min-width:700px){.modal{align-items:center;padding:20px}}
.sheet{background:var(--bg);border:1px solid var(--border);border-radius:16px 16px 0 0;
  width:100%;max-width:640px;max-height:92vh;overflow-y:auto;padding:18px 16px 24px 16px;
  padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.sheet{border-radius:16px}}
.sheet h2{font-size:19px;margin-bottom:4px}
.filters{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
.filters select,.filters input{height:40px;font-size:14px;min-width:130px;width:auto;flex:1 1 auto}

/* ---- bookkeeping shell ---- */
.dnav{display:none !important}
@media(min-width:900px){ .mnav{display:none !important} .dnav{display:flex !important} }
.nav button span{display:block}
.ptitle{display:none}
@media(min-width:900px){ .ptitle{display:block;margin:4px 0 14px} .ptitle h1{font-size:24px} }
.wrap{padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}
@media(min-width:900px){ .wrap{padding-bottom:110px} }
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:35;
  height:54px;padding:0 26px;border-radius:99px;border:none;background:#D93848;color:#fff;font-weight:600;font-size:17px;
  display:flex;align-items:center;gap:10px;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.22)}
.fab:active{filter:brightness(1.08)}
@media(min-width:900px){ .fab{left:auto;right:32px;transform:none;bottom:28px} .toast{bottom:96px !important} }
.toast{bottom:calc(150px + env(safe-area-inset-bottom,0px)) !important}
.hseg{display:flex;gap:12px;margin:14px 0}
.hseg button{flex:1;height:48px;border-radius:99px;border:1.5px solid var(--border);background:transparent;
  color:var(--muted);font-weight:600;font-size:15px}
.hseg button.on{border-color:#D93848;color:#D93848;background:color-mix(in srgb,#D93848 10%,transparent)}
.search{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);
  border-radius:14px;padding:0 14px;margin-bottom:12px}
.search input{border:none;background:transparent;height:50px;padding:0}
.search input:focus{border:none}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-bottom:12px}

sub"></div></div><button data-view="reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 13h6M10 17h6"/></svg><span>Reports</span></button></nav>

<script>
(function(){
"use strict";

/* ---------------- constants ---------------- */
var CATS = ["Thread","Printing","Scrubber","Tapes"];
var COST_FIELDS = {
  "Thread":        ["material","dyeing","labour","overhead"],
  "Printing":      ["material","printing","overhead"],
  "Tapes":         ["material","dyeing","labour","overhead"],
  "Scrubber":      ["material"]
};
var COST_LABEL = {material:"Material",dyeing:"Dyeing",labour:"Labour",printing:"Printing",overhead:"Overhead"};
var ALL_COSTS = ["material","dyeing","labour","printing","overhead"];
function costUnit(cat){ return cat === "Thread" ? "Bundles" : "KG"; }

var LEAD_DAYS = 10;
var GST_RATE = 0.18;            /* applies to PO and INV only */
var DEFAULT_CREDIT = 30;        /* days, until a party is given its own */

function invRows(){ return entries.filter(function(e){ return e.type==="INV"; }); }
function payRows(){ return entries.filter(function(e){ return e.type==="PAY"; }); }
function cfgRows(){ return entries.filter(function(e){ return e.type==="CFG"; }); }

function creditDays(party, kind){
  var r = cfgRows().filter(function(e){ return e.customer===party && e.payKind===kind; })[0];
  return r ? num(r.qty) : DEFAULT_CREDIT;
}
function exGst(v){ return v; }
function rowTax(e){ return (e && e.taxRate!==undefined && e.taxRate!==null && e.taxRate!=="") ? num(e.taxRate) : GST_RATE; }
function withGst(v){ return v * (1 + GST_RATE); }

/* every DC number, with its lines and whether it has been invoiced */
function dcDocs(){
  var g = {};
  entries.forEach(function(e){
    if(e.type!=="DC") return;
    var k = e.docNo || "(no number)";
    if(!g[k]) g[k] = {docNo:k, customer:e.customer, day:entryDay(e), value:0, ded:0, qty:0, lines:[]};
    var v = num(e.qty)*num(e.rate);
    g[k].value += v; g[k].ded += num(e.deduction); g[k].qty += num(e.qty);
    g[k].lines.push(e);
  });
  var billed = {};
  invRows().forEach(function(e){ if(e.dcRef) billed[e.dcRef] = true; });
  return Object.keys(g).map(function(k){
    g[k].net = g[k].value - g[k].ded;
    g[k].billed = !!billed[k];
    return g[k];
  }).sort(function(a,b){ return a.day < b.day ? -1 : 1; });
}

/* one row per invoice number */
function invDocs(){
  var g = {};
  invRows().forEach(function(e){
    var k = e.docNo || "(no number)";
    if(!g[k]) g[k] = {docNo:k, customer:e.customer, day:entryDay(e), net:0, dcs:{}};
    if(e.dueDate) g[k].dueSet = e.dueDate;
    g[k].net += num(e.qty)*num(e.rate) - num(e.deduction);
    if(e.dcRef) g[k].dcs[e.dcRef] = true;
  });
  var list = Object.keys(g).map(function(k){
    var r = g[k];
    r.gst   = r.net * GST_RATE;
    r.gross = r.net + r.gst;
    r.dueDay = r.dueSet || addDays(r.day, creditDays(r.customer, "AR"));
    r.dcList = Object.keys(r.dcs);
    return r;
  });
  return settle(list, "AR").sort(function(a,b){ return a.dueDay < b.dueDay ? -1 : 1; });
}

/* one row per supplier PO number */
function poDocs(){
  var g = {};
  buyRows().forEach(function(e){
    var k = e.docNo || "(no number)";
    if(!g[k]) g[k] = {docNo:k, supplier:e.customer, day:entryDay(e), net:0, tax:0};
    if(e.dueDate) g[k].dueSet = e.dueDate;
    g[k].net += num(e.qty)*num(e.rate);
    g[k].tax += num(e.qty)*num(e.rate)*rowTax(e);
  });
  var list = Object.keys(g).map(function(k){
    var r = g[k];
    r.gst   = r.tax;
    r.gross = r.net + r.gst;
    r.dueDay = r.dueSet || addDays(r.day, creditDays(r.supplier, "AP"));
    return r;
  });
  return settle(list, "AP").sort(function(a,b){ return a.dueDay < b.dueDay ? -1 : 1; });
}

function ageBucket(dueDay){
  var d = dayDiff(dueDay, todayDay());   /* positive = overdue */
  if(d <= 0)  return {i:0, label:"Not due"};
  if(d <= 30) return {i:1, label:"1-30 days"};
  if(d <= 60) return {i:2, label:"31-60 days"};
  if(d <= 90) return {i:3, label:"61-90 days"};
  return {i:4, label:"Over 90 days"};
}
var BUCKETS = ["Not due","1-30 days","31-60 days","61-90 days","Over 90 days"];
function addDays(day, n){
  var d = new Date(day + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0,10);
}
function dayDiff(a, b){
  return Math.round((new Date(b+"T00:00:00Z") - new Date(a+"T00:00:00Z")) / 86400000);
}
function todayDay(){ return new Date().toISOString().slice(0,10); }

/* green = delivered in time, blue = running and still inside lead time, red = late */
function lineStatus(r){
  var due = r.poDay ? addDays(r.poDay, LEAD_DAYS) : "";
  var today = todayDay();
  if(!due) return {state:"progress", due:"", label:"No date", color:"var(--c-po)", note:""};

  if(r.shipped >= r.ordered && r.ordered > 0){
    var lateBy = r.lastDc ? dayDiff(due, r.lastDc) : 0;
    if(lateBy > 0) return {state:"late", due:due, label:"Delivered late",
                           color:"var(--bad)", note:lateBy+"d over"};
    return {state:"ontime", due:due, label:"Delivered", color:"var(--c-dc)",
            note:(-lateBy)+"d early"};
  }
  var left = dayDiff(today, due);
  if(left < 0) return {state:"late", due:due, label:"Overdue", color:"var(--bad)",
                       note:(-left)+"d late"};
  return {state:"progress", due:due, label:"In time", color:"var(--c-po)",
          note:left+"d left"};
}

/* ---------------- state ---------------- */
var db = null, dbReady = false, canWrite = null, lastErr = null;
var isOwner = false, userChecked = false, ownerNote = "checking…";
var testMode = false, unsub = null;
var jeLines=[{acc:"",dr:0,cr:0}];
var jeNarrative="";
var scanKind = "SO", scanData = null;
function coll(){ return testMode ? "test_entries" : "entries"; }
function loadTestFlag(){
  try{ testMode = localStorage.getItem("ot_test") === "1"; }catch(e){ testMode = false; }
}
function setTestMode(on){
  testMode = !!on;
  try{ localStorage.setItem("ot_test", testMode ? "1" : "0"); }catch(e){}
  entries = []; lines = []; draft = {};
  if(unsub){ try{ unsub(); }catch(e){} unsub = null; }
  render();
  loadData();
}
var entries = [];          // {id, ...fields}
/* the screen you are on (and an unsaved document) survive the page being reloaded in the background */
var UI_KEY = "ot_ui1", pendingView = null, _uiT = null;
function saveUi(){
  clearTimeout(_uiT);
  _uiT = setTimeout(saveUiNow, 250);
}
function saveUiNow(){
  try{
    var g = null;
    if(view==="entry" && GE){ g = JSON.parse(JSON.stringify(GE)); }
    localStorage.setItem(UI_KEY, JSON.stringify({at:Date.now(), test:testMode, view:view, saleTab:typeof saleTab!=="undefined"?saleTab:"", purTab:purTab, cashTab:cashTab, faTab:typeof faTab!=="undefined"?faTab:"",
      reportTab:typeof reportTab!=="undefined"?reportTab:"", selItem:selItem, selAcc:selAcc, selChqBank:selChqBank, ge:g}));
  }catch(e){}
}
function restoreUi(){
  try{
    var u = JSON.parse(localStorage.getItem(UI_KEY)||"null");
    if(!u || !u.view || Date.now() - (u.at||0) > 12*3600*1000 || !!u.test !== !!testMode) return false;
    if(u.saleTab) saleTab = u.saleTab; if(u.purTab) purTab = u.purTab; if(u.cashTab) cashTab = u.cashTab;
    if(u.faTab) faTab = u.faTab; if(u.reportTab) reportTab = u.reportTab;
    if(u.selItem) selItem = u.selItem; if(u.selAcc) selAcc = u.selAcc; if(u.selChqBank) selChqBank = u.selChqBank;
    if(u.view==="entry"){ if(!u.ge) return false; GE = u.ge; entryType = GE.type; }
    view = u.view; userNavigated = true;
    if((OWNER_VIEWS[view] || view==="dash") && !isOwner) pendingView = view;
    return true;
  }catch(e){ return false; }
}
document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="hidden") saveUiNow(); });
window.addEventListener("pagehide", saveUiNow);
var view = "dash";
var entryType = "PO";
var lines = [];            // pending lines for current entry
var draft = {};            // header fields of current entry
var editing = null;        // entry id being edited

/* ---------------- helpers ---------------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function num(v){ var n = parseFloat(String(v==null?"":v).replace(/,/g,"")); return isFinite(n)?n:0; }
function fmt(n,d){ if(d===undefined) d=0;
  return (isFinite(n)?n:0).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}); }
function rs(n){ return "Rs " + fmt(Math.round(n)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function toast(msg){
  var h = $("toastHost"); h.innerHTML = '<div class="toast">'+esc(msg)+'</div>';
  setTimeout(function(){ h.innerHTML=""; }, 2200);
}

/* derived lookups */
function soRows(){ return entries.filter(function(e){ return e.type==="SO"; }); }
function opRows(){ return entries.filter(function(e){
  return e.type!=="CFG" && e.type!=="PAY"; }); }
function buyRows(){ return entries.filter(function(e){ return e.type==="PO"; }); }
function materials(){
  var t = itemTypes();
  return Object.keys(t).filter(function(n){ return t[n]==="RM"; }).sort();
}
function allItemNames(){ return Object.keys(itemTypes()).sort(); }
function suppliers(){
  var seen={}, out=[];
  buyRows().forEach(function(e){
    if(e.customer && !seen[e.customer]){ seen[e.customer]=1; out.push(e.customer); }
  });
  entries.forEach(function(e){ if(e.type==="CFG" && e.payKind==="PARTY" && e.customer && !seen[e.customer]){ seen[e.customer]=1; out.push(e.customer); } });
  return out.sort();
}
/* ================= inventory engine: perpetual stock at weighted-average cost =================
   Purchase in at bill rate -> WO issues material at average cost, adds conversion costs,
   receives finished goods at full cost -> DC sends goods out at average cost (COGS).
   Returns (CN restock / DN), adjustments and opening stock flow through the same engine. */
var _inv = null;
function woMats(e){
  if(e.mats && e.mats.length) return e.mats.map(function(m){ return {name:m.name, qty:num(m.qty)}; }).filter(function(m){ return m.name && m.qty>0; });
  return (e.matName && num(e.matQty)>0) ? [{name:e.matName, qty:num(e.matQty)}] : [];
}
function woOther(e){ return ALL_COSTS.reduce(function(a,k){ return k==="material" ? a : a + num(e[k]); }, 0); }
function invEngine(){
  if(_inv) return _inv;
  var mv = [];
  entries.forEach(function(e){
    var d = entryDay(e), c = e.created||0, q = num(e.qty);
    if(!e.description && e.type!=="WO") return;
    if(e.type==="PO")  mv.push({d:d, p:0, c:c, item:e.description, q:q, val:q*num(e.rate), kind:"Purchase", no:e.docNo, party:e.customer, e:e});
    if(e.type==="ADJ" && q>0) mv.push({d:d, p:1, c:c, item:e.description, q:q, val: num(e.rate)>0 ? q*num(e.rate) : null, kind: e.note==="Opening stock" ? "Opening stock" : "Adjustment", no:"", party:e.note||"", e:e});
    if(e.type==="CN" && e.restock) mv.push({d:d, p:1, c:c, item:e.description, q:q, val:null, kind:"Sale return", no:e.docNo, party:e.customer, e:e});
    if(e.type==="WO"){
      woMats(e).forEach(function(m){ mv.push({d:d, p:2, c:c, item:m.name, q:-m.qty, kind:"Issued to production", no:e.docNo, party:e.description, e:e, issue:true}); });
      if(e.description && q>0) mv.push({d:d, p:3, c:c, item:e.description, q:q, kind:"Manufactured", no:e.docNo, party: e.poNo ? "SO "+e.poNo : "For stock", e:e, fg:true});
    }
    if(e.type==="ADJ" && q<0) mv.push({d:d, p:4, c:c, item:e.description, q:q, kind:"Adjustment", no:"", party:e.note||"", e:e});
    if(e.type==="DC")  mv.push({d:d, p:4, c:c, item:e.description, q:-q, kind:"Dispatch", no:e.docNo, party:e.customer, e:e, dc:true});
    if(e.type==="DN")  mv.push({d:d, p:4, c:c, item:e.description, q:-q, kind:"Purchase return", no:e.docNo, party:e.customer, e:e});
  });
  mv.sort(function(a,b){ return a.d<b.d ? -1 : a.d>b.d ? 1 : (a.p-b.p) || (a.c-b.c); });
  var st = {}, last = {}, wo = {}, dc = {}, moves = {};
  function S(i){ return st[i] || (st[i] = {q:0, v:0}); }
  function avg(i){ var s = S(i); return s.q > 0.0001 ? s.v/s.q : (last[i]||0); }
  mv.forEach(function(m){
    var s = S(m.item), id = m.e.id || ("r"+m.c);
    if(m.q < 0){
      m.val = -m.q * avg(m.item);
      s.q += m.q; s.v -= m.val;
      if(s.q <= 0.0001){ s.v = Math.max(0, s.v); if(s.q > -0.0001) s.v = 0; }
      if(m.issue){ (wo[id] = wo[id] || {mat:0, other:0}).mat += m.val; }
      if(m.dc) dc[id] = (dc[id]||0) + m.val;
    } else {
      if(m.fg){
        var w = wo[id] = wo[id] || {mat:0, other:0};
        if(!woMats(m.e).length) w.mat = num(m.e.material);       /* older WOs: material cost typed in */
        w.other = woOther(m.e);
        m.val = w.mat + w.other; w.total = m.val; w.perPc = m.q>0 ? m.val/m.q : 0;
      }
      if(m.val===null || m.val===undefined) m.val = m.q * avg(m.item);
      s.q += m.q; s.v += m.val;
    }
    if(s.q > 0.0001) last[m.item] = s.v/s.q;
    m.balQ = s.q; m.balV = s.v;
    (moves[m.item] = moves[m.item] || []).push(m);
  });
  _inv = {st:st, last:last, wo:wo, dc:dc, moves:moves, all:mv};
  return _inv;
}
function invQty(i){ var s = invEngine().st[i]; return s ? s.q : 0; }
function invVal(i){ var s = invEngine().st[i]; return s ? Math.max(0, s.v) : 0; }
function invAvg(i){ var E = invEngine(), s = E.st[i]; return s && s.q > 0.0001 ? s.v/s.q : (E.last[i]||0); }
function dcCostOf(e){ return invEngine().dc[e.id] || 0; }
function woCostOf(e){ return invEngine().wo[e.id] || {mat:num(e.material), other:woOther(e), total:lineTotalCost(e), perPc:0}; }

/* average cost per KG, excluding GST (engine first, purchase average as fallback) */
function avgMatRate(mat){
  var ia = invAvg(mat); if(ia) return ia;
  var v=0, q=0;
  buyRows().forEach(function(e){
    if(e.description!==mat) return;
    v += num(e.qty)*num(e.rate); q += num(e.qty);
  });
  return q>0 ? v/q : 0;
}
function docExists(kind, no){
  if(!no) return false;
  var n = String(no).trim().toLowerCase();
  return entries.some(function(e){
    if(e.type !== kind) return false;
    var v = (kind==="SO") ? e.poNo : e.docNo;
    return String(v||"").trim().toLowerCase() === n;
  });
}
/* stock of a bought-in item held for resale: purchased, less any issued into production */
function tradeStock(desc){
  var inn=0;
  entries.forEach(function(e){ if(e.type==="PO" && e.description===desc) inn += num(e.qty); });
  return inn;
}
/* what a DC may draw on: own production plus bought-in stock, less what already went */
function availableForDC(po, desc){
  return invQty(desc);
}
function matStock(mat){ return invQty(mat); }
function soNumbers(){
  var seen={},out=[];
  soRows().forEach(function(e){ if(e.poNo && !seen[e.poNo]){ seen[e.poNo]=1; out.push(e.poNo); } });
  return out.sort();
}
function linesOfPO(po){
  var seen={},out=[];
  soRows().forEach(function(e){
    if(e.poNo===po && e.description && !seen[e.description]){ seen[e.description]=1; out.push(e.description); }
  });
  return out;
}
function linesOfSO(so){
  var seen={}, out=[];
  soRows().forEach(function(e){
    if(e.poNo===so && e.description && !seen[e.description]){ seen[e.description]=1; out.push(e.description); }
  });
  return out;
}
function soInfo(po){
  var r = soRows().filter(function(e){ return e.poNo===po; })[0];
  return r || null;
}
function lineInfo(po, desc){
  var r = soRows().filter(function(e){ return e.poNo===po && e.description===desc; })[0];
  return r || null;
}
function sumQty(type, po, desc){
  return entries.reduce(function(a,e){
    return a + ((e.type===type && e.poNo===po && e.description===desc) ? num(e.qty) : 0); }, 0);
}
function customers(){
  var seen={},out=[];
  soRows().forEach(function(e){ if(e.customer && !seen[e.customer]){ seen[e.customer]=1; out.push(e.customer); } });
  entries.forEach(function(e){ if(e.type==="CFG" && e.payKind==="PARTY" && e.customer && !seen[e.customer]){ seen[e.customer]=1; out.push(e.customer); } });
  return out.sort();
}
function lineTotalCost(e){
  return ALL_COSTS.reduce(function(a,k){ return a + num(e[k]); }, 0);
}
/* weighted average cost per piece across all WO rows of a PO line */
function sumDeduction(po, desc){
  return entries.reduce(function(a,e){
    return a + ((e.type==="DC" && e.poNo===po && e.description===desc) ? num(e.deduction) : 0); },0);
}
function avgCostPerPc(po, desc){
  var c=0,q=0;
  entries.forEach(function(e){
    if(e.type==="WO" && e.poNo===po && e.description===desc){ c += lineTotalCost(e); q += num(e.qty); }
  });
  return q>0 ? c/q : 0;
}
function nextDocNo(){
  var max=0;
  entries.forEach(function(e){
    if(e.type==="WO" && e.docNo){
      var m = /WO-(\d+)/.exec(e.docNo);
      if(m){ var v=parseInt(m[1],10); if(v>max) max=v; }
    }
  });
  return "WO-" + String(max+1).padStart(4,"0");
}
function pendingLines(){
  var map={};
  soRows().forEach(function(e){
    var k = e.poNo + "\u0000" + e.description;
    if(!map[k]) map[k] = {poNo:e.poNo, desc:e.description, customer:e.customer,
                          cat:e.category, rate:num(e.rate), ordered:0,
                          poDay:entryDay(e), lastDc:""};
    map[k].ordered += num(e.qty);
    var d = entryDay(e);
    if(!map[k].poDay || d < map[k].poDay) map[k].poDay = d;
  });
  return Object.keys(map).map(function(k){
    var r = map[k];
    r.made    = sumQty("WO", r.poNo, r.desc);
    r.shipped = sumQty("DC", r.poNo, r.desc);
    r.deduct  = sumDeduction(r.poNo, r.desc);
    entries.forEach(function(e){
      if(e.type==="DC" && e.poNo===r.poNo && e.description===r.desc){
        var d = entryDay(e);
        if(!r.lastDc || d > r.lastDc) r.lastDc = d;
      }
    });
    r.toMake  = Math.max(0, r.ordered - r.made);
    r.toShip  = Math.max(0, r.made - r.shipped);
    return r;
  });
}

function loadUser(){
  if(!(window.claude && claude.use)){ userChecked = true; ownerNote = "no runtime"; return; }
  try{
    claude.use("user").then(function(u){
      if(!u){ ownerNote = "user capability unavailable"; userChecked = true; render(); return; }
      userCap = u; ownerNote = "";
      try{ u.id().then(function(id){ myUserId = id || null; }).catch(function(){}); }catch(e){}
      function ask(fn){ try{ return Promise.resolve(fn()).catch(function(){ return false; }); }catch(e){ return Promise.resolve(false); } }
      return Promise.all([ask(function(){ return u.isOwner(); }), ask(function(){ return u.canEdit(); })]).then(function(r){
        claudeAdmin = r[0] === true || r[1] === true;
        userChecked = true;
        if(pendingView && isOwner){ view = pendingView; pendingView = null; }
        if(!userNavigated){ view = defaultView(); openGroups = {sale:false, purchase:false, cash:false}; }
        render();
      });
    }).then(function(){
      return;
      if(pendingView && isOwner){ view = pendingView; pendingView = null; }
      if(!userNavigated){ view = defaultView(); openGroups = {sale:false, purchase:false, cash:false}; }
      render();
    }).catch(function(e){
      ownerNote = "user check rejected"; userChecked = true; render();
    });
  }catch(e){ userChecked = true; ownerNote = "user check threw"; }
}

function loadData(){
  if(!(window.claude && claude.use)){
    lastErr = "no_runtime"; render(); return;
  }
  /* check write permission — viewers outside the owner's org get 'view' level
     and cannot write to db; employees must be shared as Contributor or above */
  claude.use("user").then(function(u){
    if(!u){ canWrite = true; return; }
    u.can("data.write").then(function(result){
      canWrite = result !== false; /* null = unknown, proceed; false = no write */
      render();
    }).catch(function(){ canWrite = true; });
  }).catch(function(){ canWrite = true; });
  claude.use("db").then(function(d){
    if(!d){ dbReady = false; render(); return; }
    db = d; dbReady = true;
    loadUsers();
    unsub = db.collection(coll()).onSnapshot(function(snap){
      var out = [], hist = [];
      snap.docs.forEach(function(doc){
        var raw = doc.data(); if(!raw) return;
        var v = {};
        Object.keys(raw).forEach(function(k){ v[k] = raw[k]; });
        v.id = doc.id;
        if(v.type==="HIST") hist.push(v); else out.push(v);
      });
      out.sort(function(a,b){ return (b.created||0) - (a.created||0); });
      entries = out; histRows = hist;
      dbReady = true;
      render();
    }, function(err){
      lastErr = (err && err.code) ? err.code : "unavailable";
      render();
    });
  }).catch(function(){ dbReady = false; render(); });
}

function saveRows(rows){
  if(!db){ toast("Storage unavailable"); return Promise.resolve(); }
  if(canWrite === false){ return Promise.reject({code:"permission_denied"}); }
  return Promise.all(rows.map(function(r){
    if(curUser && !r.by){ r.by = curUser.uid; r.byName = curUser.name; }
    return db.collection(coll()).doc(uid()).set(r);
  })).catch(function(e){
    if(e && (e.code==="invalid_argument"||e.code==="permission_denied")){
      canWrite = false; render();
      return Promise.reject(e);
    }
    return Promise.reject(e);
  });
}
function updateRow(id, patch){
  if(!db) return Promise.resolve();
  return db.collection(coll()).doc(id).update(patch);
}
function deleteRow(id){
  if(!db) return Promise.resolve();
  return db.collection(coll()).doc(id).delete();
}

function totalsHTML(){
  if(entryType==="INV") return invTotalsHTML();
  var value=0, cost=0;
  var ded = 0;
  lines.forEach(function(L){
    value += num(L.qty) * num(L.rate);
    ded   += num(L.deduction);
    if(entryType==="WO") cost += ALL_COSTS.reduce(function(a,k){ return a+num(L[k]); },0);
    if(entryType==="DC") cost += num(L.qty) * invAvg(L.description);
  });
  value -= ded;
  if(entryType==="PO"){
    var kg = lines.reduce(function(a,L){ return a + num(L.qty); },0);
    if(!isOwner){
      return '<div class="totals"><span class="muted">Total material purchased</span>'
        + '<span class="big">'+fmt(kg,1)+' KG</span></div>';
    }
    return '<div class="totals"><span class="muted">'+fmt(kg,1)+' KG purchased, excluding GST</span>'
      + '<span class="big">'+rs(value)+'</span></div>' + billPayHTML(value*(1+GST_RATE));
  }
  if(entryType==="SO"){
    if(!isOwner){
      var q = lines.reduce(function(a,L){ return a + num(L.qty); },0);
      return '<div class="totals"><span class="muted">Total quantity</span>'
        + '<span class="big">'+fmt(q)+' PC</span></div>';
    }
    return '<div class="totals"><span class="muted">Order value</span>'
      + '<span class="big">'+rs(value)+'</span></div>';
  }
  if(!isOwner){
    if(entryType==="WO"){
      return '<div class="totals"><span class="muted">Total cost on these lines</span>'
        + '<span class="big">'+rs(cost)+'</span></div>';
    }
    var qty = lines.reduce(function(a,L){ return a + num(L.qty); },0);
    return '<div class="totals"><span class="muted">Quantity to dispatch</span>'
      + '<span class="big">'+fmt(qty)+' PC</span></div>';
  }
  var p = value - cost;
  var lbl = entryType==="WO" ? "Projected profit (realised on dispatch)" : "Profit on this dispatch";
  var dedTxt = ded>0 ? ' (after '+rs(ded)+' deduction)' : '';
  return '<div class="totals"><span class="muted">'+lbl+'<br>Net value '+rs(value)+dedTxt+' &minus; cost '+rs(cost)+'</span>'
    + '<span class="big '+(p>=0?"pos":"neg")+'">'+rs(p)+'</span></div>';
}

      +  '<option value="">Select…</option>'

  }

  var bal = "";
  if(!stock){
    var ordered = sumQty("SO", po, draft.description);
    var made    = sumQty("WO", po, draft.description);

    bal = ordered - made - inList;

      +  '<div class="stat"><div class="k">Rate</div><div class="v">'+fmt(num(lineInfo(po,draft.description).rate),2)+'</div></div></div>';
    if(bal <= 0) bal = "";
  } else {
    h += '<div class="banner info">Production for stock. It can be sold later from <strong>Dispatch &rarr; No SO, sell from stock</strong>.</div>';
  }

  h += '<div class="row c2">';
  h += '<div><label for="f_qty">Manufactured (PC)</label><input id="f_qty" inputmode="decimal" value="'+bal+'"><div class="hint" id="qtyHint"></div></div>';
  h += '<div><label for="f_cqty">Consumed ('+costUnit(cat)+')</label><input id="f_cqty" inputmode="decimal" placeholder="0"></div>';
  h += '</div>';

  var mats = materials();
  h += '<div class="sec-title">Material issued</div>';

    h += '<div class="banner warn">No material purchased yet. Post a PO first so the app can work out material cost.</div>';
  } else {
    var dmats = draft.mats || [];
    if(dmats.length){
      h += '<div style="margin-bottom:10px">';
      dmats.forEach(function(m, i){
        h += '<div class="linerow"><div class="g"><div class="t">'+esc(m.name)+'</div><div class="s">'+fmt(m.qty,1)+' KG'
          +  (isOwner ? ' &middot; Rs '+fmt(m.qty*invAvg(m.name),0) : '')+'</div></div>'
          +  '<button class="x" data-mrm="'+i+'" aria-label="Remove material">&times;</button></div>';
      });
      h += '</div>';
    }
    h += '<div class="row c3">';
    h += '<div><label for="m_name">'+(dmats.length?"Another material":"Material")+'</label><select id="m_name"><option value="">Select…</option>'
      +  mats.map(function(m){ return '<option'+(draft.matName===m?" selected":"")+'>'+esc(m)+'</option>'; }).join("")
      +  '</select></div>';
    h += '<div><label for="m_qty">Quantity issued (KG)</label>'
      +  '<input id="m_qty" inputmode="decimal" placeholder="0"><div class="hint" id="matHint"></div></div>';
    h += '<div><label>Material cost (auto)</label><input readonly id="m_cost" value="&mdash;"></div>';
    h += '</div>';
    h += '<button class="btn sec sm" id="m_add" style="width:auto;padding:0 14px;margin:-4px 0 12px">+ Issue another material</button>';
    if(draft.matName){
      var stk = matStock(draft.matName);
      h += '<div class="s muted" style="font-size:12px;margin:-4px 0 12px 0">In stock: '
        +  '<strong style="color:'+(stk<=0?"var(--bad)":"var(--accent)")+'">'+fmt(stk,1)+' KG</strong>'
        +  (isOwner ? ' &middot; average rate Rs '+fmt(avgMatRate(draft.matName),2)+' per KG (ex-GST)' : '')+'</div>';
    }
  }
  var fields = (COST_FIELDS[cat] || []).filter(function(f){ return f !== "material"; });
  if(fields.length){
    h += '<div class="sec-title">Other costs for this line &mdash; total rupees</div>';
    h += '<div class="row c4">';
    fields.forEach(function(f){
      h += '<div><label for="c_'+f+'">'+COST_LABEL[f]+'</label>'
        +  '<input id="c_'+f+'" class="costin" inputmode="decimal" placeholder="0"></div>';
    });
    h += '</div>';
  }
  if(!stock) h += '<div class="totals"><span class="muted">Line value &minus; cost</span><span class="big" id="liveProfit">&mdash;</span></div>';
  h += '<button class="btn sec" id="addLine">+ Add line</button>';
  h += '</div>';
  return h;
}

function ivDue(iv){

  return addDays(iv.date||todayDay(), d);
}

/* ---------------- DOCUMENT SCAN ---------------- */
var sampleFn = null, scanLimits = null, scanBusy = false;

function loadSample(){
  if(!(window.claude && claude.use)) return;
  claude.use("sample").then(function(fn){
    if(!fn) return;
    sampleFn = fn;
    fn.limits().then(function(l){ scanLimits = l; }).catch(function(){});
  }).catch(function(){});
}

function scanAccept(){
  return (scanLimits && scanLimits.images && scanLimits.images.mediaTypes)
    ? scanLimits.images.mediaTypes.join(",") : "image/*";
}

function openScan(){
  if(!sampleFn){
    $("modalHost").innerHTML = '<div class="modal" id="mOverlay"><div class="sheet">'
      + '<h2>Scanning not available</h2>'
      + '<p class="muted" style="font-size:13px;margin:8px 0 16px 0">This view cannot reach Claude to read documents. '
      + 'It may still be starting up &mdash; wait a few seconds and try again. If it keeps happening, your account may not '
      + 'have this enabled.</p>'
      + '<button class="btn sec" id="scanClose">Close</button></div></div>';
    $("scanClose").onclick = closeEdit;
    $("mOverlay").addEventListener("click", function(ev){ if(ev.target.id==="mOverlay") closeEdit(); });
    return;
  }
  var kinds = [
    {k:"SO", t:"Customer order", d:"A customer PO — becomes an SO here"},
    {k:"PO", t:"Supplier purchase", d:"Your purchase order for material"},
    {k:"DC", t:"Delivery challan", d:"A dispatch document"}
  ];
  var h = '<div class="modal" id="mOverlay"><div class="sheet">';
  h += '<h2>Scan a document</h2>';
  h += '<p class="muted" style="font-size:13px;margin:6px 0 14px 0">Take a photo, choose a file, or drag one in. '
    +  'The app reads it and fills the form &mdash; you check it before posting.</p>';
  h += '<div class="sec-title" style="margin-top:0">What is it?</div>';
  h += '<div class="seg" style="margin-top:0">'
    +  kinds.map(function(x){
         return '<button data-scankind="'+x.k+'" class="'+(scanKind===x.k?"on":"")+'"'
              + (scanKind===x.k?' style="background:var(--primary);border-color:var(--primary);color:var(--on-primary)"':'')
              + '>'+x.k+'</button>'; }).join("")
    +  '</div>';
  var cur = kinds.filter(function(x){ return x.k===scanKind; })[0];
  h += '<p class="muted" style="font-size:12px;margin:-6px 0 14px 0">'+esc(cur.d)+'</p>';

  h += '<div class="drop" id="dropZone">'
    +  '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>'
    +  '<h4>Drop a photo here</h4><p>or tap to choose &middot; JPEG, PNG, screenshots</p></div>';
  h += '<input id="scanFile" type="file" accept="'+scanAccept()+'" style="display:none">';
  h += '<input id="scanCam" type="file" accept="image/*" capture="environment" style="display:none">';
  h += '<div style="display:flex;gap:10px;margin-top:12px">'
    +  '<button class="btn sec" id="scanPick" style="flex:1">Choose file</button>'
    +  '<button class="btn sec" id="scanShot" style="flex:1">Take photo</button></div>';
  h += '<div id="scanOut"></div>';
  h += '<div style="display:flex;gap:10px;margin-top:16px">'
    +  '<button class="btn sec" id="scanClose" style="flex:1">Close</button></div>';
  h += '</div></div>';
  $("modalHost").innerHTML = h;

  $("scanClose").onclick = closeEdit;
  $("mOverlay").addEventListener("click", function(ev){ if(ev.target.id==="mOverlay") closeEdit(); });
  Array.prototype.forEach.call(document.querySelectorAll("[data-scankind]"), function(b){
    b.onclick = function(){ scanKind = b.dataset.scankind; openScan(); };
  });
  $("scanPick").onclick = function(){ $("scanFile").click(); };
  $("scanShot").onclick = function(){ $("scanCam").click(); };
  $("scanFile").onchange = function(){ if(this.files && this.files[0]) runScan(this.files[0]); };
  $("scanCam").onchange  = function(){ if(this.files && this.files[0]) runScan(this.files[0]); };

  var dz = $("dropZone");
  dz.onclick = function(){ $("scanFile").click(); };
  ["dragenter","dragover"].forEach(function(ev){
    dz.addEventListener(ev, function(e){ e.preventDefault(); dz.classList.add("over"); });
  });
  ["dragleave","drop"].forEach(function(ev){
    dz.addEventListener(ev, function(e){ e.preventDefault(); dz.classList.remove("over"); });
  });
  dz.addEventListener("drop", function(e){
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) runScan(f);
  });
}

function scanPrompt(kind){
  var common = "You are reading a scanned business document from a textile accessories factory in Pakistan. "
    + "Read every line item. Ignore GST, sales tax and totals — capture rates EXCLUDING tax. "
    + "If a value is unreadable use null, never guess. Reply with only JSON.\n\n";
  if(kind==="SO"){
    return common
      + "This is a purchase order sent BY a customer TO the factory.\n"
      + 'Reply: {"docNo":"customer PO number","party":"customer name","category":"Thread|Printing|Scrubber|Tapes",'
      + '"lines":[{"description":"item as written, with count, colour and length","qty":number,"rate":number}]}\n'
      + 'Category: sewing thread/cones = Thread; tags, labels, stickers, cards = Printing; '
      + 'elastic or twill tape = Tapes; scrubber pads = Scrubber.';
  }
  if(kind==="PO"){
    return common
      + "This is a purchase order FROM the factory TO a supplier, for raw material.\n"
      + 'Reply: {"docNo":"PO number","party":"supplier name","category":"Thread|Printing|Scrubber|Tapes",'
      + '"lines":[{"description":"material as written","qty":number,"rate":number}]}\n'
      + 'Quantities are usually KG. Rate is per KG excluding GST.';
  }
  return common
    + "This is a delivery challan for goods leaving the factory.\n"
    + 'Reply: {"docNo":"DC number","party":"customer name","soNo":"their order number if shown",'
    + '"lines":[{"description":"item as written","qty":number}]}';
}

function runScan(file){
  if(scanBusy || !sampleFn) return;
  var out = $("scanOut");
  if(scanLimits && scanLimits.images && file.size > scanLimits.images.maxInputBytes){
    out.innerHTML = '<div class="banner warn">That file is too large. Try a smaller photo.</div>';
    return;
  }
  scanBusy = true;
  var url = URL.createObjectURL(file);
  out.innerHTML = '<img class="thumb" src="'+url+'" alt="Document being read">'
    + '<div class="banner info" id="scanMsg" style="margin-top:12px">Reading the document… this takes 10 to 60 seconds.</div>';

  sampleFn.json(scanPrompt(scanKind), {images:[file], modelTier:"default"})
    .then(function(data){
      scanBusy = false;
      URL.revokeObjectURL(url);
      showScanResult(data);
    })
    .catch(function(e){
      scanBusy = false;
      URL.revokeObjectURL(url);
      var msg = "Could not read it. Try a clearer photo.";
      if(e.code==="not_granted")    msg = "You declined access to Claude, so scanning is off for this visit.";
      if(e.code==="rate_limited")   msg = "Too many scans just now. Wait a minute and try again.";
      if(e.code==="image_rejected") msg = "That image could not be read. Try a JPEG or PNG.";
      if(e.code==="invalid_json")   msg = "The document was unclear. Try a straighter, brighter photo.";
      var m = $("scanMsg");
      if(m){ m.className = "banner warn"; m.textContent = msg; }
    });
}

function showScanResult(d){
  var out = $("scanOut");
  if(!d || !d.lines || !d.lines.length){
    var m0 = $("scanMsg");
    if(m0){ m0.className="banner warn"; m0.textContent = "No line items found. Try a clearer photo."; }
    return;
  }
  scanData = d;

  if(scanKind==="PO"){ draft.docNo = docv; draft.customer = party; draft.category = cat; draft.newSup = true; }

/* ================= CASH & BANK BOOK (Phase 1) =================
   Every money movement is a PAY row:
     payKind AR  = receipt from customer      (in)
     payKind AP  = payment to supplier        (out)
     payKind EXP = expense, customer = head   (out)
     payKind IN  = other money in             (in)
     payKind OUT = other money out            (out)
     payKind TRF = transfer, account -> toAccount
   qty = amount moved, wht = tax deducted (AR/AP only, counts as settled)
   docNo blank on AR/AP = settle oldest bills first (auto)
   Accounts are CFG rows with payKind ACC (customer = name, qty = opening, category = Cash/Bank)
=================================================================== */
var DEFAULT_ACCOUNT = "Cash in hand";
var EXP_HEADS = ["Salaries & wages","Electricity & gas","Rent","Transport & freight",
  "Repairs & maintenance","Fuel","Office & stationery","Bank charges","Miscellaneous"];

function accounts(){
  var rows = cfgRows().filter(function(e){ return e.payKind==="ACC"; });
  var list = rows.map(function(e){ return {id:e.id, name:e.customer, kind:e.category||"Bank", opening:num(e.qty)}; });
  if(!list.some(function(a){ return a.name===DEFAULT_ACCOUNT; }))
    list.unshift({id:"", name:DEFAULT_ACCOUNT, kind:"Cash", opening:0});
  return list;
}
function accKind(name){
  var a = accounts().filter(function(x){ return x.name===name; })[0];
  return a ? a.kind : "Cash";
}
function txnDay(e){ return (e.txnDate || entryDay(e)); }
function isPdc(e){ return !!(e.chqDate && e.chqDate > todayDay()); }
function txnDir(e){ return (e.payKind==="AR"||e.payKind==="IN"||e.payKind==="FAS") ? 1 : (e.payKind==="TRF" ? 0 : -1); }
function expHeads(){
  var seen = {}, out = [];
  EXP_HEADS.concat(payRows().filter(function(e){ return e.payKind==="EXP"; })
    .map(function(e){ return e.customer; }))
    .forEach(function(h){ if(h && !seen[h]){ seen[h]=1; out.push(h); } });
  return out;
}

/* balance per account, cheques dated in the future are left out until their date */
function accBalances(){
  var bal = {};
  accounts().forEach(function(a){ bal[a.name] = a.opening; });
  payRows().forEach(function(e){
    if(isPdc(e) || e.account===OPENING_ACC) return;
    var acc = e.account || DEFAULT_ACCOUNT, amt = num(e.qty);
    if(bal[acc]===undefined) bal[acc] = 0;
    if(e.payKind==="TRF"){
      bal[acc] -= amt;
      var to = e.toAccount || DEFAULT_ACCOUNT;
      if(bal[to]===undefined) bal[to] = 0;
      bal[to] += amt;
      return;
    }
    bal[acc] += txnDir(e) * amt;
  });
  return bal;
}

/* settle invoices / POs: first payments named against a document, then party-level
   payments oldest-first; anything left over is an advance */
var advances = {AR:{}, AP:{}};
function settle(docs, kind){
  var pf = kind==="AR" ? "customer" : "supplier";
  var pool = {};
  docs.forEach(function(r){ r.paid = 0; });
  var byNo = {}; docs.forEach(function(r){ byNo[r.docNo] = r; });
  payRows().forEach(function(e){
    if(e.payKind!==kind) return;
    var amt = num(e.qty) + num(e.wht);
    if(e.docNo && byNo[e.docNo]) byNo[e.docNo].paid += amt;
    else { pool[e.customer] = (pool[e.customer]||0) + amt; }
  });
  noteCredits(kind).forEach(function(c){
    if(c.docNo && byNo[c.docNo]) byNo[c.docNo].paid += c.amt;
    else pool[c.party] = (pool[c.party]||0) + c.amt;
  });
  docs.slice().sort(function(a,b){ return a.day < b.day ? -1 : 1; }).forEach(function(r){
    var left = r.gross - r.paid, p = pool[r[pf]] || 0;
    if(left > 0 && p > 0){ var take = Math.min(left, p); r.paid += take; pool[r[pf]] = p - take; }
  });
  docs.forEach(function(r){ r.due = r.gross - r.paid; });
  advances[kind] = {};
  Object.keys(pool).forEach(function(k){ if(pool[k] > 0.5) advances[kind][k] = pool[k]; });
  return docs;
}

function amtCell(e){
  var d = txnDir(e);
  return '<td class="num '+(d>0?"pos":(d<0?"neg":"muted"))+'" style="white-space:nowrap;font-weight:600">'
    + (d>0?"+ ":(d<0?"&minus; ":"")) + rs(e.qty) + '</td>';
}
function txnLabel(e){
  var n = e.customer || "";
  if(e.payKind==="AR")  return "Received from "+n+(e.docNo?" · "+e.docNo:"");
  if(e.payKind==="AP")  return "Paid to "+n+(e.docNo?" · "+e.docNo:"");
  if(e.payKind==="EXP") return n+(e.description && e.description!==n?" · "+e.description:"");
  if(e.payKind==="TRF") return "Transfer"+(e.description?" · "+e.description:"");
  if(e.payKind==="FAB") return "Fixed asset bought · "+n;
  if(e.payKind==="FAS") return "Fixed asset sold · "+n;
  return e.description || n || "Other";
}

        t.sel[no] = {rec:String(Math.round((due - tx)*100)/100), tax: tx ? String(tx) : ""}; t.adv = false; }
      else delete t.sel[no];
      drawTxn();

  function applyRate(){
    var docs = pendDocs(t);

      var r = docs.filter(function(x){ return x.docNo===no; })[0]; if(!r) return;

function saveTxn(){
  var t = txn, amt = num(t.amt);
  var bySel = (t.kind==="AR"||t.kind==="AP") && !t.adv;
  if(bySel){
    if(!t.party){ toast("Pick a party"); return; }
    var keys = Object.keys(t.sel||{});
    if(!keys.length){ toast("Tick the "+(t.kind==="AR"?"invoice":"bill")+"(s) being paid, or tick Advance"); return; }
    var docsP = pendDocs(t), bad = keys.filter(function(k){ var r = docsP.filter(function(x){ return x.docNo===k; })[0];
      return !r || num(t.sel[k].rec) + num(t.sel[k].tax) > r.due + 0.5 || num(t.sel[k].rec) < 0; })[0];
    if(bad){ toast(bad+": amount plus tax is more than its balance"); return; }
    amt = selTotals(t).rec;
    if(amt <= 0 && selTotals(t).tax <= 0){ toast("Enter the amount received"); return; }
  } else if(amt <= 0){ toast("Enter an amount"); return; }
  if((t.kind==="AR"||t.kind==="AP"||t.kind==="EXP") && t.mode!=="cash" && accKind(t.account)!=="Bank"){ toast("Add a bank account first"); return; }
  if((t.kind==="AR"||t.kind==="AP"||t.kind==="EXP") && t.mode==="chq"){
    if(!String(t.chqNo||"").trim()){ toast("Enter the cheque number"); return; }
    if(!t.chqDate) t.chqDate = t.date || todayDay();
  }
  if((t.kind==="AR"||t.kind==="AP"||t.kind==="EXP") && !String(t.party).trim()){
    toast(t.kind==="EXP" ? "Pick an expense head" : "Pick a party"); return; }
  if(t.kind==="TRF" && t.account===t.to){ toast("Pick two different accounts"); return; }
  if((t.kind==="IN"||t.kind==="OUT") && !String(t.note).trim()){ toast("Add a few words of detail"); return; }
  var moded = t.kind==="AR"||t.kind==="AP"||t.kind==="EXP";
  var bankSide = moded ? t.mode==="chq" : (t.kind==="TRF" ? (accKind(t.account)==="Bank"||accKind(t.to)==="Bank") : accKind(t.account)==="Bank");
  var n = Date.now();
  function row(docNo, q, wht, i){ return {
    type:"PAY", created:n+(i||0), date:new Date(n).toISOString(), txnDate:t.date || todayDay(),
    payKind:t.kind, customer:String(t.party||"").trim(), docNo:docNo||"",
    qty:Math.round(q*100)/100, wht:wht, rate:0,
    account:t.account, toAccount:t.kind==="TRF" ? t.to : "",
    chqNo:bankSide ? String(t.chqNo||"").trim() : "", chqDate:bankSide ? (t.chqDate||"") : "",
    payMode: moded ? t.mode : "", ibftRef: moded && t.mode==="ibft" ? String(t.ref||"").trim() : "", grp: n,
    whtSec: wht > 0 ? (t.whtSec||"") : "", whtRate: wht > 0 ? num(t.whtRate) : 0, whtBase: wht > 0 ? (t.whtBase||"ex") : "", whtCert: wht > 0 ? String(t.whtCert||"").trim() : "",
    description:String(t.note||"").trim(), poNo:"", category:"", poStatus:"",
    costingQty:0, deduction:0, matName:"", matQty:0, forSo:"",
    material:0, dyeing:0, labour:0, printing:0, overhead:0 }; }
  var rows = bySel
    ? Object.keys(t.sel).map(function(k, i){ return row(k, num(t.sel[k].rec), num(t.sel[k].tax), i); })
    : [row("", amt, (t.kind==="AR"||t.kind==="AP") ? num(t.wht) : 0, 0)];
  saveRows(rows).then(function(){ txn = null; closeEdit(); toast(bySel ? "Saved against "+Object.keys(t.sel).join(", ") : "Saved"); });
}

var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function monthKey(e){ return entryDay(e).slice(0,7); }
function lastMonths(n){
  var out=[], now=new Date();
  for(var i=n-1;i>=0;i--){
    var d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth()-i, 1));
    out.push({key: d.toISOString().slice(0,7), label: MON[d.getUTCMonth()], y:d.getUTCFullYear(), m:d.getUTCMonth()});
  }
  return out;
}

function barChart(months, vals, color, unit){
  var W=340, H=170, padL=8, padB=26, top=14;
  var max = Math.max.apply(null, vals.concat([1]));
  var n = vals.length, gap = 18;
  var bw = (W - padL*2 - gap*(n-1)) / n;
  var plotH = H - padB - top;
  var h = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Production by month">';
  h += '<line x1="'+padL+'" y1="'+(top+plotH)+'" x2="'+(W-padL)+'" y2="'+(top+plotH)+'" stroke="var(--border)" stroke-width="1"/>';
  vals.forEach(function(v,i){
    var bh = max>0 ? (v/max)*plotH : 0;
    var x = padL + i*(bw+gap);
    var y = top + plotH - bh;
    var isLast = (i===n-1);
    h += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(1,bh).toFixed(1)+'" rx="5" fill="'+color+'" opacity="'+(isLast?1:0.42)+'"/>';
    h += '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-5).toFixed(1)+'" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text)">'+fmt(v, v<100?1:0)+'</text>';
    h += '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+months[i].label+'</text>';
  });
  h += '</svg>';
  return h;
}

function niceMax(v){
  if(v<=0) return 1;
  var mag = Math.pow(10, Math.floor(Math.log(v)/Math.LN10));
  var n = v/mag;
  var step = n<=1?1 : n<=2?2 : n<=2.5?2.5 : n<=5?5 : 10;
  return step*mag;
}
function shortNum(v){
  if(v>=1000000) return (v/1000000).toFixed(v%1000000?1:0)+"M";
  if(v>=1000)    return (v/1000).toFixed(v%1000?1:0)+"k";
  return fmt(v);
}
/* Catmull-Rom to bezier, so the line flows instead of cornering */
function smoothPath(pts){
  if(!pts.length) return "";
  if(pts.length<3) return pts.map(function(p,i){ return (i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1); }).join(" ");
  var d = "M"+pts[0][0].toFixed(1)+" "+pts[0][1].toFixed(1);
  for(var i=0;i<pts.length-1;i++){
    var p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || p2;
    var c1x = p1[0] + (p2[0]-p0[0])/6, c1y = p1[1] + (p2[1]-p0[1])/6;
    var c2x = p2[0] - (p3[0]-p1[0])/6, c2y = p2[1] - (p3[1]-p1[1])/6;
    d += " C"+c1x.toFixed(1)+" "+c1y.toFixed(1)+", "+c2x.toFixed(1)+" "+c2y.toFixed(1)
       + ", "+p2[0].toFixed(1)+" "+p2[1].toFixed(1);
  }
  return d;
}
function lineChart(days, series){
  var W=360, H=216, padL=42, padR=10, padB=30, top=22;
  var plotW = W - padL - padR, plotH = H - padB - top;
  var raw = 0;
  series.forEach(function(s){ s.data.forEach(function(v){ if(v>raw) raw=v; }); });
  var max = niceMax(raw);
  var n = days;
  var xAt = function(i){ return padL + (n<=1?0:(i/(n-1))*plotW); };
  var yAt = function(v){ return top + plotH - (max>0 ? (v/max)*plotH : 0); };

  var h = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Cumulative quantity by day of month">';

  /* y grid + quantity labels */
  [0,0.25,0.5,0.75,1].forEach(function(f){
    var y = top + plotH - f*plotH;
    h += '<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)
       + '" stroke="var(--border)" stroke-width="0.6" opacity="'+(f===0?1:0.55)+'"/>';
    h += '<text x="'+(padL-7)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" font-size="9.5" fill="var(--muted)">'
       + shortNum(max*f)+'</text>';
  });
  /* axis titles */
  h += '<text x="2" y="9" font-size="9" fill="var(--muted)">Qty (PC)</text>';

  /* x ticks */
  var ticks = [1,5,10,15,20,25,n].filter(function(v,i,a){ return v<=n && a.indexOf(v)===i; });
  ticks.forEach(function(d){
    var x = xAt(d-1);
    h += '<line x1="'+x.toFixed(1)+'" y1="'+(top+plotH)+'" x2="'+x.toFixed(1)+'" y2="'+(top+plotH+4)
       + '" stroke="var(--border)" stroke-width="1"/>';
    h += '<text x="'+x.toFixed(1)+'" y="'+(top+plotH+15)+'" text-anchor="middle" font-size="9.5" fill="var(--muted)">'+d+'</text>';
  });
  h += '<text x="'+(padL+plotW/2)+'" y="'+(H-3)+'" text-anchor="middle" font-size="9" fill="var(--muted)">Day of month</text>';

  /* flowing lines */
  series.forEach(function(sr){
    var pts = sr.data.map(function(v,i){ return [xAt(i), yAt(v)]; });
    h += '<path d="'+smoothPath(pts)+'" fill="none" stroke="'+sr.color+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
    var li = pts.length-1;
    h += '<circle cx="'+pts[li][0].toFixed(1)+'" cy="'+pts[li][1].toFixed(1)+'" r="3.4" fill="'+sr.color+'"/>';
  });
  h += '</svg>';
  return h;
}

function dashHTML(){
  var h = "";
  var months = lastMonths(3);
  var now = new Date();
  var curKey = months[months.length-1].key;
  var daysInMonth = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth()+1, 0)).getUTCDate();

  /* ---- 1. production by domain ---- */
  h += '<div class="sec-title">Production by domain &mdash; last three months</div>';
  h += '<div class="charts">';
  PROD_CATS.forEach(function(pc){
    var vals = months.map(function(mo){
      return entries.reduce(function(a,e){
        return a + ((e.type==="WO" && e.category===pc.cat && monthKey(e)===mo.key) ? num(e.costingQty) : 0); },0);
    });
    var cur = vals[vals.length-1], prev = vals[vals.length-2] || 0;
    var pct = prev>0 ? ((cur-prev)/prev*100) : (cur>0?100:0);
    var up = cur >= prev;
    h += '<div class="chartcard">';
    h += '<h3>'+pc.cat+'</h3>';
    h += '<div class="sub">'+fmt(cur,1)+' '+pc.unit+' this month &middot; '
      +  '<span class="delta" style="color:'+(up?"var(--accent)":"var(--bad)")+'">'
      +  (up?"▲":"▼")+' '+fmt(Math.abs(pct),1)+'%</span> vs last month</div>';
    h += barChart(months, vals, pc.color, pc.unit);
    h += '</div>';
  });
  h += '</div>';

  /* ---- 2. order flow this month ---- */
  /* ---- manufacturing cost per unit ---- */
  var COST_CATS = [
    {cat:"Thread",   unit:"bundle", color:"var(--cat-thread)"},
    {cat:"Printing", unit:"kg",     color:"var(--cat-print)"},
    {cat:"Tapes",    unit:"kg",     color:"var(--cat-tapes)"},
    {cat:"Scrubber", unit:"kg",     color:"var(--cat-scrub)"}
  ];
  h += '<div class="sec-title">Manufacturing cost per unit</div>';
  h += '<div class="charts"><div class="chartcard">';
  h += '<h3>Cost per unit by domain</h3>';
  h += '<div class="sub">'+MON[now.getUTCMonth()]+' so far, against last month</div>';
  COST_CATS.forEach(function(cc){
    function rateFor(key){
      var c=0, q=0;
      entries.forEach(function(e){
        if(e.type!=="WO" || e.category!==cc.cat || monthKey(e)!==key) return;
        c += lineTotalCost(e); q += num(e.costingQty);
      });
      return q>0 ? c/q : 0;
    }
    var cur  = rateFor(months[months.length-1].key);
    var prev = rateFor(months[months.length-2].key);
    var pct  = prev>0 ? ((cur-prev)/prev*100) : 0;
    var worse = cur > prev;
    var arrow = prev>0 ? (worse?"▲":"▼") : "";
    var dColor = prev===0 ? "var(--muted)" : (worse?"var(--bad)":"var(--accent)");
    h += '<div class="kpi" style="align-items:center">'
      +  '<span style="display:flex;align-items:center;gap:8px">'
      +  '<i style="width:10px;height:10px;border-radius:3px;background:'+cc.color+';display:block"></i>'
      +  '<span>'+cc.cat+'<span class="muted" style="font-size:11px"> / '+cc.unit+'</span></span></span>'
      +  '<span style="display:flex;align-items:baseline;gap:10px">'
      +  '<b>'+(cur>0?("Rs "+fmt(cur,0)):"&mdash;")+'</b>'
      +  '<span class="delta" style="color:'+dColor+';font-size:12px;min-width:62px;text-align:right">'
      +  (prev>0 ? arrow+" "+fmt(Math.abs(pct),1)+"%" : "no base")+'</span></span></div>';
  });
  h += '</div></div>';

  /* ---- balance order per domain ---- */
  var ALL_CATS = PROD_CATS.concat([{cat:"Scrubber", unit:"PC", color:"var(--cat-scrub)"}]);
  h += '<div class="sec-title">Balance order &mdash; ordered but not yet dispatched</div>';
  h += '<div class="tickers">';
  ALL_CATS.forEach(function(pc){
    var ordered=0, shipped=0, made=0;
    entries.forEach(function(e){
      if(e.category!==pc.cat) return;
      if(e.type==="SO") ordered += num(e.qty);
      if(e.type==="WO") made    += num(e.qty);
      if(e.type==="DC") shipped += num(e.qty);
    });
    var bal = Math.max(0, ordered - shipped);
    var ready = Math.max(0, made - shipped);
    var toMake = Math.max(0, ordered - made);

    var inTime = 0, late = 0;
    pendingLines().forEach(function(r){
      if(r.cat !== pc.cat) return;
      var pend = Math.max(0, r.ordered - r.shipped);
      if(pend <= 0) return;
      if(lineStatus(r).state === "late") late += pend; else inTime += pend;
    });

    h += '<div class="ticker" style="border-left-color:'+pc.color+'">';
    h += '<h3>'+pc.cat+'</h3>';
    h += '<div class="v" style="color:'+(bal>0?"var(--text)":"var(--muted)")+'">'+fmt(bal)+' PC balance</div>';
    h += '<div style="display:flex;gap:12px;margin-top:6px;font-size:12px;font-weight:600">'
      +  '<span style="color:var(--c-po)">'+fmt(inTime)+' in time</span>'
      +  '<span style="color:'+(late>0?"var(--bad)":"var(--muted)")+'">'+fmt(late)+' late</span></div>';
    h += '<div class="s">'+fmt(toMake)+' to make &middot; '+fmt(ready)+' ready to ship</div>';
    h += '</div>';
  });
  h += '</div>';

  h += '<div class="sec-title">Order flow this month &mdash; '+MON[now.getUTCMonth()]+' '+now.getUTCFullYear()+' (cumulative PC)</div>';
  h += '<div class="charts">';
  PROD_CATS.forEach(function(pc){
    var ord=[], made=[], disp=[];
    var co=0, cm=0, cd=0;
    for(var d=1; d<=daysInMonth; d++){
      var day = curKey + "-" + (d<10?"0"+d:d);
      entries.forEach(function(e){
        if(e.category!==pc.cat || entryDay(e)!==day) return;
        if(e.type==="SO") co += num(e.qty);
        if(e.type==="WO") cm += num(e.qty);
        if(e.type==="DC") cd += num(e.qty);
      });
      ord.push(co); made.push(cm); disp.push(cd);
    }
    var total = Math.max(co, cm, cd);
    h += '<div class="chartcard">';
    h += '<h3>'+pc.cat+'</h3>';
    h += '<div class="sub">Ordered '+fmt(co)+' &middot; Produced '+fmt(cm)+' &middot; Dispatched '+fmt(cd)+' PC</div>';
    if(total===0){
      h += '<div class="empty" style="padding:38px 10px">No movement this month</div>';
    } else {
      h += lineChart(daysInMonth, [
        {data:ord,  color:"var(--c-po)"},
        {data:made, color:"var(--c-wo)"},
        {data:disp, color:"var(--c-dc)"}
      ]);
      h += '<div class="legend">'
        +  '<span><i style="background:var(--c-po)"></i>Order received</span>'
        +  '<span><i style="background:var(--c-wo)"></i>WO processed</span>'
        +  '<span><i style="background:var(--c-dc)"></i>Dispatched</span></div>';
    }
    h += '</div>';
  });
  h += '</div>';
  return h;
}

/* ---------------- SIDE PANEL ---------------- */
function sideHTML(){
  var h = "";
  var all = pendingLines();
  var toMake=0, toShip=0, cost=0, shipVal=0, shipCost=0;
  all.forEach(function(r){
    toMake += Math.max(0, r.ordered - r.made);
    toShip += Math.max(0, r.made - r.shipped);
    var c = entries.reduce(function(a,e){
      return a + ((e.type==="WO"&&e.poNo===r.poNo&&e.description===r.desc)?lineTotalCost(e):0); },0);
    cost += c;
    var perPc = r.made>0 ? c/r.made : 0;
    shipVal  += r.shipped * r.rate - r.deduct;
    shipCost += r.shipped * perPc;
  });
  var profit = shipVal - shipCost;

  h += '<div class="sidecard"><h3>Snapshot</h3>';
  h += '<div class="kpi"><span class="muted">Open lines</span><b>'+all.length+'</b></div>';
  h += '<div class="kpi"><span class="muted">To manufacture</span><b style="color:var(--c-wo)">'+fmt(toMake)+' PC</b></div>';
  h += '<div class="kpi"><span class="muted">Ready to ship</span><b style="color:var(--c-dc)">'+fmt(toShip)+' PC</b></div>';
  h += '<div class="kpi"><span class="muted">Cost incurred</span><b>'+rs(cost)+'</b></div>';
  if(isOwner){
    h += '<div class="kpi"><span class="muted">Shipped value</span><b>'+rs(shipVal)+'</b></div>';
    h += '<div class="kpi"><span class="muted">Realised profit</span><b class="'+(profit>=0?"pos":"neg")+'">'+rs(profit)+'</b></div>';
  }
  h += '</div>';

  var missing = all.filter(function(r){ return r.shipped>0 && r.made===0; });
  if(missing.length){
    h += '<div class="sidecard" style="border-color:color-mix(in srgb,var(--warn) 45%,transparent)">'
      +  '<h3 style="color:var(--warn)">Needs attention</h3>';
    missing.slice(0,4).forEach(function(r){
      h += '<div class="mini WO"><div class="g"><div class="t">'+esc(r.poNo)+' &mdash; no work order</div>'
        +  '<div class="s">'+esc(r.desc)+'</div></div></div>';
    });
    h += '</div>';
  }

  h += '<div class="sidecard"><h3>Recent entries</h3>';
  if(!entries.length){
    h += '<div class="muted" style="font-size:13px;padding:6px 0">Nothing posted yet.</div>';
  } else {
    entries.slice(0,8).forEach(function(e){
      var right = e.type==="WO" ? rs(lineTotalCost(e)) : rs(num(e.qty)*num(e.rate));
      h += '<div class="mini '+e.type+'"><div class="g">'
        +  '<div class="t">'+esc(e.docNo||e.poNo)+' &middot; '+fmt(num(e.qty))+' PC</div>'
        +  '<div class="s">'+esc(e.description)+'</div></div>'
        +  '<div style="font-size:12px;font-weight:600;white-space:nowrap">'+right+'</div></div>';
    });
  }
  h += '</div>';
  return h;
}
