/* ---------------- PENDING ---------------- */
function pendingHTML(){
  var rows = pendingLines().filter(function(r){ return r.toMake>0 || r.toShip>0; });
  var missing = pendingLines().filter(function(r){ return r.shipped>0 && r.made===0; });

  var h = '';
  if(missing.length){
    h += '<div class="banner warn"><strong>'+missing.length+' line'+(missing.length>1?"s":"")+' dispatched with no work order</strong><br>'
      +  missing.map(function(r){ return esc(r.poNo)+" · "+esc(r.desc); }).join("<br>")
      +  '<br>Cost is not captured for these.</div>';
  }
  if(!rows.length) return h + '<div class="empty">Nothing pending. Every line is made and dispatched.</div>';

  var all = pendingLines();
  var totOrd=0, totMade=0, totShip=0;
  all.forEach(function(r){ totOrd+=r.ordered; totMade+=r.made; totShip+=r.shipped; });
  h += '<div class="stats"><div class="stat b-blue"><div class="k">Lines</div><div class="v">'+all.length+'</div></div>'
    +  '<div class="stat b-blue"><div class="k">Ordered</div><div class="v">'+fmt(totOrd)+'</div></div>'
    +  '<div class="stat b-amber"><div class="k">To make</div><div class="v" style="color:var(--c-wo)">'+fmt(Math.max(0,totOrd-totMade))+'</div></div>'
    +  '<div class="stat b-green"><div class="k">To ship</div><div class="v" style="color:var(--c-dc)">'+fmt(Math.max(0,totMade-totShip))+'</div></div></div>';

  var byCat = {};
  rows.forEach(function(r){
    var c = r.cat || "Other";
    if(!byCat[c]) byCat[c] = [];
    byCat[c].push(r);
  });
  var order = CATS.filter(function(c){ return byCat[c]; })
                  .concat(Object.keys(byCat).filter(function(c){ return CATS.indexOf(c)<0; }));

  order.forEach(function(cat){
    var list = byCat[cat];
    var cMake=0, cShip=0, cOrd=0;
    list.forEach(function(r){ cMake+=r.toMake; cShip+=r.toShip; cOrd+=r.ordered; });

    h += '<div class="sec-title" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'
      +  '<span class="chip '+esc(cat)+'">'+esc(cat)+'</span>'
      +  '<span>'+list.length+' line'+(list.length>1?"s":"")+' &middot; '+fmt(cOrd)+' PC ordered</span>'
      +  '<span style="color:var(--c-wo)">'+fmt(cMake)+' to make</span>'
      +  '<span style="color:var(--c-dc)">'+fmt(cShip)+' to ship</span></div>';

    h += '<div class="tbl-scroll"><table><thead><tr>'
      + '<th>Status</th><th>SO</th><th>Line</th><th>Due</th><th>Progress</th>'
      + '<th class="num">Ordered</th><th class="num">Made</th>'
      + '<th class="num">Shipped</th><th class="num">To make</th><th class="num">To ship</th>'
      + '</tr></thead><tbody>';
    list.forEach(function(r){
      var pm = r.ordered>0 ? Math.min(100, r.made/r.ordered*100) : 0;
      var ps = r.ordered>0 ? Math.min(100, r.shipped/r.ordered*100) : 0;
      var st = lineStatus(r);
      h += '<tr style="border-left:4px solid '+st.color+'">'
        + '<td><span class="pill" style="background:color-mix(in srgb,'+st.color+' 18%,transparent);color:'+st.color+'">'
        + st.label+'</span></td>'
        + '<td>'+esc(r.poNo)+'</td>'
        + '<td class="wrapcell">'+esc(r.desc)
        + '<div class="muted" style="font-size:12px;margin-top:3px">'+esc(r.customer)+'</div></td>'
        + '<td><div style="font-size:13px">'+esc(st.due)+'</div>'
        + '<div style="font-size:11px;color:'+st.color+'">'+esc(st.note)+'</div></td>'
        + '<td><div class="bar"><i class="ship" style="width:'+ps.toFixed(1)+'%"></i>'
        + '<i class="made" style="width:'+Math.max(0,pm-ps).toFixed(1)+'%"></i></div></td>'
        + '<td class="num">'+fmt(r.ordered)+'</td><td class="num">'+fmt(r.made)+'</td>'
        + '<td class="num">'+fmt(r.shipped)+'</td>'
        + '<td class="num" style="color:var(--c-wo);font-weight:700">'+fmt(r.toMake)+'</td>'
        + '<td class="num" style="color:var(--c-dc);font-weight:700">'+fmt(r.toShip)+'</td></tr>';
    });
    h += '</tbody></table></div>';
  });
  return h;
}

/* ---------------- COSTING ---------------- */
var costTab = "line";
var dFrom = "", dTo = "";

function entryDay(e){
  if(e.date && e.date.length>=10) return e.date.slice(0,10);
  return new Date(e.created||0).toISOString().slice(0,10);
}
function inRange(e){
  var d = entryDay(e);
  if(dFrom && d < dFrom) return false;
  if(dTo   && d > dTo)   return false;
  return true;
}
function rangeLabel(){
  if(!dFrom && !dTo) return "All time";
  if(dFrom && dTo)   return dFrom + "  to  " + dTo;
  if(dFrom)          return "From " + dFrom;
  return "Up to " + dTo;
}
function ymd(dt){ return dt.toISOString().slice(0,10); }
function setPreset(k){
  var now = new Date();
  var y = now.getUTCFullYear(), m = now.getUTCMonth();
  if(k==="all"){ dFrom=""; dTo=""; }
  if(k==="month"){ dFrom = ymd(new Date(Date.UTC(y,m,1))); dTo = ymd(new Date(Date.UTC(y,m+1,0))); }
  if(k==="last"){  dFrom = ymd(new Date(Date.UTC(y,m-1,1))); dTo = ymd(new Date(Date.UTC(y,m,0))); }
  if(k==="quarter"){ var q=Math.floor(m/3)*3; dFrom = ymd(new Date(Date.UTC(y,q,1))); dTo = ymd(new Date(Date.UTC(y,q+3,0))); }
  if(k==="year"){ dFrom = ymd(new Date(Date.UTC(y,0,1))); dTo = ymd(new Date(Date.UTC(y,11,31))); }
  render();
}
function dateBarHTML(){
  var h = '<div class="card" style="padding:12px">';
  h += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">';
  [["all","All time"],["month","This month"],["last","Last month"],["quarter","This quarter"],["year","This year"]]
    .forEach(function(p){
      h += '<button class="btn sec sm" data-preset="'+p[0]+'" style="flex:0 0 auto">'+p[1]+'</button>';
    });
  h += '</div>';
  h += '<div class="row c3" style="margin-bottom:0">';
  h += '<div><label for="d_from">From</label><input id="d_from" type="date" value="'+esc(dFrom)+'"></div>';
  h += '<div><label for="d_to">To</label><input id="d_to" type="date" value="'+esc(dTo)+'"></div>';
  h += '<div><label>Showing</label><input readonly value="'+esc(rangeLabel())+'"></div>';
  h += '</div></div>';
  return h;
}
function costingHTML(){
  var h = '<div class="seg">'
    + ['so','line','dc','inv','head'].map(function(t){
        var lbl = t==="so"?"By SO":(t==="line"?"By line":(t==="dc"?"By DC":(t==="inv"?"By invoice":"By cost head")));
        return '<button data-ctab="'+t+'" class="'+(costTab===t?"on":"")+'">'+lbl+'</button>';
      }).join("")
    + '</div>';

  h += dateBarHTML();


  if(costTab==="so"){
    var byso = {};
    pendingLines().forEach(function(r){
      if(!byso[r.poNo]) byso[r.poNo] = {so:r.poNo, cust:r.customer, ordered:0, shipped:0,
                                        gross:0, ded:0, cost:0};
      var g = byso[r.poNo];
      var allCost = entries.reduce(function(a,e){
        return a + ((e.type==="WO"&&e.poNo===r.poNo&&e.description===r.desc)?lineTotalCost(e):0); },0);
      var perPc = r.made>0 ? allCost/r.made : 0;
      var sq=0, sd=0;
      entries.forEach(function(e){
        if(e.type==="DC" && e.poNo===r.poNo && e.description===r.desc && inRange(e)){
          sq += num(e.qty); sd += num(e.deduction);
        }
      });
      g.ordered += r.ordered; g.shipped += sq;
      g.gross   += sq*r.rate; g.ded += sd;
      g.cost    += sq*perPc;
    });
    var solist = Object.keys(byso).map(function(k){ return byso[k]; })
                  .filter(function(g){ return g.shipped>0; });
    if(!solist.length) return h + '<div class="empty">Nothing dispatched in this period.</div>';
    var TN=0, TC=0;
    solist.forEach(function(g){ g.net = g.gross-g.ded; g.profit = g.net-g.cost; TN+=g.net; TC+=g.cost; });
    h += '<div class="totals"><span class="muted">Net sales '+rs(TN)+' &minus; cost '+rs(TC)+'</span>'
      +  '<span class="big '+((TN-TC)>=0?"pos":"neg")+'">'+rs(TN-TC)+'</span></div>';
    h += '<div class="tbl-scroll"><table><thead><tr><th>SO</th><th>Customer</th>'
      +  '<th class="num">Ordered</th><th class="num">Shipped</th><th class="num">Net sales</th>'
      +  '<th class="num">Cost</th><th class="num">Profit</th><th class="num">Margin</th></tr></thead><tbody>';
    solist.sort(function(a,b){ return b.profit-a.profit; }).forEach(function(g){
      var m = g.net>0 ? g.profit/g.net*100 : 0;
      h += '<tr><td>'+esc(g.so)+'</td><td class="wrapcell">'+esc(g.cust)+'</td>'
        + '<td class="num">'+fmt(g.ordered)+'</td><td class="num">'+fmt(g.shipped)+'</td>'
        + '<td class="num">'+rs(g.net)+'</td><td class="num">'+rs(g.cost)+'</td>'
        + '<td class="num '+(g.profit>=0?"pos":"neg")+'" style="font-weight:700">'+rs(g.profit)+'</td>'
        + '<td class="num '+(m>=0?"pos":"neg")+'">'+fmt(m,1)+'%</td></tr>';
    });
    h += '</tbody></table></div>';
    return h;
  }

  if(costTab==="inv"){
    var invs = invDocs().filter(function(r){ return inRange({date:r.day+"T00:00:00Z", created:0}); });
    if(!invs.length) return h + '<div class="empty">No invoices in this period.</div>';
    var IN=0, IC=0, IG=0;
    invs.forEach(function(r){
      r.cost = 0;
      r.dcList.forEach(function(dcNo){
        entries.forEach(function(e){
          if(e.type==="DC" && e.docNo===dcNo){
            r.cost += dcCostOf(e);
          }
        });
      });
      r.profit = r.net - r.cost;
      IN += r.net; IC += r.cost; IG += r.gst;
    });
    h += '<div class="stats">'
      +  '<div class="stat b-blue"><div class="k">Net sales</div><div class="v">'+rs(IN)+'</div></div>'
      +  '<div class="stat"><div class="k">GST charged</div><div class="v muted">'+rs(IG)+'</div></div>'
      +  '<div class="stat b-red"><div class="k">Cost of sales</div><div class="v">'+rs(IC)+'</div></div>'
      +  '<div class="stat hi"><div class="k">Gross profit</div><div class="v '+((IN-IC)>=0?"pos":"neg")+'">'+rs(IN-IC)+'</div></div></div>';
    h += '<div class="tbl-scroll"><table><thead><tr><th>Invoice</th><th>Customer</th><th>Date</th>'
      +  '<th>DCs</th><th class="num">Net</th><th class="num">GST</th><th class="num">Gross</th>'
      +  '<th class="num">Cost</th><th class="num">Profit</th><th class="num">Margin</th></tr></thead><tbody>';
    invs.forEach(function(r){
      var m = r.net>0 ? r.profit/r.net*100 : 0;
      h += '<tr><td>'+esc(r.docNo)+'</td><td class="wrapcell">'+esc(r.customer)+'</td>'
        + '<td class="muted">'+esc(r.day)+'</td>'
        + '<td class="muted" style="font-size:12px">'+esc(r.dcList.join(", "))+'</td>'
        + '<td class="num">'+rs(r.net)+'</td><td class="num muted">'+rs(r.gst)+'</td>'
        + '<td class="num">'+rs(r.gross)+'</td><td class="num">'+rs(r.cost)+'</td>'
        + '<td class="num '+(r.profit>=0?"pos":"neg")+'" style="font-weight:700">'+rs(r.profit)+'</td>'
        + '<td class="num '+(m>=0?"pos":"neg")+'">'+fmt(m,1)+'%</td></tr>';
    });
    h += '</tbody></table></div>';
    return h;
  }

  if(costTab==="line"){
    var rows = pendingLines().filter(function(r){ return r.made>0 || r.shipped>0; });
    if(!rows.length) return h + '<div class="empty">No work orders posted yet.</div>';
    var Tcost=0, Tship=0, Tshipcost=0, Tstock=0, Tded=0;
    rows.forEach(function(r){
      /* unit cost uses the whole line's history, so a part-period dispatch is costed correctly */
      var allCost = entries.reduce(function(a,e){
        return a + ((e.type==="WO"&&e.poNo===r.poNo&&e.description===r.desc)?lineTotalCost(e):0); },0);
      r.perPc = r.made>0 ? allCost/r.made : 0;

      /* production spend booked inside the period */
      r.cost = entries.reduce(function(a,e){
        return a + ((e.type==="WO"&&e.poNo===r.poNo&&e.description===r.desc&&inRange(e))?lineTotalCost(e):0); },0);

      /* dispatches inside the period drive revenue and realised profit */
      r.shipQty = 0; r.deduct = 0;
      entries.forEach(function(e){
        if(e.type==="DC" && e.poNo===r.poNo && e.description===r.desc && inRange(e)){
          r.shipQty += num(e.qty); r.deduct += num(e.deduction);
        }
      });
      r.gross     = r.shipQty * r.rate;
      r.shipValue = r.gross - r.deduct;
      r.shipCost  = r.shipQty * r.perPc;
      r.profit    = r.shipValue - r.shipCost;
      r.stock     = Math.max(0, r.made - r.shipped) * r.perPc;
      Tcost += r.cost; Tship += r.shipValue; Tshipcost += r.shipCost;
      Tstock += r.stock; Tded += r.deduct;
    });
    rows = rows.filter(function(r){ return r.cost>0 || r.shipQty>0 || (!dFrom && !dTo); });
    if(!rows.length) return h + '<div class="empty">Nothing in this period.</div>';
    var TP = Tship - Tshipcost;
    h += '<div class="stats"><div class="stat b-red"><div class="k">Cost incurred</div><div class="v">'+rs(Tcost)+'</div></div>'
      +  '<div class="stat b-blue"><div class="k">Net shipped</div><div class="v">'+rs(Tship)+'</div></div>'
      +  '<div class="stat b-red"><div class="k">Deductions</div><div class="v" style="color:var(--bad)">'+rs(Tded)+'</div></div>'
      +  '<div class="stat b-amber"><div class="k">Stock at cost</div><div class="v" style="color:var(--c-wo)">'+rs(Tstock)+'</div></div>'
      +  '<div class="stat hi"><div class="k">Realised profit</div><div class="v '+(TP>=0?"pos":"neg")+'">'+rs(TP)+'</div></div></div>';
    h += '<div class="tbl-scroll"><table><thead><tr><th>SO</th><th>Line</th>'
      +  '<th class="num">Made</th><th class="num">Shipped</th>'
      +  '<th class="num">Production cost</th><th class="num">Gross shipped</th>'
      +  '<th class="num">Deductions</th><th class="num">Net shipped</th>'
      +  '<th class="num">Cost of shipped</th><th class="num">Realised profit</th>'
      +  '<th class="num">Stock at cost</th></tr></thead><tbody>';
    rows.forEach(function(r){
      var cc = (r.cat||"");
      h += '<tr><td>'+esc(r.poNo)+'</td><td class="wrapcell">'+esc(r.desc)
        + '<div style="margin-top:4px"><span class="chip '+esc(cc)+'">'+esc(r.cat||"")+'</span></div></td>'
        + '<td class="num">'+fmt(r.made)+'</td>'
        + '<td class="num" style="color:var(--c-dc);font-weight:600">'+fmt(r.shipQty)+'</td>'
        + '<td class="num">'+rs(r.cost)+'</td>'
        + '<td class="num">'+rs(r.gross)+'</td>'
        + '<td class="num" style="color:'+(r.deduct>0?"var(--bad)":"var(--muted)")+'">'
        + (r.deduct>0?"-"+rs(r.deduct):"&mdash;")+'</td>'
        + '<td class="num">'+rs(r.shipValue)+'</td>'
        + '<td class="num">'+rs(r.shipCost)+'</td>'
        + '<td class="num '+(r.profit>0?"pos":(r.profit<0?"neg":"muted"))+'" style="font-weight:700">'+rs(r.profit)+'</td>'
        + '<td class="num muted">'+rs(r.stock)+'</td></tr>';
    });
    h += '</tbody></table></div>';
    h += '<div class="banner info">Profit is realised only on dispatch. A line that is made but not yet shipped '
      +  'carries its cost under <strong>Stock at cost</strong> and shows nil profit until the DC is posted.</div>';
    return h;
  }

  if(costTab==="dc"){
    var dcs = entries.filter(function(e){ return e.type==="DC" && inRange(e); });
    if(!dcs.length) return h + '<div class="empty">No dispatches in this period.</div>';
    var g={};
    dcs.forEach(function(e){
      var k = e.docNo || "(no number)";
      if(!g[k]) g[k] = {doc:k, po:e.poNo, cust:e.customer, day:entryDay(e), qty:0, rev:0, cost:0, ded:0};
      var q = num(e.qty);
      g[k].qty += q;
      g[k].rev += q * num(e.rate);
      g[k].ded += num(e.deduction);
      g[k].cost += dcCostOf(e);
    });
    var list = Object.keys(g).map(function(k){ return g[k]; });
    var TV=0,TC=0,TD=0; list.forEach(function(r){ TV+=r.rev; TC+=r.cost; TD+=r.ded; });
    TV -= TD;
    h += '<div class="totals"><span class="muted">Net revenue '+rs(TV)+(TD>0?' (after '+rs(TD)+' deductions)':'')+' &minus; cost '+rs(TC)+'</span>'
      +  '<span class="big '+((TV-TC)>=0?"pos":"neg")+'">'+rs(TV-TC)+'</span></div>';
    h += '<div class="tbl-scroll"><table><thead><tr><th>DC</th><th>Date</th><th>SO</th><th>Customer</th>'
      +  '<th class="num">Qty</th><th class="num">Gross</th><th class="num">Deductions</th>'
      +  '<th class="num">Net</th><th class="num">Cost</th><th class="num">Profit</th>'
      +  '</tr></thead><tbody>';
    list.forEach(function(r){
      var net = r.rev - r.ded;
      var p = net - r.cost;
      h += '<tr><td>'+esc(r.doc)+'</td><td class="muted">'+esc(r.day)+'</td><td>'+esc(r.po)+'</td><td class="wrapcell">'+esc(r.cust)+'</td>'
        + '<td class="num">'+fmt(r.qty)+'</td><td class="num">'+rs(r.rev)+'</td>'
        + '<td class="num" style="color:'+(r.ded>0?"var(--bad)":"var(--muted)")+'">'
        + (r.ded>0?"-"+rs(r.ded):"&mdash;")+'</td>'
        + '<td class="num">'+rs(net)+'</td><td class="num">'+rs(r.cost)+'</td>'
        + '<td class="num '+(p>=0?"pos":"neg")+'" style="font-weight:700">'+rs(p)+'</td></tr>';
    });
    h += '</tbody></table></div>';
    return h;
  }

  /* by cost head — grouped by category, with per-unit rates */
  var HEAD_COLOR = {material:"var(--cat-print)", dyeing:"var(--cat-thread)",
                    labour:"var(--cat-tapes)", printing:"var(--cat-scrub)", overhead:"var(--c-wo)"};
  var byCat = {}, grand = 0;
  entries.forEach(function(e){
    if(e.type!=="WO" || !inRange(e)) return;
    var c = e.category || "Other";
    if(!byCat[c]){ byCat[c] = {cat:c, cq:0, qty:0, heads:{}, total:0};
      ALL_COSTS.forEach(function(k){ byCat[c].heads[k]=0; }); }
    byCat[c].cq  += num(e.costingQty);
    byCat[c].qty += num(e.qty);
    ALL_COSTS.forEach(function(k){
      var v = num(e[k]); byCat[c].heads[k] += v; byCat[c].total += v; grand += v;
    });
  });
  var cats = Object.keys(byCat).filter(function(c){ return byCat[c].total > 0; });
  if(!cats.length) return h + '<div class="empty">No costs posted in this period.</div>';

  h += '<div class="totals"><span class="muted">Total cost posted</span><span class="big">'+rs(grand)+'</span></div>';

  cats.forEach(function(c){
    var g = byCat[c];
    var unit = costUnit(c);
    var cc = c;
    h += '<div class="sec-title" style="display:flex;align-items:center;gap:10px">'
      +  '<span class="chip '+esc(cc)+'">'+esc(c)+'</span>'
      +  '<span>'+fmt(g.cq,1)+' '+unit.toLowerCase()+' &middot; '+fmt(g.qty)+' PC</span></div>';

    if(g.cq === 0){
      h += '<div class="banner warn">No '+unit.toLowerCase()+' recorded on these work orders, so a per-'
        +  unit.toLowerCase().replace(/s$/,"")+' rate cannot be worked out. Edit the work orders and add the quantity consumed.</div>';
    }

    h += '<div class="tbl-scroll"><table><thead><tr><th>Cost head</th><th>Share</th>'
      +  '<th class="num">Amount</th><th class="num">Per '+unit.toLowerCase().replace(/s$/,"")+'</th>'
      +  '<th class="num">Per PC</th><th class="num">%</th></tr></thead><tbody>';
    ALL_COSTS.forEach(function(k){
      if(!g.heads[k]) return;
      var pc = g.heads[k]/g.total*100;
      h += '<tr><td><span style="display:inline-block;width:10px;height:10px;border-radius:3px;'
        + 'background:'+HEAD_COLOR[k]+';margin-right:8px"></span>'+COST_LABEL[k]+'</td>'
        + '<td><div class="bar"><i style="width:'+pc.toFixed(1)+'%;background:'+HEAD_COLOR[k]+'"></i></div></td>'
        + '<td class="num">'+rs(g.heads[k])+'</td>'
        + '<td class="num" style="font-weight:600">'+(g.cq>0?fmt(g.heads[k]/g.cq,2):"&mdash;")+'</td>'
        + '<td class="num muted">'+(g.qty>0?fmt(g.heads[k]/g.qty,2):"&mdash;")+'</td>'
        + '<td class="num">'+fmt(pc,1)+'%</td></tr>';
    });
    h += '<tr style="background:var(--panel)"><td style="font-weight:700">Total</td><td></td>'
      + '<td class="num" style="font-weight:700">'+rs(g.total)+'</td>'
      + '<td class="num" style="font-weight:700;color:var(--accent)">'+(g.cq>0?fmt(g.total/g.cq,2):"&mdash;")+'</td>'
      + '<td class="num" style="font-weight:700;color:var(--accent)">'+(g.qty>0?fmt(g.total/g.qty,2):"&mdash;")+'</td>'
      + '<td class="num">100%</td></tr>';
    h += '</tbody></table></div>';
  });
  return h;
}

/* ---------------- EDIT MODAL ---------------- */
function openEdit(id){
  var e = entries.filter(function(x){ return x.id===id; })[0];
  if(!e) return;
  editing = id;
  var cat = e.category || "";
  var fields = COST_FIELDS[cat] || [];
  var h = '<div class="modal" id="mOverlay"><div class="sheet">';
  h += '<h2>Edit '+e.type+' entry</h2>';
  h += '<p class="muted" style="font-size:13px;margin:4px 0 16px 0">'+esc(e.poNo)+' &middot; '+esc(e.description)+'</p>';

  h += '<div class="row c2">';
  h += '<div><label for="e_po">SO number</label><input id="e_po" value="'+esc(e.poNo||"")+'"></div>';
  h += '<div><label for="e_doc">Document number</label><input id="e_doc" value="'+esc(e.docNo||"")+'"'+(e.type==="PO"?" readonly":"")+'></div>';
  h += '</div>';
  h += '<div class="row"><div><label for="e_desc">Description</label><input id="e_desc" value="'+esc(e.description||"")+'"></div></div>';
  h += '<div class="row c2">';
  h += '<div><label for="e_cust">Customer</label><input id="e_cust" value="'+esc(e.customer||"")+'"></div>';
  h += '<div><label for="e_qty">Quantity (PC)</label><input id="e_qty" inputmode="decimal" value="'+esc(e.qty||"")+'"></div>';
  h += '</div>';
  h += '<div class="row c2">';
  h += '<div'+(isOwner?'':' style="display:none"')+'><label for="e_rate">Rate per PC</label>'
    +  '<input id="e_rate" inputmode="decimal" value="'+esc(e.rate||"")+'"></div>';
  if(e.type==="WO") h += '<div><label for="e_cqty">Consumed ('+costUnit(cat)+')</label><input id="e_cqty" inputmode="decimal" value="'+esc(e.costingQty||"")+'"></div>';
  h += '</div>';

  if(e.type==="DC" && isOwner){
    var gross = num(e.qty)*num(e.rate);
    h += '<div class="sec-title">Customer deduction</div>';
    h += '<div class="row c2">';
    h += '<div><label for="e_ded">Deduction (Rs)</label><input id="e_ded" inputmode="decimal" value="'+esc(e.deduction||"")+'" placeholder="0"></div>';
    h += '<div><label>Net value after deduction</label><input readonly id="e_net" value="'+rs(gross-num(e.deduction))+'"></div>';
    h += '</div>';
    h += '<div class="banner info">Gross value of this line is '+rs(gross)+'. Enter any claim, rebate or short payment the customer has raised &mdash; profit is recalculated on the net figure.</div>';
  }

  if(e.type==="WO" && fields.length){
    h += '<div class="sec-title">Costs</div><div class="row c2">';
    fields.forEach(function(f){
      h += '<div><label for="e_'+f+'">'+COST_LABEL[f]+'</label>'
        +  '<input id="e_'+f+'" inputmode="decimal" value="'+esc(e[f]||"")+'"></div>';
    });
    h += '</div>';
  }

  if(e.type==="PO"){
    h += '<div class="banner info">Changing the SO number here also updates every work order and dispatch attached to it.</div>';
  }

  h += '<div style="display:flex;gap:10px;margin-top:18px">';
  h += '<button class="btn danger" id="delBtn" style="flex:0 0 110px">Delete</button>';
  h += '<button class="btn sec" id="cancelBtn" style="flex:1">Cancel</button>';
  h += '<button class="btn" id="saveBtn" style="flex:1">Save</button>';
  h += '</div></div></div>';

  $("modalHost").innerHTML = h;

  $("cancelBtn").onclick = closeEdit;
  $("mOverlay").addEventListener("click", function(ev){ if(ev.target.id==="mOverlay") closeEdit(); });

  if(e.type==="DC" && $("e_ded")){
    var ded = $("e_ded"), net = $("e_net");
    var recalc = function(){
      var g = num(($("e_qty")||{}).value) * num(($("e_rate")||{}).value);
      if(net) net.value = rs(g - num(ded.value));
    };
    if(ded) ded.oninput = recalc;
    ["e_qty","e_rate"].forEach(function(k){ var el=$(k); if(el) el.oninput = recalc; });
  }

  var delArmed = false;
  $("delBtn").onclick = function(){
    var b = $("delBtn");
    if(!delArmed){
      delArmed = true;
      b.textContent = "Tap again";
      b.style.flex = "0 0 140px";
      setTimeout(function(){
        if(delArmed && $("delBtn")){ delArmed=false; $("delBtn").textContent="Delete"; $("delBtn").style.flex="0 0 110px"; }
      }, 4000);
      return;
    }
    b.disabled = true; b.textContent = "Deleting…";
    deleteRow(id).then(function(){
      closeEdit(); toast("Entry deleted");
    }).catch(function(){
      b.disabled=false; b.textContent="Delete"; delArmed=false; toast("Could not delete");
    });
  };

  $("saveBtn").onclick = function(){
    var oldPO = e.poNo, newPO = $("e_po").value.trim();
    var patch = {
      poNo: newPO,
      docNo: $("e_doc").value.trim(),
      description: $("e_desc").value.trim(),
      customer: $("e_cust").value.trim(),
      qty: num($("e_qty").value),
      rate: $("e_rate") ? num($("e_rate").value) : num(e.rate),
      editedAt: Date.now()
    };
    if(e.type==="WO"){
      patch.costingQty = num($("e_cqty").value);
      fields.forEach(function(f){ patch[f] = num($("e_"+f).value); });
    }
    if(e.type==="DC" && isOwner && $("e_ded")){ patch.deduction = num($("e_ded").value); }
    var jobs = [ updateRow(id, patch) ];

    /* cascade PO number change from a PO row to its children */
    if(e.type==="PO" && newPO && newPO !== oldPO){
      entries.forEach(function(x){
        if(x.id!==id && x.poNo===oldPO){ jobs.push(updateRow(x.id, {poNo:newPO})); }
      });
    }
    Promise.all(jobs).then(function(){
      closeEdit();
      toast(e.type==="PO" && newPO!==oldPO ? "Updated, linked rows too" : "Entry updated");
    }).catch(function(){ toast("Could not save"); });
  };
}
function closeEdit(){ editing=null; $("modalHost").innerHTML=""; }

/* ---------------- add line / post ---------------- */
function readCostInputs(cat){
  var o = {};
  ALL_COSTS.forEach(function(f){
    var el = $("c_"+f);
    o[f] = el ? num(el.value) : 0;
  });
  return o;
}

function addLine(){
  if(entryType==="PO"){
    var pdoc = $("f_doc").value.trim();
    var si = $("f_sup"), ss = $("f_supsel");
    var sup = si ? si.value.trim() : (ss ? ss.value : "");
    if(sup === "__new__") sup = "";
    var mat = $("f_desc").value.trim();
    var mq  = num($("f_qty").value), mr = num($("f_rate").value);
    if(!pdoc){ toast("Enter a PO number"); return; }
    if(docExists("PO", pdoc)){ toast("PO "+pdoc+" is already in the system"); return; }
    if(!sup){ toast("Enter or pick a supplier"); return; }
    if(!mat){ toast("Enter the material"); return; }
    if(mq<=0){ toast("Enter a quantity"); return; }
    if(mr<=0){ toast("Enter a rate"); return; }
    draft.docNo=pdoc; draft.customer=sup; draft.category=$("f_cat").value;
    draft.forSo = ($("f_forso")||{}).value || "";
    lines.push({description:mat, qty:mq, rate:mr});
    draft.preDesc = ""; draft.preQty = ""; draft.preRate = "";
    render();
    var dd=$("f_desc"); if(dd){ dd.value=""; dd.focus(); }
    return;
  }

  if(entryType==="SO"){
    var po = $("f_po").value.trim();
    var ci = $("f_cust"), cs = $("f_custsel");
    var cust = ci ? ci.value.trim() : (cs ? cs.value : "");
    if(cust === "__new__") cust = "";
    var desc = $("f_desc").value.trim(), q = num($("f_qty").value), r = num($("f_rate").value);
    if(!po){ toast("Enter an SO number"); return; }
    if(docExists("SO", po)){ toast("SO "+po+" is already in the system"); return; }
    if(!cust){ toast("Enter or pick a customer"); return; }
    if(!desc){ toast("Enter a description"); return; }
    if(q<=0){ toast("Enter a quantity"); return; }
    draft.poNo=po; draft.customer=cust; draft.category=$("f_cat").value;
    lines.push({description:desc, qty:q, rate:r});
    render();
    var d=$("f_desc"); if(d){ d.value=""; d.focus(); }
    return;
  }

  var po2 = draft.poNo, desc2 = draft.description;
  var stockMode = po2==="__stock__";
  if(stockMode && entryType==="WO"){ desc2 = String(($("f_item")||{}).value||"").trim(); draft.description = desc2; }
  if(!po2 || !desc2){ toast(stockMode ? (entryType==="WO"?"Enter the item made":"Pick an item") : "Pick an SO and a line"); return; }
  var q2 = num($("f_qty").value);
  if(q2<=0){ toast("Enter a quantity"); return; }

  var info = stockMode ? null : lineInfo(po2, desc2);
  var rate = stockMode ? (entryType==="DC" ? num(($("f_rate")||{}).value) : 0) : num(info.rate);

  if(entryType==="WO"){
    var ordered = stockMode ? Infinity : sumQty("SO",po2,desc2), made = stockMode ? 0 : sumQty("WO",po2,desc2);
    var inList = lines.reduce(function(a,L){ return a+(L.description===desc2?num(L.qty):0); },0);
    var mName = ($("m_name")||{}).value || "";
    var mQty  = num(($("m_qty")||{}).value);
    var mats2 = (draft.mats||[]).slice();
    if(mName && mQty>0) mats2.push({name:mName, qty:mQty});
    if(materials().length && !mats2.length){ toast("Pick the material and quantity issued"); return; }
    if(q2 > ordered - made - inList){ toast("Above the ordered quantity — added anyway"); }
    var L = {description:desc2, qty:q2, rate:rate, costingQty:num($("f_cqty").value),
             matName:(mats2[0]||{}).name||"", matQty:(mats2[0]||{}).qty||0, mats:mats2};
    var c = readCostInputs(draft.category);
    ALL_COSTS.forEach(function(k){ L[k]=c[k]; });
    L.material = mats2.reduce(function(a,m){ return a + m.qty*invAvg(m.name); }, 0);
    lines.push(L);
    draft.mats = []; draft.matName = "";
  } else {
    var avail2 = availableForDC(stockMode ? "" : po2, desc2);
    var inList2 = lines.reduce(function(a,L2){ return a+(L2.description===desc2?num(L2.qty):0); },0);
    if(stockMode && !String(draft.customer||"").trim()){ toast("Pick the customer"); return; }
    if(stockMode && rate<=0){ toast("Enter the rate"); return; }
    if(avail2 <= 0){ toast("No stock — nothing manufactured and none purchased for this line"); return; }
    if(q2 > avail2 - inList2){ toast("Only "+fmt(avail2-inList2)+" available"); return; }
    draft.docNo = $("f_doc").value.trim();
    lines.push({description:desc2, qty:q2, rate:rate, deduction:0, category: stockMode ? itemCat(desc2) : "",
      spec:String(($("f_spec")||{}).value||"").trim(), kg:num(($("f_kg")||{}).value)});
  }
  draft.description = "";
  render();
}

function postEntry(){
  if(!lines.length) return;
  if(entryType==="DC" && !draft.docNo){ toast("Enter the DC number"); return; }

  if(entryType==="INV"){
    if(!draft.docNo){ toast("Enter the invoice number"); return; }
    if(docExists("INV", draft.docNo)){ toast("Invoice "+draft.docNo+" is already in the system"); return; }
    var iv = draft.iv || {};
    var nowI = Date.now();
    var rowsI = [];
    var ivDay = iv.date || todayDay();
    var ivDueDay = ivDue(iv);
    var ivGross = lines.reduce(function(a,L){ return a+num(L.net); },0) * (1+GST_RATE);
    var ivRec = iv.cash ? ivGross : (iv.recOn ? Math.min(num(iv.rec), ivGross) : 0);
    if(iv.recOn && num(iv.rec) > ivGross + 0.5){ toast("Received is more than the invoice"); return; }
    lines.forEach(function(L){
      (L.lines||[]).forEach(function(src){
        rowsI.push({
          type:"INV", created:nowI, date:ivDay+"T00:00:00.000Z", dueDate:ivDueDay, note:iv.note||"",
          custPo:String(iv.po||"").trim(), custPoDate:iv.poDate||"",
          customer: draft.customer,
          poNo: src.poNo, docNo: draft.docNo, dcRef: L.dcRef,
          description: src.description, category: src.category, spec: src.spec||"", kgQty: num(src.kgQty),
          qty: num(src.qty), rate: num(src.rate), deduction: num(src.deduction),
          poStatus:"", costingQty:0, matName:"", matQty:0, forSo:"", payKind:"",
          material:0, dyeing:0, labour:0, printing:0, overhead:0
        });
      });
    });
    if(ivRec > 0.5){
      rowsI.push({ type:"PAY", created:nowI, date:new Date(nowI).toISOString(), txnDate:ivDay,
        payKind:"AR", customer:draft.customer, docNo:draft.docNo, qty:Math.round(ivRec*100)/100, wht:0, rate:0,
        account:iv.acc||DEFAULT_ACCOUNT, toAccount:"", chqNo:"", chqDate:"", description:"Received with invoice "+draft.docNo,
        poNo:"", category:"", poStatus:"", costingQty:0, deduction:0, matName:"", matQty:0, forSo:"",
        material:0, dyeing:0, labour:0, printing:0, overhead:0 });
    }
    var btnI = $("postBtn"); if(btnI){ btnI.disabled = true; btnI.textContent = "Posting…"; }
    saveRows(rowsI).then(function(){
      lines = []; draft = {}; toast("Invoice posted"); render();
    }).catch(function(){ toast("Could not post — try again"); if(btnI) btnI.disabled=false; });
    return;
  }

  var now = Date.now();
  var docNo = entryType==="WO" ? nextDocNo()
            : ((entryType==="DC" || entryType==="PO") ? draft.docNo : "");
  var realPo = draft.poNo==="__stock__" ? "" : draft.poNo;
  if(entryType==="DC" && draft.invNo && docExists("INV", draft.invNo)){ toast("Invoice "+draft.invNo+" is already in the system"); return; }
  var rows = lines.map(function(L){
    var r = {
      type: entryType,
      created: now,
      date: new Date(now).toISOString(),
      customer: draft.customer || (soInfo(draft.poNo)||{}).customer || "",
      poNo: entryType==="PO" ? "" : realPo,
      docNo: docNo,
      description: L.description,
      category: L.category || draft.category || (soInfo(draft.poNo)||{}).category || "",
      qty: num(L.qty),
      rate: num(L.rate),
      poStatus: entryType==="SO" ? "Actual" : "",
      costingQty: num(L.costingQty),
      deduction: num(L.deduction),
      spec: L.spec || "", kgQty: num(L.kg),
      matName: L.matName || "",
      matQty: num(L.matQty),
      mats: L.mats || [],
      forSo: entryType==="PO" ? (draft.forSo || "") : "",
      material:0, dyeing:0, labour:0, printing:0, overhead:0
    };
    ALL_COSTS.forEach(function(k){ if(L[k]!==undefined) r[k] = num(L[k]); });
    return r;
  });

  if(entryType==="PO" && draft.bp && draft.bp.acc){
    var bGross = rows.reduce(function(a,r){ return a + r.qty*r.rate; },0) * (1+GST_RATE);
    var bPaid = Math.min(bGross, num(draft.bp.amt!==undefined && draft.bp.amt!=="" ? draft.bp.amt : bGross));
    if(bPaid > 0.5) rows.push({ type:"PAY", created:now, date:new Date(now).toISOString(), txnDate:todayDay(),
      payKind:"AP", customer:draft.customer, docNo:docNo, qty:Math.round(bPaid*100)/100, wht:0, rate:0,
      account:draft.bp.acc, toAccount:"", chqNo:"", chqDate:"", description:"Paid with bill "+docNo,
      poNo:"", category:"", poStatus:"", costingQty:0, deduction:0, matName:"", matQty:0, forSo:"",
      material:0, dyeing:0, labour:0, printing:0, overhead:0 });
  }
  var invNo = entryType==="DC" ? String(draft.invNo||"").trim() : "";
  if(invNo){
    rows = rows.concat(rows.map(function(r){
      return { type:"INV", created:now, date:r.date, customer:r.customer, poNo:r.poNo, docNo:invNo, dcRef:r.docNo,
        description:r.description, category:r.category, qty:r.qty, rate:r.rate, deduction:0, spec:r.spec||"", kgQty:num(r.kgQty),
        poStatus:"", costingQty:0, matName:"", matQty:0, forSo:"", payKind:"",
        material:0, dyeing:0, labour:0, printing:0, overhead:0 };
    }));
  }
  var btn = $("postBtn"); if(btn){ btn.disabled = true; btn.textContent = "Posting…"; }
  saveRows(rows).then(function(){
    lines = []; draft = {}; 
    toast((entryType==="PO"?"Purchase bill":entryType)+" posted"+(invNo?" and invoiced":""));
    render();
  }).catch(function(){
    toast("Could not post — try again");
    if(btn){ btn.disabled=false; }
  });
}

/* ---------------- live profit on WO form ---------------- */
function updateMatCost(){
  var out = $("m_cost"); if(!out) return;
  var name = ($("m_name")||{}).value || "";
  var q = num(($("m_qty")||{}).value);
  var cost = q * invAvg(name);
  out.value = (name && q>0) ? ("Rs " + fmt(cost,0)) : "—";
  var hint = $("matHint");
  if(hint){
    var stk = invQty(name) - (draft.mats||[]).reduce(function(a,m){ return a + (m.name===name ? m.qty : 0); }, 0)
      - lines.reduce(function(a,L){ return a + (L.mats||[]).reduce(function(b,m){ return b + (m.name===name ? m.qty : 0); }, 0); }, 0);
    if(name && q > stk){ hint.textContent = "Only "+fmt(stk,1)+" KG in stock"; hint.className="hint warn"; }
    else hint.textContent = "";
  }
}

function updateLiveProfit(){
  var el = $("liveProfit"); if(!el) return;
  var q = num(($("f_qty")||{}).value);
  var rate = draft.description ? num((lineInfo(draft.poNo,draft.description)||{}).rate) : 0;
  var cost = 0;
  ALL_COSTS.forEach(function(f){
    var i = $("c_"+f); if(i) cost += num(i.value);
  });
  cost += num(($("m_qty")||{}).value) * invAvg(($("m_name")||{}).value || "");
  (draft.mats||[]).forEach(function(m){ cost += m.qty * invAvg(m.name); });
  if(q<=0 && cost===0){ el.textContent="—"; el.className="big"; return; }
  var p = q*rate - cost;
  el.textContent = rs(p);
  el.className = "big " + (p>=0?"pos":"neg");
}
function updateQtyHint(){
  var el = $("qtyHint"); if(!el || !draft.description) return;
  var q = num(($("f_qty")||{}).value);
  var bal;
  if(draft.poNo==="__stock__"){
    if(entryType==="WO") return;
    bal = availableForDC("", draft.description)
        - lines.reduce(function(a,L){ return a+(L.description===draft.description?num(L.qty):0); },0);
  } else if(entryType==="WO"){
    bal = sumQty("SO",draft.poNo,draft.description) - sumQty("WO",draft.poNo,draft.description)
        - lines.reduce(function(a,L){ return a+(L.description===draft.description?num(L.qty):0); },0);
  } else {
    bal = availableForDC(draft.poNo, draft.description)
        - lines.reduce(function(a,L){ return a+(L.description===draft.description?num(L.qty):0); },0);
  }
  if(q > bal){
    el.textContent = (entryType==="WO")
      ? "Above the ordered quantity by "+fmt(q-bal)+" — allowed"
      : "Only "+fmt(bal)+" available";
    el.className = "hint warn";
  } else el.textContent = "";
}

/* ---------- parties ---------- */
function partyRows(){ return cfgRows().filter(function(e){ return e.payKind==="PARTY"; }); }
function partyRec(name){ return partyRows().filter(function(e){ return e.customer===name; })[0] || null; }

function partyList(){
  var map = {};
  function P(n){ if(!n) return null;
    if(!map[n]) map[n] = {name:n, get:0, give:0, last:"", kinds:{}};
    return map[n]; }
  function touch(p, d){ if(p && d > p.last) p.last = d; }
  partyRows().forEach(function(e){
    var p = P(e.customer), v = num(e.qty);
    if(v > 0) p.get += v; else p.give += -v;
    p.kinds[e.category||"Customer"] = 1; touch(p, entryDay(e));
  });
  soRows().forEach(function(e){ var p = P(e.customer); if(p){ p.kinds.Customer = 1; touch(p, entryDay(e)); } });
  invDocs().forEach(function(r){ var p = P(r.customer); if(!p) return; p.get += r.gross; p.kinds.Customer = 1; touch(p, r.day); });
  poDocs().forEach(function(r){ var p = P(r.supplier); if(!p) return; p.give += r.gross; p.kinds.Supplier = 1; touch(p, r.day); });
  noteDocs("CN").forEach(function(r){ var p = P(r.party); if(p){ p.get -= r.gross; p.kinds.Customer = 1; touch(p, r.day); } });
  noteDocs("DN").forEach(function(r){ var p = P(r.party); if(p){ p.give -= r.gross; p.kinds.Supplier = 1; touch(p, r.day); } });
  payRows().forEach(function(e){
    if(e.payKind!=="AR" && e.payKind!=="AP") return;
    var p = P(e.customer); if(!p) return;
    var amt = num(e.qty) + num(e.wht);
    if(e.payKind==="AR") p.get -= amt; else p.give -= amt;
    touch(p, txnDay(e));
  });
  return Object.keys(map).map(function(k){ var p = map[k]; p.bal = p.get - p.give; return p; })
    .sort(function(a,b){ return a.last < b.last ? 1 : (a.last > b.last ? -1 : 0); });
}

function partyLedger(name){
  var rows = [];
  var op = partyRec(name);
  if(op && num(op.qty)) rows.push({day:"", label:"Opening balance", amt:num(op.qty)});
  invDocs().forEach(function(r){ if(r.customer===name) rows.push({day:r.day, label:"Sale invoice "+r.docNo, amt:r.gross}); });
  poDocs().forEach(function(r){ if(r.supplier===name) rows.push({day:r.day, label:"Purchase "+r.docNo, amt:-r.gross}); });
  noteDocs("CN").forEach(function(r){ if(r.party===name) rows.push({day:r.day, label:"Credit note "+r.docNo+(r.ref?" (inv "+r.ref+")":""), amt:-r.gross}); });
  noteDocs("DN").forEach(function(r){ if(r.party===name) rows.push({day:r.day, label:"Debit note "+r.docNo+(r.ref?" (bill "+r.ref+")":""), amt:r.gross}); });
  payRows().forEach(function(e){
    if(e.customer!==name) return;
    var amt = num(e.qty) + num(e.wht);
    var extra = (num(e.wht)>0 ? " (incl. tax "+rs(e.wht)+")" : "") + (e.chqNo ? " · chq "+e.chqNo : "");
    if(e.payKind==="AR") rows.push({day:txnDay(e), label:"Payment received"+extra, amt:-amt});
    if(e.payKind==="AP") rows.push({day:txnDay(e), label:"Payment made"+extra, amt:amt});
  });
  rows.sort(function(a,b){ return a.day < b.day ? -1 : (a.day > b.day ? 1 : 0); });
  var run = 0;
  rows.forEach(function(r){ run += r.amt; r.bal = run; });
  return rows;
}
function balWords(b){
  if(Math.abs(b) < 0.5) return {txt:"Settled", col:"var(--muted)"};
  return b > 0 ? {txt:"You'll Get", col:"var(--c-dc)"} : {txt:"You'll Give", col:"var(--bad)"};
}

function openParty(name){

      +  '<div class="row c2"><div><label for="np_phone">Contact no.</label><input id="np_phone" inputmode="tel" value="'+esc(st.phone)+'"></div>'

        st.addr = $("np_addr").value; st.phone = $("np_phone").value; st.ntn = $("np_ntn").value; st.gst = $("np_gst").value;

      var det = {address:String($("np_addr").value||"").trim(), phone:String($("np_phone").value||"").trim(), ntn:String($("np_ntn").value||"").trim(), gst:String($("np_gst").value||"").trim()};
      if(rec){ updateRow(rec.id, Object.assign({qty:v, category:st.kind}, det)).then(function(){ closeEdit(); toast("Saved"); }); return; }
      if(!name && partyList().some(function(p){ return p.name.toLowerCase()===nm.toLowerCase(); })){ toast("This party already exists"); return; }
      var n = Date.now();
      saveRows([{ type:"CFG", created:n, date:new Date(n).toISOString(), customer:nm, payKind:"PARTY",
        qty:v, rate:0, poNo:"", docNo:"", description:"Party", category:st.kind, poStatus:"",
        address:det.address, phone:det.phone, ntn:det.ntn, gst:det.gst,
        costingQty:0, deduction:0, matName:"", matQty:0, forSo:"", material:0, dyeing:0, labour:0, printing:0, overhead:0
      }]).then(function(){ closeEdit(); toast("Party saved"); });
    };
  }
  draw();
}

/* amount in words (international: thousand / million / billion) */
function numWords(n){
  n = Math.round(n);
  if(n === 0) return "Zero";
  var a = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  var t = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  function h(x){
    var s = "";
    if(x >= 100){ s += a[Math.floor(x/100)]+" Hundred"; x %= 100; if(x) s += " "; }
    if(x >= 20){ s += t[Math.floor(x/10)]; if(x%10) s += " "+a[x%10]; }
    else if(x > 0) s += a[x];
    return s;
  }
  var units = [[1e9,"Billion"],[1e6,"Million"],[1e3,"Thousand"]], out = [];
  units.forEach(function(u){ if(n >= u[0]){ out.push(h(Math.floor(n/u[0]))+" "+u[1]); n %= u[0]; } });
  if(n) out.push(h(n));
  return out.join(" ");
}

/* ---- fixed assets ---- */
var DEP_DEFAULT = 10;
function assetRows(){ return payRows().filter(function(e){ return e.payKind==="FAB"; }); }
function assetSale(a){ return payRows().filter(function(e){ return e.payKind==="FAS" && e.docNo===a.id; })[0] || null; }
function dayNum(d){ return Math.floor(Date.parse(d+"T00:00:00Z")/86400000); }
/* straight-line depreciation charged between two days (inclusive), never past cost or the sale date */
function depBetween(a, from, to){
  var cost = num(a.qty), rate = num(a.rate); if(!cost || !rate) return 0;
  var start = txnDay(a), sale = assetSale(a), end = sale ? txnDay(sale) : "9999-12-31";
  var f = from && from > start ? from : start, t = to && to < end ? to : end;
  if(t > todayDay()) t = todayDay();
  if(t < f) return 0;
  var perDay = cost*rate/100/365;
  var before = Math.min(cost, perDay*Math.max(0, dayNum(f)-dayNum(start)));
  var upto = Math.min(cost, perDay*(dayNum(t)-dayNum(start)+1));
  return Math.max(0, upto - before);
}
/* ---- fixed asset register (Vyapar style: list + per-asset ledger) ---- */
var OPENING_ACC = "__opening__";
function assetAdjRows(a){ return entries.filter(function(e){ return e.type==="FAV" && e.docNo===a.id; }); }
function manualAdj(a, onDay){
  var v = 0;
  assetAdjRows(a).forEach(function(e){ if(!onDay || entryDay(e) <= onDay) v += num(e.qty); });   /* + appreciate, - depreciate */
  return v;
}
function bookValue(a, onDay){ return num(a.qty) - depBetween(a, "", onDay || todayDay()) + manualAdj(a, onDay || todayDay()); }
function assetGain(a){ var s = assetSale(a); if(!s) return 0; return num(s.qty) - bookValue(a, addDays(txnDay(s), -1)); }
function assetParty(e){ return e.party || String(e.description||"").replace(/^(Bought from|Sold to)\s*/,""); }
function monthEnd(d){ var dt = new Date(d+"T00:00:00Z"); return new Date(Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth()+1, 0)).toISOString().slice(0,10); }

/* every entry that moved this asset's value, newest first */
function assetLedger(a){
  var rows = [], start = txnDay(a), sale = assetSale(a);
  var opening = a.account===OPENING_ACC;
  rows.push({day:start, t: opening ? "Opening asset" : "Purchase FA", party:assetParty(a), pay: opening ? "" : (a.account||DEFAULT_ACCOUNT), amt:num(a.qty), sign:1});
  var end = sale ? addDays(txnDay(sale), -1) : todayDay(), d = start;
  if(num(a.rate) > 0){
    while(d <= end){
      var me = monthEnd(d), to = me < end ? me : end;
      var v = depBetween(a, d, to);
      if(v > 0.005) rows.push({day:to, t: to===me ? "Depreciation" : "Depreciation (to date)", party:fmt(num(a.rate),1)+"% a year", pay:"", amt:v, sign:-1, auto:true});
      d = addDays(me, 1);
    }
  }
  assetAdjRows(a).forEach(function(e){
    rows.push({day:entryDay(e), t: num(e.qty) >= 0 ? "Appreciate" : "Depreciate", party:e.note||"", pay:"", amt:Math.abs(num(e.qty)), sign: num(e.qty)>=0?1:-1, id:e.id});
  });
  if(sale) rows.push({day:txnDay(sale), t:"Sale FA", party:assetParty(sale), pay:sale.account||DEFAULT_ACCOUNT, amt:num(sale.qty), sign:0, gain:assetGain(a)});
  rows.sort(function(x,y){ return x.day < y.day ? 1 : (x.day > y.day ? -1 : 0); });
  return rows;
}

function statusOf(t){

/* ================= quotations, credit notes, debit notes ================= */
var DOCK = {
  QT: {title:"Quotation", party:"Customer", noLbl:"Quotation no.", pre:"QT-", print:"QUOTATION"},
  CN: {title:"Sale Return / Credit Note", party:"Customer", noLbl:"Credit note no.", pre:"CN-", print:"CREDIT NOTE"},
  DN: {title:"Purchase Return / Debit Note", party:"Supplier", noLbl:"Debit note no.", pre:"DN-", print:"DEBIT NOTE"}
};
function rowsOf(type){ return entries.filter(function(e){ return e.type===type; }); }
function noteDocs(type){
  var g = {};
  rowsOf(type).forEach(function(e){
    var k = e.docNo || "(no number)";
    if(!g[k]) g[k] = {docNo:k, party:e.customer, day:entryDay(e), ref:e.refDoc||"", net:0, qty:0, rows:[], status:e.poStatus||""};
    g[k].net += num(e.qty)*num(e.rate); g[k].qty += num(e.qty); g[k].rows.push(e);
  });
  return Object.keys(g).map(function(k){ var r = g[k]; r.gst = r.net*GST_RATE; r.gross = r.net + r.gst; return r; });
}
/* credits that reduce what a party owes (CN for customers) or what we owe (DN for suppliers) */
function noteCredits(kind){
  return noteDocs(kind==="AR" ? "CN" : "DN").map(function(r){ return {party:r.party, docNo:r.ref, amt:r.gross, day:r.day, no:r.docNo}; });
}
function nextNoteNo(type){
  var max = 0, pre = DOCK[type].pre;
  rowsOf(type).forEach(function(e){ var m = String(e.docNo||"").match(/(\d+)\s*$/); if(m) max = Math.max(max, parseInt(m[1],10)); });
  return pre + String(max+1).padStart(3,"0");
}

  $("dq_save").onclick = function(){

/* ================= Manufacture popup (replaces the production tab) ================= */
var mf = null;
function pendingSoLines(item){
  var out = [];
  soNumbers().forEach(function(so){
    linesOfSO(so).forEach(function(d){
      if(item && d!==item) return;
      var li = lineInfo(so, d), bal = num(li.qty) - sumQty("WO", so, d);
      if(bal > 0) out.push({so:so, desc:d, bal:bal, cust:li.customer, cat:li.category, rate:num(li.rate)});
    });
  });
  return out;
}
function mfUnit(){ var m = mf && mf.item ? itemMaster(mf.item) : null; return (m && m.unit) || (mf && mf.item && finishedNames().indexOf(mf.item)>=0 ? itemUnit(mf.item) : "PC"); }
function openManufacture(item){
  mf = {item:item||"", so:"", cat:(item && itemCat(item)) || CATS[0], qty:"", cq:"", date:todayDay(), mats:[], costs:{}, note:""};
  drawMf();
}
function mfRead(){
  if(!mf || !$("mf_qty")) return;
  if($("mf_item")) mf.item = $("mf_item").value.trim();
  mf.qty = $("mf_qty").value; mf.date = $("mf_date").value || todayDay();
  if($("mf_cat")) mf.cat = $("mf_cat").value;
  (COST_FIELDS[mf.cat]||[]).forEach(function(f){ var i = $("mf_c_"+f); if(i) mf.costs[f] = i.value; });
}
/* material picked but not yet added with + Add material still counts */
function mfPending(){
  var n = ($("mf_mn")||{}).value, q = num(($("mf_mq")||{}).value);
  return (n && q>0) ? [{name:n, qty:q}] : [];
}
/* conversion costs are entered per unit of raw material issued (e.g. Rs per Bundle) */
function mfTotals(withPending){
  var mats = mf.mats.concat(withPending===false ? [] : mfPending());
  var mat = mats.reduce(function(a,m){ return a + m.qty*invAvg(m.name); }, 0);
  var base = mats.reduce(function(a,m){ return a + m.qty; }, 0);
  var unit = mats.length ? itemUnit(mats[0].name) : mfUnit();
  if(!mats.length) base = num(mf.qty);
  var rates = {}, oth = 0;
  (COST_FIELDS[mf.cat]||[]).forEach(function(f){ if(f==="material") return; rates[f] = num(mf.costs[f]); oth += rates[f]*base; });
  var q = num(mf.qty);
  return {mat:mat, oth:oth, total:mat+oth, per: q>0 ? (mat+oth)/q : 0, base:base, unit:unit, rates:rates};
}
function mfTotHTML(T){
  return '<span class="muted">Material '+rs(T.mat)+' &middot; dyeing/labour/overhead '+rs(T.oth)+(T.base?' on '+fmt(T.base, T.base%1?2:0)+' '+esc(T.unit):'')
    + (T.per?' &middot; Rs '+fmt(T.per,2)+' per '+esc(mfUnit()):'')+'</span><span class="big">'+rs(T.total)+'</span>';
}
function mfRefresh(){
  if(!$("mf_qty")) return; mfRead(); var T = mfTotals();
  if($("mf_tot")) $("mf_tot").innerHTML = mfTotHTML(T);
  Array.prototype.forEach.call(document.querySelectorAll(".mf_ru"), function(s){ s.textContent = T.unit; });
  mfStockCheck();
}
function mfStockCheck(){
  var mn = $("mf_mn"), mq = $("mf_mq"), hint = $("mf_mhint"), sv = $("mf_save"); if(!sv) return;
  var need = {}; (mf.mats||[]).forEach(function(m){ need[m.name] = (need[m.name]||0) + num(m.qty); });
  if(mn && mn.value && mq && num(mq.value)>0) need[mn.value] = (need[mn.value]||0) + num(mq.value);
  var short = Object.keys(need).filter(function(n){ return need[n] > invQty(n) + 0.0001; })[0];
  if(hint && mn && mn.value){ var v = mn.value, u = itemUnit(v);
    if(short===v){ hint.textContent = "Only "+fmt(invQty(v),2)+" "+u+" in stock — cannot issue "+fmt(need[v],2); hint.style.color = "var(--bad)"; }
    else { hint.textContent = fmt(invQty(v),2)+" "+u+" in stock · Rs "+fmt(invAvg(v),2)+" per "+u; hint.style.color = ""; } }
  sv.disabled = !!short; sv.style.opacity = short ? "0.45" : "";
  sv.title = short ? "Not enough "+short+" in stock" : "";
}
function drawMf(){
  var pend = pendingSoLines(mf.item);
  var lockItem = !!mf.so;
  var h = '<div class="modal" id="mOverlay"><div class="sheet" style="max-width:760px"><h2>Manufacture item</h2>'
    + '<p class="muted" style="font-size:13px;margin:4px 0 12px">Raw material is issued from stock at average cost; the other costs are added on top. The finished item goes into stock at the total cost.</p>';
  h += '<div class="row c2"><div><label for="mf_item">Item to manufacture</label>'
    + '<select id="mf_item"'+(lockItem?' disabled':'')+'><option value="">Select finished good…</option>'
    + finishedNames().map(function(n){ return '<option'+(mf.item===n?" selected":"")+'>'+esc(n)+'</option>'; }).join("")+'</select>'
    + '<div class="hint">New item? Add it first from Items &rarr; + Add Item.</div></div>'
    + '<div><label for="mf_so">Against sale order</label><select id="mf_so"><option value="">For stock &mdash; no SO</option>'
    + pend.map(function(p){ var v = p.so+"||"+p.desc; return '<option value="'+esc(v)+'"'+(mf.so===v?" selected":"")+'>'+esc(p.so+" · "+p.desc+" · "+fmt(p.bal)+" pending · "+(p.cust||""))+'</option>'; }).join("")
    + '</select></div></div>';
  h += '<div class="row c3"><div><label for="mf_qty" id="mf_ql">Quantity made ('+esc(mfUnit())+')</label><input id="mf_qty" inputmode="decimal" value="'+esc(mf.qty)+'"></div>'
    + '<div><label for="mf_date">Date</label><input id="mf_date" type="date" value="'+esc(mf.date)+'"></div>'
    + '<div><label for="mf_cat">Category</label><select id="mf_cat"'+(lockItem?' disabled':'')+'>'+CATS.map(function(c){ return '<option'+(mf.cat===c?" selected":"")+'>'+c+'</option>'; }).join("")+'</select></div></div>';

  /* raw material */
  h += '<div class="sec-title">Raw material issued</div>';
  var mats = materials().filter(function(m){ return m!==mf.item; });
  if(!mats.length) h += '<div class="banner warn">No raw material items yet. Add them from Items, then post a purchase bill.</div>';
  mf.mats.forEach(function(m, i){
    h += '<div class="linerow"><div class="g"><div class="t">'+esc(m.name)+'</div><div class="s">'+fmt(m.qty,2)+' '+esc(itemUnit(m.name))
      +  (isOwner ? ' &middot; @ Rs '+fmt(invAvg(m.name),2)+' = '+rs(m.qty*invAvg(m.name)) : '')+'</div></div>'
      +  '<button class="x" data-mfrm="'+i+'" aria-label="Remove">&times;</button></div>';
  });
  if(mats.length){
    h += '<div class="row c3" style="align-items:end"><div><label for="mf_mn">Material</label><select id="mf_mn"><option value="">Select…</option>'
      +  mats.map(function(m){ return '<option value="'+esc(m)+'">'+esc(m)+'</option>'; }).join("")+'</select></div>'
      +  '<div><label for="mf_mq" id="mf_mql">Quantity issued</label><input id="mf_mq" inputmode="decimal"><div class="hint" id="mf_mhint"></div></div>'
      +  '<div><button class="btn sec" id="mf_madd" style="margin-bottom:14px">+ Add material</button></div></div>';
  }
  /* other costs */
  var fields = (COST_FIELDS[mf.cat]||[]).filter(function(f){ return f!=="material"; });
  if(fields.length){
    var T0 = mfTotals();
    h += '<div class="sec-title">Additional costs &mdash; Rs per <span class="mf_ru">'+esc(T0.unit)+'</span> of material issued</div><div class="row c4">';
    fields.forEach(function(f){ h += '<div><label for="mf_c_'+f+'">'+COST_LABEL[f]+' (Rs / <span class="mf_ru">'+esc(T0.unit)+'</span>)</label><input id="mf_c_'+f+'" inputmode="decimal" value="'+esc(mf.costs[f]||"")+'" placeholder="0"></div>'; });
    h += '</div>';
  }
  var T = mfTotals();
  if(isOwner) h += '<div class="totals" id="mf_tot">'+mfTotHTML(T)+'</div>';
  h += '<div style="display:flex;gap:10px;margin-top:14px"><button class="btn sec" id="mf_cancel" style="flex:1">Cancel</button>'
    +  '<button class="btn" id="mf_save" style="flex:1;background:#D93848">Save &amp; add to stock</button></div></div></div>';
  $("modalHost").innerHTML = h;

  $("mf_cancel").onclick = function(){ mf = null; closeEdit(); };
  $("mOverlay").addEventListener("click", function(ev){ if(ev.target.id==="mOverlay"){ mf = null; closeEdit(); } });
  $("mf_so").onchange = function(){
    mfRead(); mf.so = $("mf_so").value;
    if(mf.so){ var p = pend.filter(function(x){ return x.so+"||"+x.desc===mf.so; })[0];
      if(p){ mf.item = p.desc; mf.cat = p.cat || mf.cat; if(!num(mf.qty)) mf.qty = String(p.bal); } }
    drawMf();
  };
  $("mf_cat").onchange = function(){ mfRead(); drawMf(); };
  if($("mf_mn")) $("mf_mn").onchange = function(){ var v = $("mf_mn").value; $("mf_mql").textContent = "Quantity issued"+(v ? " ("+itemUnit(v)+")" : "");
    $("mf_mhint").textContent = ""; mfRefresh(); };
  if($("mf_item")) $("mf_item").onchange = function(){ mfRead(); mf.cat = itemCat(mf.item) || mf.cat; drawMf(); };
  if($("mf_madd")) $("mf_madd").onclick = function(){
    mfRead();
    var n = $("mf_mn").value, q = num($("mf_mq").value);
    if(!n || q<=0){ toast("Pick the material and quantity"); return; }
    var used = mf.mats.reduce(function(a,m){ return a + (m.name===n ? m.qty : 0); }, 0);
    if(q + used > invQty(n) + 0.0001){ toast("Only "+fmt(Math.max(0,invQty(n)-used),2)+" "+itemUnit(n)+" of "+n+" in stock"); return; }
    mf.mats.push({name:n, qty:q}); drawMf();
  };
  Array.prototype.forEach.call(document.querySelectorAll("[data-mfrm]"), function(b){
    b.onclick = function(){ mfRead(); mf.mats.splice(parseInt(b.dataset.mfrm,10),1); drawMf(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("#mOverlay input"), function(i){
    i.addEventListener("input", mfRefresh);
  });
  $("mf_save").onclick = function(){
    mfRead();
    /* a material picked but not yet added counts too */
    var pn = ($("mf_mn")||{}).value, pq = num(($("mf_mq")||{}).value);
    if(pn && pq>0){ mf.mats.push({name:pn, qty:pq}); }
    var need = {};
    mf.mats.forEach(function(m){ need[m.name] = (need[m.name]||0) + m.qty; });
    var short = Object.keys(need).filter(function(nm2){ return need[nm2] > invQty(nm2) + 0.0001; })[0];
    if(short){ if(pn && pq>0) mf.mats.pop(); toast("Not enough "+short+": "+fmt(Math.max(0,invQty(short)),2)+" "+itemUnit(short)+" in stock"); return; }
    if(!mf.item){ toast("Enter the item to manufacture"); return; }
    if(num(mf.qty) <= 0){ toast("Enter the quantity made"); return; }
    if(materials().length && !mf.mats.length && !confirm("No raw material issued. Save anyway?")) return;
    var so = "", li = null;
    if(mf.so){ so = mf.so.split("||")[0]; li = lineInfo(so, mf.item); }
    var T3 = mfTotals(false), n = Date.now();
    var row = { type:"WO", created:n, date:mf.date+"T00:00:00.000Z", customer: li ? li.customer : "", poNo:so, docNo:nextDocNo(),
      description:mf.item, category:mf.cat, qty:num(mf.qty), rate: li ? num(li.rate) : 0, poStatus:"",
      costingQty:mf.mats.reduce(function(a,m){ return a + num(m.qty); }, 0), deduction:0, matName:(mf.mats[0]||{}).name||"", matQty:(mf.mats[0]||{}).qty||0, mats:mf.mats.slice(),
      forSo:"", payKind:"", note:mf.note||"", material:T3.mat, dyeing:0, labour:0, printing:0, overhead:0 };
    (COST_FIELDS[mf.cat]||[]).forEach(function(f){ if(f!=="material"){ row[f] = Math.round(T3.rates[f]*T3.base*100)/100; row[f+"Rate"] = T3.rates[f]; } });
    row.costBase = T3.base; row.costUnit = T3.unit;
    var btn = $("mf_save"); btn.disabled = true;
    saveRows([row]).then(function(){ mf = null; closeEdit(); toast(row.docNo+" saved — "+fmt(row.qty)+" PC added to stock"); })
      .catch(function(){ btn.disabled = false; toast("Could not save — try again"); });
  };
}

/* ================= Items: Vyapar-style list + detail ================= */

function itemDetailHTML(it){

    + '<span class="muted">'+("Avg cost per "+esc(it.unit))+': <b style="color:var(--c-dc)">Rs '+fmt(it.unit==="KG"?pr:it.cost,2)+'</b></span><span class="muted">Stock value: <b style="color:var(--c-dc)">'+money2(it.value)+'</b></span></div>'
    : '<div class="muted" style="font-size:13px;margin-top:6px">Stock: '+fmt(it.stock,dp)+' '+it.unit+'</div>')+'</div>';

    + '<button class="btn sm" id="itMfg" style="width:auto;padding:0 16px;background:#D93848">Manufacture item</button></div>';

      +  '<div><label for="ni_cat">Category</label><select id="ni_cat">'+CATS.map(function(c){ return '<option'+(st.cat===c?" selected":"")+'>'+c+'</option>'; }).join("")+'</select></div></div>';

      +  '<div><label for="ni_or">Cost per unit (Rs, ex-GST)</label><input id="ni_or" inputmode="decimal" value="'+esc(k.orr)+'" placeholder="e.g. 126.67"><div class="hint" id="ni_hint"></div></div>'
      +  '<div><label for="ni_od">As of date</label><input id="ni_od" type="date" value="'+esc(k.od)+'"></div></div>';

    $("modalHost").innerHTML = h;
    function niHint(){ var q = num(val("ni_oq")), v = num(val("ni_or")); $("ni_hint").textContent = (q>0 && v>0) ? "Total stock value Rs "+fmt(q*v,2) : ""; }
    niHint();
    $("ni_oq").oninput = niHint; $("ni_or").oninput = niHint;
    Array.prototype.forEach.call(document.querySelectorAll("[data-itp]"), function(b){

        var kk = {name:val("ni_name"), sale:val("ni_sale"), oq:val("ni_oq"), orr:val("ni_or"), od:val("ni_od")};
        st.itype = b.dataset.itp; st.cat = val("ni_cat");

    });

      if(nm.toLowerCase()!==String(editName||"").toLowerCase() && allItemNames().some(function(x){ return x.toLowerCase()===nm.toLowerCase(); })){ toast(nm+" already exists"); return; }
      var oq = num(val("ni_oq")), orate = num(val("ni_or"));
      if(oq > 0 && orate <= 0){ toast("Enter the cost per unit of the opening stock"); return; }
      var n = Date.now(), od = val("ni_od") || todayDay();
      var base = {poNo:"", docNo:"", poStatus:"", costingQty:0, deduction:0, matName:"", matQty:0, forSo:"", material:0, dyeing:0, labour:0, printing:0, overhead:0};
      var mfields = {customer:nm, itype:st.itype, unit:val("ni_unit"), category:val("ni_cat"), rate:num(val("ni_sale"))};
      var jobs = [];
      if(m0) jobs.push(updateRow(m0.id, mfields));
      else jobs.push(saveRows([Object.assign({type:"CFG", created:n, date:new Date(n).toISOString(), payKind:"ITEM", description:"Item", qty:0}, base, mfields)]));
      if(op0){
        if(oq > 0) jobs.push(updateRow(op0.id, {qty:oq, rate:orate, date:od+"T00:00:00.000Z", description:nm}));
        else jobs.push(deleteRow(op0.id));
      } else if(oq > 0){
        jobs.push(saveRows([Object.assign({type:"ADJ", created:n+1, date:od+"T00:00:00.000Z", customer:"", description:nm, category:val("ni_cat"),
          qty:oq, rate:orate, note:"Opening stock", payKind:""}, base)]));
      }
      if(editName && nm!==editName){
        entries.forEach(function(e){
          if(e===m0 || e===op0 || e.type==="CFG") return;
          var patch = {};
          if(e.description===editName) patch.description = nm;
          if(e.matName===editName) patch.matName = nm;
          if(e.mats && e.mats.some(function(x){ return x.name===editName; })) patch.mats = e.mats.map(function(x){ return x.name===editName ? {name:nm, qty:x.qty} : x; });
          if(Object.keys(patch).length) jobs.push(updateRow(e.id, patch));
        });
      }
      selItem = nm;
      Promise.all(jobs).then(function(){ closeEdit(); selItem = nm; render(); toast(editName ? "Item updated" : "Item "+nm+" added"); })
        .catch(function(){ toast("Could not save — try again"); });
    };
  }
  draw();
}

var selAcc = "";
var TXN_TYPE = {AR:"Payment-In", AP:"Payment-Out", EXP:"Expense", IN:"Deposit", OUT:"Withdrawal", FAB:"Purchase FA", FAS:"Sale FA", WHTP:"WHT deposit", GSTP:"GST deposit"};
function accTxns(name){
  var rows = [];
  payRows().forEach(function(e){
    if(e.account===OPENING_ACC) return;
    var from = e.account || DEFAULT_ACCOUNT, to = e.toAccount || DEFAULT_ACCOUNT;
    if(e.payKind==="TRF"){
      if(from===name) rows.push({e:e, t:"Transfer to "+to, name:e.description||"", amt:-num(e.qty)});
      if(to===name)   rows.push({e:e, t:"Transfer from "+from, name:e.description||"", amt:num(e.qty)});
      return;
    }
    if(from!==name) return;
    var d = txnDir(e);
    rows.push({e:e, t:TXN_TYPE[e.payKind]||"Entry", name: e.customer || e.description || "", amt: d * num(e.qty)});
  });
  rows.forEach(function(r){ r.day = txnDay(r.e); r.pdc = isPdc(r.e); });
  rows.sort(function(a,b){ return a.day===b.day ? (b.e.created||0)-(a.e.created||0) : (a.day < b.day ? 1 : -1); });
  return rows;
}

function pad(n, w){ n = String(n); while(n.length < w) n = "0"+n; return n; }
function maxSeq(list, re){ var m = 0; list.forEach(function(v){ var x = re.exec(String(v||"")); if(x) m = Math.max(m, parseInt(x[x.length-1],10)); }); return m; }

  var mmyy = (day||todayDay()).slice(5,7) + (day||todayDay()).slice(2,4);

function openTermForm(done){
  $("modalHost").innerHTML = '<div class="modal" id="mOverlay"><div class="sheet" style="max-width:420px"><h2>Add payment terms</h2>'
    + '<div class="row c2" style="margin-top:12px"><div><label for="tm_name">Name</label><input id="tm_name" placeholder="e.g. 90 days"></div>'
    + '<div><label for="tm_days">Days until due</label><input id="tm_days" inputmode="numeric" placeholder="90"></div></div>'
    + '<div style="display:flex;gap:10px;margin-top:14px"><button class="btn sec" id="tm_cancel" style="flex:1">Cancel</button><button class="btn" id="tm_save" style="flex:1">Save</button></div></div></div>';
  $("tm_cancel").onclick = function(){ closeEdit(); done(null); };
  $("tm_days").oninput = function(){ if(!$("tm_name").dataset.typed) $("tm_name").value = $("tm_days").value ? $("tm_days").value+" days" : ""; };
  $("tm_name").oninput = function(){ $("tm_name").dataset.typed = "1"; };
  $("tm_save").onclick = function(){
    var d = Math.round(num($("tm_days").value)), nm = String($("tm_name").value||"").trim() || (d+" days");
    if(d <= 0 || d > 365){ toast("Enter the days (1 to 365)"); return; }
    if(termOptions().some(function(o){ return num(o[0])===d; })){ closeEdit(); done(String(d)); return; }
    var n = Date.now();
    saveRows([{type:"CFG", created:n, date:new Date(n).toISOString(), customer:nm, payKind:"TERM", qty:d, rate:0, poNo:"", docNo:"",
      description:"Payment terms", category:"", poStatus:"", costingQty:0, deduction:0, matName:"", matQty:0, forSo:"", material:0, dyeing:0, labour:0, printing:0, overhead:0}])
      .then(function(){ closeEdit(); toast("Terms "+nm+" added"); done(String(d)); });
  };
}
function gDue(){
  if(GE.terms==="keep") return GE.dueFixed || GE.date;
  var d = GE.terms==="default" ? (GE.party ? creditDays(GE.party, GE.type==="PO"?"AP":"AR") : DEFAULT_CREDIT) : num(GE.terms);
  return addDays(GE.date, d);
}
function gTotals(){
  var amt = 0, qty = 0, kg = 0;
  GE.lines.forEach(function(L){ amt += num(L.qty)*num(L.rate); qty += num(L.qty); kg += num(L.kg); });
  var gst = GE.type==="INV" ? amt*GST_RATE : (GE.type==="PO" && GE.gstOn!==false ? amt*GST_RATE : 0);
  return {amt:amt, qty:qty, kg:kg, gst:gst, total:amt+gst};
}
function soPending(party){
  var out = [];
  soNumbers().forEach(function(so){
    var info = soInfo(so); if(!info || (party && info.customer!==party)) return;
    var ls = linesOfSO(so).map(function(d){ var li = lineInfo(so, d); return {item:d, qty:num(li.qty)-sumQty("DC", so, d), rate:num(li.rate), desc:li.spec||""}; })
      .filter(function(l){ return l.qty > 0; });
    if(ls.length) out.push({so:so, lines:ls, custPo:info.custPo||""});
  });
  return out;
}
function unbilledDcs(party){ return dcDocs().filter(function(d){ return !d.billed && (!party || d.customer===party); }); }

         .map(function(o){ return '<option value="'+o[0]+'"'+(GE.terms===o[0]?" selected":"")+'>'+esc(o[1])+'</option>'; }).join("")
      +  '<option value="__new__">+ Add new terms…</option></select></div>'
      +  '<div class="ge-kv"><span>Due Date</span><b id="g_due">'+esc(dmy(gDue()))+'</b></div>';

    h += '<div class="ge-kv"><span>Against SO</span><select id="g_so"><option value="">No SO &mdash; from stock</option>'

  if(t==="INV"){

    +  (t==="DC" && !GE.edit ? '<label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="g_alsoinv" style="width:auto"'+(GE.alsoInv?" checked":"")+'> Also create the sale invoice now ('+esc(nextInvNo())+')</label>' : '')
