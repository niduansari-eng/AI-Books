  border: 1px solid rgba(255,255,255,0.06);
}
.hw-msg.hw-user .hw-bubble {
  background: #F59E0B;
  color: #0E141B;
  border-radius: 14px 4px 14px 14px;
  font-weight: 500;
}
.hw-dot-anim {
  display: inline-flex; gap: 4px; align-items: center; padding: 4px 2px;
}
.hw-dot-anim span {
  width: 6px; height: 6px; border-radius: 50%;
  background: #7A9BB5;
  animation: hw-dots 1.2s infinite;
}
.hw-dot-anim span:nth-child(2) { animation-delay: 0.2s; }
.hw-dot-anim span:nth-child(3) { animation-delay: 0.4s; }
@keyframes hw-dots { 0%,80%,100%{opacity:0.3;transform:scale(0.8)} 40%{opacity:1;transform:scale(1)} }

#hw-chips {
  padding: 0 14px 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  flex-shrink: 0;
}
.hw-chip {
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 11.5px;
  font-weight: 500;
  padding: 5px 11px;
  border-radius: 20px;
  border: 1px solid rgba(245,158,11,0.3);
  background: rgba(245,158,11,0.07);
  color: #F59E0B;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  white-space: nowrap;
}
.hw-chip:hover { background: rgba(245,158,11,0.15); border-color: rgba(245,158,11,0.5); }

#hw-form {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 10px 12px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid #2A3846;
  background: #1C2A3A;
  flex-shrink: 0;
}
#hw-input {
  flex: 1;
  background: #1A242F;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 9px 14px;
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 13px;
  color: #E8EEF4;
  outline: none;
  min-width: 0;
  transition: border-color 0.15s;
}
#hw-input::placeholder { color: #4A6480; }
#hw-input:focus { border-color: rgba(245,158,11,0.4); }
#hw-send {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: none;
  background: #F59E0B;
  color: #0E141B;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background 0.15s, transform 0.1s;
}
#hw-send:hover { background: #D97706; }
#hw-send:active { transform: scale(0.92); }
#hw-send:disabled { background: #3A5068; color: #7A9BB5; cursor: not-allowed; }
</style>

<!-- Floating trigger button -->
<button id="hw-btn" onclick="hwToggle()" aria-label="Ask your Peer">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
  </svg>
  <span class="hw-label">Ask AI</span>
  <span class="hw-pulse"></span>
</button>

<!-- Chat panel -->
<div id="hw-panel" role="dialog" aria-label="PeerBooks Assistant">
  <!-- Header -->
  <div id="hw-head">
    <div class="hw-avatar">📊</div>
    <div class="hw-info">
      <div class="hw-title">Ask your Peer</div>
      <div class="hw-sub">Business insights · Powered by AI</div>
    </div>
    <button id="hw-minimize" onclick="hwMinimize()" aria-label="Minimize chat" title="Minimize">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="18 15 12 9 6 15"/></svg>
    </button>
    <button id="hw-close" onclick="hwClose()" aria-label="Close chat" title="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <!-- Messages -->
  <div id="hw-msgs">
    <div class="hw-msg hw-bot">
      <div class="hw-bubble">Assalam o Alaikum! 👋<br>I'm your PeerBooks AI — your AI Accountant. Ask me anything about your business — profit trends, expense analysis, cash flow, or monthly summaries.</div>
    </div>
  </div>

  <!-- Quick chips -->
  <div id="hw-chips">
    <button class="hw-chip" onclick="hwAsk('Why did profit drop this month?')">📉 Profit drop?</button>
    <button class="hw-chip" onclick="hwAsk('Which expense head increased the most?')">📊 Top expense spike</button>
    <button class="hw-chip" onclick="hwAsk('Give me a monthly business summary')">📋 Monthly summary</button>
    <button class="hw-chip" onclick="hwAsk('How can we improve profit margins?')">💡 Improve margins</button>
    <button class="hw-chip" onclick="hwAsk('Show cash flow analysis')">💰 Cash flow</button>
  </div>

  <!-- Input form -->
  <div id="hw-form">
    <input id="hw-input" type="text" placeholder="Ask about profit, expenses, trends…"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();hwSend()}"
      autocomplete="off" />
    <button id="hw-send" onclick="hwSend()" aria-label="Send">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>

<script>
(function(){
  var panel = document.getElementById('hw-panel');
  var input = document.getElementById('hw-input');
  var msgs  = document.getElementById('hw-msgs');
  var send  = document.getElementById('hw-send');
  var chips = document.getElementById('hw-chips');
  var busy  = false;

  window.hwToggle = function(){ panel.classList.contains('hw-open') ? hwClose() : hwOpen(); };
  window.hwOpen   = function(){
    panel.classList.add('hw-open');
    document.body.classList.add('chat-open');
    setTimeout(function(){ input.focus(); }, 220);
  };
  window.hwClose  = function(){
    panel.classList.remove('hw-open');
    document.body.classList.remove('chat-open');
  };
  window.hwMinimize = function(){
    panel.classList.remove('hw-open');
    document.body.classList.remove('chat-open');
  };

  window.hwAsk = function(text){
    hwOpen();
    input.value = text;
    hwSend();
  };

  window.hwSend = function(){
    var text = input.value.trim();
    if(!text || busy) return;
    busy = true;
    send.disabled = true;
    chips.style.display = 'none';
    input.value = '';

    // User bubble
    var um = document.createElement('div');
    um.className = 'hw-msg hw-user';
    um.innerHTML = '<div class="hw-bubble">' + hwEsc(text) + '</div>';
    msgs.appendChild(um);

    // Typing indicator
    var bm = document.createElement('div');
    bm.className = 'hw-msg hw-bot';
    bm.innerHTML = '<div class="hw-bubble"><div class="hw-dot-anim"><span></span><span></span><span></span></div></div>';
    msgs.appendChild(bm);
    msgs.scrollTop = msgs.scrollHeight;

    fetch('https://naveedhasan.app.n8n.cloud/webhook/prompt-router', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    })
    .then(function(r){ return r.json(); })
    .then(function(data){
      var reply = data.text || data.output || data.message || data.response ||
                  (typeof data === 'string' ? data : JSON.stringify(data));
      bm.querySelector('.hw-bubble').innerHTML = hwFmt(reply);
    })
    .catch(function(err){
      bm.querySelector('.hw-bubble').innerHTML =
        '<span style="color:#E5484D">⚠ Could not reach PeerBooks AI. Please check your connection.</span>';
    })
    .finally(function(){
      busy = false;
      send.disabled = false;
      msgs.scrollTop = msgs.scrollHeight;
    });
  };

  function hwEsc(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function hwFmt(s){
    // Basic markdown: bold, newlines
    return hwEsc(s)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\n/g, '<br>');
  }
})();
</script>

</body>
</html>
